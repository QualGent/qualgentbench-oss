# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# MedTimer — journey-mode test cases (one episode = this app + one test case).
#
# Seeded state (assets/medtimer/medTimer.db + device_setup): Aspirin, stock 10, one
# reminder 8:00 AM dosage 2. Ibuprofen, stock 10. Today's Overview shows a logged
# "Ibuprofen (2.5)" dose (Taken) and a raised "Ibuprofen (4)" reminder whose status
# icon ("Reminded") opens Taken / Skipped / Reschedule. Bottom tabs: Overview,
# Medicine, Analysis (with a Tabular view). A medicine's screen (Medicine tab) has its
# name, a stock screen and its reminders with inline time and dosage; leaving saves.
# Passive defects sit on the Medicine tab's list rows: "(N left)" one lower than the
# stock, and Aspirin's reminder time one hour late. A display bug is only ON for the
# cases whose `bugs:` list it, so it is scored exactly there.

app: medtimer

# The journey build of this app: dist/medtimer/buggy.apk as built for these cases, to be
# published at this path on HuggingFace. Journey mode fetches it from here (cache slot
# journey/) instead of the benchmark spec's hunt build; a local dist/ copy still wins.
#
# The hash below IS the artifact this branch was derived against (QUA-2728, epic
# QUA-2723): a build of ref v1.25.2 with all 12 seeded defects (13 patch sites) — the 9
# QUA-2710/2711 shipped plus new-reminder-time-crash, dose-edit-save-crash and
# stock-button-opens-settings — built by `build_app.py medtimer --buggy` into a fresh
# clone that had no Gradle `build/` directory at all (docs/adding-an-app.md: only a
# clean build's hash is one a reviewer can reproduce). The four pruned persistence
# defects are still IN it: their patches stay for the hard tier, and no journey case
# switches them on. Installed and confirmed by hash (qg_app_build_fingerprint, before and
# after), then agreed 8/8 by
#     scripts/derive_journey.py medtimer --repeat 3 --device emulator-5556
# on 2026-09-18 (android-35, AVD qgbench_root), staged at 00:00:49 device time so every
# pass fell on one device day (see TODO(fixture) on medtimer-correct-dose-amount): every
# clean arm HOLDS 3/3, every seeded arm exactly what its `bugs:` imply 3/3, 16/16
# stability checks gave the same label in all three trials, and no clean pass fired any
# marker.
#
# The six cases this build carries a death or a wrong screen for, all `--repeat 3`
# (mandatory for any crash, ANR or stuck-screen case — one trial cannot measure a margin):
#   * medtimer-add-medicine-back-to-list (QUA-2710) — CRASHED 3/3 on
#     java.util.NoSuchElementException out of MedicineCardKt.MedicineCard.
#   * medtimer-take-dose-then-medicine-list (QUA-2711) — CRASHED 3/3, kind `anr`, at
#     step 4: "Input dispatching timed out (… Pop-Up Window …) Waited 5006-5011ms".
#     Its row was re-derived ALONE on this same build (hash confirmed before and after)
#     once QUA-2735 scoped its reminder tap to Ibuprofen's row: `--case` it, `--repeat 3`,
#     emulator-5558, staged 15:49 CDT — after 08:00, with Aspirin's reminder raised and
#     listed first, the condition that had failed it. Clean HOLDS 3/3 (Ibuprofen 10 -> 6
#     left, Aspirin untouched at 10); seeded CRASHED 3/3 kind `anr`, Pop-Up Window,
#     Waited 5005-5008ms, its own marker fired and none on a clean pass.
#   * medtimer-analysis-tabular-view (QUA-2711) — clean probe answered in 542-553 ms
#     3/3; seeded probe unanswered 3/3 -> ANR on MainActivity.
#   * medtimer-add-reminder (QUA-2728) — CRASHED 3/3 at "Create reminder" on
#     java.time.DateTimeException: Invalid value for MinuteOfHour (valid values 0 - 59):
#     480, out of NewReminderDialog.
#   * medtimer-correct-dose-amount (QUA-2728) — CRASHED 3/3 when the editor closed, on
#     java.lang.StringIndexOutOfBoundsException: begin 0, end 500, length 0, out of
#     EditEventViewModel.updateEvent.
#   * medtimer-check-stock (QUA-2728) — seeded VIOLATED 3/3: the stock button lands on
#     Medicine settings (no "Amount" row); clean HOLDS 3/3 on the stock screen.
# Each fired its own marker on the seeded arm only, and none on any clean arm; the three
# crash cases record the LAUNCHER as the seeded post-crash screen, and no recorded screen
# of any pass shows another app (the QUA-2733 home-before-launch fix held). The
# check-stock marker does not crash, so derive_journey never prints it: it was read with
# verify.canary.fired_markers straight after the derive, whose last pass is that case's
# seeded trial 3/3 (clean runs before seeded, and the case is last in this file), and read
# ['stock-button-opens-settings'].
#
# NOT YET PUBLISHED. journey/medtimer-buggy.apk on HuggingFace still holds the previous
# build (d6bcefe3…, 71325805 bytes, QUA-2710/2711). Until an owner uploads this one
#     HF_TOKEN=... uv run python scripts/publish_apk.py medtimer --kind journey \
#         --write --upload --yes
# a fresh clone's journey download fails its sha256 check — loudly, by design (below);
# a local dist/medtimer/buggy.apk still wins.
#
# The hash is written rather than left stale ON PURPOSE, and QUA-2710 is why the rule
# exists: a stale hash downloads the PUBLISHED build, which has none of these patches in
