# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# MedTimer — journey-mode test cases (one episode = this app + one test case).
#
# Seeded state (assets/medtimer/medTimer.db + device_setup): Aspirin, stock 10, one
# reminder 8:00 AM dosage 2. Ibuprofen, stock 10. Today's Overview shows a logged
# "Ibuprofen (2.5)" dose (Taken) and a raised "Ibuprofen (4)" reminder whose status
# icon ("Reminded") opens Taken / Skipped / Reschedule. Bottom tabs: Overview,
# Medicine, Analysis (with a Tabular view). A medicine's screen (Medicine tab) has its
# name, a stock screen and its reminders with inline time and dosage; leaving saves.
# Passive defects sit on the Medicine tab's list rows: "(N left)" one lower than the
# stock, and Aspirin's reminder time one hour late. A display bug is only ON for the
# cases whose `bugs:` list it, so it is scored exactly there.

app: medtimer

# The journey build of this app: dist/medtimer/buggy.apk as built for these cases, to be
# published at this path on HuggingFace. Journey mode fetches it from here (cache slot
# journey/) instead of the benchmark spec's hunt build; a local dist/ copy still wins.
# TODO(derive, QUA-2710): THE HASH BELOW IS NOT YET DERIVED AGAINST. It is a clean
# build (empty app/build) of ref v1.25.2 with all 8 patches, which is the only artifact
# that contains `medicine-list-empty-reminders-crash` at all — but no device was free
# long enough to run
#     scripts/derive_journey.py medtimer --case medtimer-add-medicine-back-to-list \
#         --repeat 3 --device <serial>
# against it, so `data/truth/journey-medtimer.json` has NO row for that case and the
# exemplar is UNVALIDATED. Derive before anyone runs a board over it.
#
# TODO(publish, QUA-2710): THE UPLOAD IS ALSO OUTSTANDING — hash and file are not yet
# one fact, so every fresh clone fails its sha256 check until an owner runs:
#     HF_TOKEN=<write token> uv run python scripts/publish_apk.py medtimer \
#         --kind journey --write --upload --yes
#
# The hash is written rather than left stale ON PURPOSE, and this case is why the rule
# exists: the previous hash downloads the PUBLISHED build, which has no crash patch in
# it, so the seeded arm quietly does NOT crash and both arms agree with the clean build
# — stably, for as many --repeat trials as you pay for. That is exactly how QUA-2710's
# first derive run was lost (derive_journey.py installs nothing; it drives whatever
# build is already on the device). A wrong-but-loud hash fails closed instead.
apk:
  repo: qualgent/qualgentbench-apps
  filename: journey/medtimer-buggy.apk
  sha256: 5e69a8c6f02cb85193b40f00d9dd8905a10ec28ffd25258c54588f5f1150fef7
  size_bytes: 71325805

defects:
  - id: stock-decrement-ignores-amount
    kind: functional
    tier: L3
    symptoms: ["by 1", "by one", "only one", "9 instead", "dropped by", "stock"]
  - id: event-skip-not-saved
    kind: functional
    tier: L2
    symptoms: ["skip", "skipped", "still taken", "shows taken"]
  - id: reminder-amount-edit-lost
    kind: functional
    tier: L2
    symptoms: ["dosage", "reverted", "back to 2"]
  - id: medicine-rename-lost
    kind: functional
    tier: L3
    symptoms: ["rename", "renamed", "still ibuprofen", "name did not", "naproxen"]
  - id: stock-left-display-low
    kind: display
    tier: L2
    marker: "9 left"
    symptoms: ["9 left", "left)", "one less", "one fewer", "under-report"]
  - id: reminder-time-display-shifted
    kind: display
    tier: L2
    marker: "9:00 AM"
    symptoms: ["9:00 AM", "one hour", "hour late", "time shown"]

  # The corpus's first CRASH defect (QUA-2710). `kind: functional` — it BLOCKS the
  # case, and the seeded arm fails by the app dying rather than by a wrong value.
  # Symptoms are the words a tester writes about a death; they are deliberately not
  # padded with bare "app" or "error" vocabulary that any report contains. A report
  # that merely GUESSES "it crashed" is charged on every clean episode it says it on
  # (journey mode counts every report on a clean build as false), which is the
  # corpus's designed defence — see the Rates block in CLAUDE.md.
  - id: medicine-list-empty-reminders-crash
    kind: functional
    tier: L4
    symptoms: ["keeps stopping", "has stopped", "stopped working", "closed unexpectedly",
               "crashed", "crash", "force close", "nosuchelementexception"]

# Every case runs in two versions: clean (no bug) and seeded (exactly its `bugs:` on).
# One functional bug at most per case — it blocks the outcome; display bugs are side bugs.
test_cases:

  - id: medtimer-add-medicine
    name: Add a medicine
    steps:
      - "Open the Medicine tab."
      - "Tap the add-medicine button."
      - "Enter the name \"Lisinopril\"."
      - "Confirm with OK."
      - "Read the medicine list."
    expected_outcome: "\"Lisinopril\" is listed on the Medicine tab."
    step_budget: 40
    check:
      steps: [launch, {tap: Medicine}, {tap: Add medicine}, {tap: Medicine name}, {type: Lisinopril}, {tap: OK}, wait]
      expect: {db: medTimer, equals: '1', query: select count(*) from Medicine where medicineName='Lisinopril';}
    bugs: [stock-left-display-low]     # the list's (N left) labels are one low on this route

  # READ-ONLY case: the agent writes nothing, so no `db:` oracle can tell a run from a
  # no-op, and the row-reading step that once made this scoreable pointed straight at
  # both seeded display defects (removed 2026-09-14; the leak history is in
  # docs/journey-oracle-audit.md). Completion is now witnessed by `evidence:` — the
  # SCREEN WITNESS: a value the brief itself asks the agent to read, shown identically on
  # the clean and seeded arms (Aspirin's own screen shows 8:00 AM on both; only the
  # Medicine-tab row is shifted), and never a defect marker or symptom
  # (scripts/lint_journey_cases.py enforces that).
  # Screen witness: `evidence:` below is scored by the harness (journey.py, 2026-09-14) —
  # completion = right verdict AND every witness read off a screen observation; an
  # agent with no screen read at all stays unscored. See docs/journey-oracle-audit.md.
  - id: medtimer-review-aspirin
    name: Review Aspirin's reminder and stock
    steps:
      - "Open the Medicine tab."
      - "Open Aspirin."
      - "Read the reminder's time and dosage."
      - "Open Aspirin's stock screen and read the amount."
      - "Go back to the Medicine tab."
    expected_outcome: "Aspirin's own screen shows one reminder at 8:00 AM with a dosage of 2, and its stock screen shows an amount of 10."
    step_budget: 40
    check:
      steps: [launch, {tap: Medicine}, {tap: 1 reminder}, wait]
      expect: {present: '8:00 AM'}
    evidence: ['8:00 AM']     # screen witness: the reminder time on Aspirin's own screen
    bugs: [reminder-time-display-shifted, stock-left-display-low]

  - id: medtimer-edit-reminder-dosage
    name: Change a reminder's dosage
    steps:
      - "Open the Medicine tab."
      - "Open Aspirin."
      - "Tap the dosage field of its 8:00 AM reminder (currently 2)."
      - "Change the dosage to 3."
      - "Go back to the Medicine tab so the change is saved."
      - "Open Aspirin again."
      - "Read the reminder's dosage."
    expected_outcome: "The 8:00 AM reminder now shows a dosage of 3."
    step_budget: 45
    check:
      steps: [launch, {tap: Medicine}, {tap: 1 reminder}, {tap: '2'}, {type: '3'}, {press: back}, {press: back}, wait]
      expect: {db: medTimer, equals: '1', query: select count(*) from Reminder where amount='3';}
    bugs: [reminder-amount-edit-lost]

  # TODO(fixture): the "Ibuprofen (2.5)" card this case taps was missing because the
  # rows were NEVER INSERTED — verified 2026-09-14: the spec seeded its two
  # ReminderEvent rows with an on-device `run-as … sqlite3`, Google Play images ship
  # no sqlite3 (`run-as: exec failed for sqlite3`), and `device_setup` ignored the
  # exit code, so staging failed silently at every hour (both arms inconclusive at
  # step 2, 17:0x local). The rows now go in through the host-side `sql:` step and
  # the shell steps fail loudly; re-derived the same day at 17:09 local: card on the
  # Overview, clean HOLDS / seeded VIOLATED. The earlier theory — `now` (UTC) vs the
  # device's local day — was at best secondary: the stamp is an epoch instant, which
  # cannot bucket into tomorrow by itself. UNTESTED: the evening. If the card is ever
  # absent late in a US-Central day with the rows present, stamp local noon instead
  # of `now` (then re-run derive_journey.py on a device); `assert_precondition`
  # records that situation as `env_failure`, never as an agent 0.
  - id: medtimer-skip-logged-dose
    name: Change a logged dose to Skipped
    steps:
      - "On today's Overview, tap the \"Ibuprofen (2.5)\" event card to open its editor."
      - "Set its status to Skipped."
      - "Go back to the Overview."
      - "Open the \"Ibuprofen (2.5)\" event again and read its status."
    expected_outcome: "The Ibuprofen 2.5 event's status is Skipped."
    step_budget: 45
    check:
      steps: [launch, {tap: Ibuprofen (2.5)}, {tap: Skipped}, {press: back}, wait]
      # TODO(derive): re-run derive_journey.py --case medtimer-skip-logged-dose after this oracle change
      # The brief names the 2.5 event; skipping the raised "Ibuprofen (4)" reminder used to pass.
      expect: {db: medTimer, equals: '1', query: select count(*) from ReminderEvent where medicineName='Ibuprofen' and amount='2.5' and status='SKIPPED';}
    bugs: [event-skip-not-saved]

  - id: medtimer-rename-medicine
    name: Rename a medicine
    steps:
      - "Open the Medicine tab."
      - "Open Ibuprofen."
      - "Tap its name field."
      - "Change the name to \"Naproxen\"."
      - "Go back to the Medicine tab."
      - "Read the medicine list."
    expected_outcome: "The Medicine tab lists \"Naproxen\" instead of \"Ibuprofen\"."
    step_budget: 45
    check:
      steps: [launch, {tap: Medicine}, {tap: 0 reminders}, {tap: Ibuprofen}, {type: Naproxen}, {press: back}, {press: back}, wait]
      # TODO(derive): re-run derive_journey.py --case medtimer-rename-medicine after this oracle change
      # The brief promises "instead of Ibuprofen": a second medicine named Naproxen used to pass.
      expect: {db: medTimer, equals: '1,0', query: "select (select count(*) from Medicine where medicineName='Naproxen') || ',' || (select count(*) from Medicine where medicineName='Ibuprofen');"}
    bugs: [medicine-rename-lost]

  # CRASH case (QUA-2710) — the corpus's first, and the shape later ones copy.
  #
  # Route polarity: the CLEAN arm passes its ORDINARY `db:` oracle (the medicine is
  # in the database) and the SEEDED arm fails by DYING on the route, which
  # replay.run_steps already scores as CRASHED = FAIL. No "must crash" oracle exists
  # or is wanted — it would invert the clean arm. `crash:` is a GATE, not a demand:
  # "if the app dies here, it must die THIS way", so a seeded arm that dies of
  # something else is INCONCLUSIVE rather than a FAIL that agrees.
  #
  # Why the `{press: back}` matters: tapping OK does NOT return to the list, it opens
  # the new medicine's own screen (measured — see the recorded screens for
  # medtimer-add-medicine). The medicine LIST is what carries the fault, so the route
  # has to come back to it before anything can go wrong.
  #
  # TODO(derive, QUA-2710): NOT YET DERIVED — there is no row for this case in
  # data/truth/journey-medtimer.json, so the exemplar is unvalidated. What is known:
  # the patch compiles and is in the artifact (dist/medtimer/buggy.apk, sha256
  # 5e69a8c6…, the hash now in the `apk:` block above), verified in its dex as
  # QgbFlags.on -> isEmpty -> QgbFlags.fired -> CollectionsKt.first; and the ROUTE is
  # right — a derive run on 2026-09-15 recorded the Medicine list re-rendering with
  # 'Lisinopril' on it after the {press: back}, which is the screen that carries the
  # fault. What that run did NOT do is exercise the patch: derive_journey.py installs
  # nothing, the device still had the PUBLISHED build, and both arms agreed with the
  # clean build 3/3. Install dist/medtimer/buggy.apk first, then:
  #     scripts/derive_journey.py medtimer --case medtimer-add-medicine-back-to-list \
  #         --repeat 3 --device <serial>
  # Expect clean HOLDS 3/3, seeded CRASHED 3/3 with the marker fired on seeded only.
  # `--repeat 3` is mandatory for every crash/anr/stuck case (CLAUDE.md) — one trial
  # cannot measure a margin.
  - id: medtimer-add-medicine-back-to-list
    name: Add a medicine and return to the list
    steps:
      - "Open the Medicine tab."
      - "Tap the add-medicine button."
      - "Enter the name \"Lisinopril\" and confirm with OK."
      - "Go back to the Medicine tab."
      - "Read the medicine list."
    expected_outcome: "The Medicine tab lists \"Lisinopril\" together with Aspirin and Ibuprofen."
    step_budget: 45
    check:
      steps: [launch, {tap: Medicine}, {tap: Add medicine}, {tap: Medicine name}, {type: Lisinopril},
              {tap: OK}, {press: back}, wait]
      expect:
        db: medTimer
        equals: '1'
        query: select count(*) from Medicine where medicineName='Lisinopril';
        # The gate: the death this case claims. Substring, case-insensitive, matched
        # against the normalised signature + exception + message.
        crash: NoSuchElementException
    bugs: [medicine-list-empty-reminders-crash]
