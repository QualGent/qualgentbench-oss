# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Fossify Calendar — journey-mode test cases (one episode = this app + one test case + one version).
#
# No seeded data: the app opens on the month view of the current month. + offers a new
# Event or a new Task; the editor has a title, date/time, reminder and repetition rows,
# and a Save action in the toolbar. Tapping an item opens it; the toolbar has Delete.
# Storage: Room databases/events.db (events: title, type 0=event/1=task, reminder_1_minutes,
# repeat_interval; tasks: completed rows).

app: fossify-calendar

# DERIVED 2026-09-18 (QUA-2726), NOT YET PUBLISHED. The sha256 below is the artifact this
# branch measured against and nothing else: a from-scratch build (fresh clone, no
# app/build) of ref 1.10.3 with all THIRTEEN patches — QUA-2712's ten, the search crash
# now in its forced-ordering form, plus `task-row-opens-event-editor`,
# `task-complete-crash` and `all-day-save-crash` — 32 714 470 B. `publish_apk.py
# fossify-calendar --kind journey --write` moved the block; the UPLOAD is an owner action.
# Until it happens, journey/fossify-calendar-buggy.apk still holds QUA-2712's bae61512…,
# so a fresh clone's journey download FAILS its sha256 check, and
# dist/fossify-calendar/buggy.apk (which wins locally) is the artifact.
#
# Installed with mobile_install_app on emulator-5556 (android-35, AVD qgbench_root) and
# confirmed by qg_app_build_fingerprint (exact sha256) before AND after the derive:
#     derive_journey.py fossify-calendar --device emulator-5556 --repeat 3
#         fossify-calendar: 9/9 cases agree with the authored key
#         stability: 18/18 checks gave the SAME label in all 3 trials
#     derive_journey.py fossify-calendar --device emulator-5556 --case cal-search-event --repeat 5
#         cal-search-event  clean holds 5/5 · seeded crashed 5/5, every trial on
#                           CalledFromWrongThreadException with its marker fired —
#                           8/8 across the two staging sessions (3/3 in the first)
# cal-open-task-from-list does not crash, so its marker was read with
# verify.canary.fired_markers straight after the first invocation, whose last pass was
# that case's seeded trial 3/3: ['task-row-opens-event-editor']. No marker fired on any
# clean pass: the derive reads them on every pass, and every row has `problems: []`.
#
# Same size as bae61512… while hashing differently: DEX layout, not a stale artifact —
# the three new ids are strings in classes7/8.dex, and each new case's seeded arm fires
# its own marker, which the old build cannot do. THE TRAP this note exists for is
# unchanged: derive_journey.py installs nothing, so deriving against a stale APK reports
# HOLDS on both arms of a new defect — a silent false negative that reads like a defect
# that does not fire (QUA-2712's first derivation of cal-repeat-survives-rotation did
# exactly that). Install, fingerprint by hash, then derive.
apk:
  repo: qualgent/qualgentbench-apps
  filename: journey/fossify-calendar-buggy.apk
  sha256: 5cea276f7456338f9c7fa0394e4a769c489fbb21bfbe8a7ca741db32840adaf5
  size_bytes: 32714470

# `class:` is each defect's fault class, from the closed vocabulary in
# docs/defect-classes.md: lint_journey_cases.py fails without it and scripts/mix_report.py
# counts by it. Corpus metadata only — nothing that scores a report ever reads it.
#
# PRUNED 2026-09-18 (QUA-2726, epic QUA-2723 — docs/defect-classes.md §8): the journey
# side of four persistence defects is gone — `event-delete-broken`, `task-reminder-
# dropped`, `repeat-dropped` and `task-completion-not-persisted` — with the two cases
# only they carried (cal-delete-event, cal-task-reminder; the other two were on no case).
# `edit-event-not-saved` stays: it is the retain list's representative of "an edit did
# not save". The four PATCHES stay in data/benchmarks/fossify-calendar.yaml, because
# each is also a hard-tier hunt defect with a derived `broken` row in
# truth/hard-stability.json; the journey build still carries them, and no case switches
# them on.
defects:
  - id: edit-event-not-saved
    kind: functional
    class: persistence
    tier: L3
    symptoms: [edit, rename, renamed, "still draft", "did not save", "not saved", reverted]
  - id: event-editor-title-typo
    kind: display
    class: content-format
    tier: L1
    marker: "New Evnet"
    symptoms: [typo, misspelled, misspelt, evnet, spelled, spelling, title]
  - id: task-editor-title-typo
    kind: display
    class: content-format
    tier: L1
    marker: "New Tsak"
    symptoms: [typo, misspelled, misspelt, tsak, spelled, spelling, title]
  # FORCED ORDERING (QUA-2714). L4: the app dies and the journey cannot continue.
  # No `marker:` — a marker is a DISPLAY defect's screen string, and nothing here is
  # drawn; the symptoms are how a human would report a disappearing app.
  - id: search-results-off-main-thread
    kind: functional
    # ordering, although the oracle OBSERVES a crash (`crash: CalledFromWrongThreadException`):
    # the seeded operator runs a view update inline instead of posting it, and Android's
    # thread check turns that order into a death — which is how CLAUDE.md tells a forced
    # interleaving to be authored. Classed by the operator, as the plan sizes this
    # bucket; docs/defect-classes.md has the rule.
    #
    # REPAIRED 2026-09-18 (QUA-2726): the first version (QUA-2714) was a ~60% RACE —
    # 6/10 seeded crashes at --repeat 5 (QUA-2733), every survivor having fired its
    # marker. Android reaches its thread check through requestLayout()'s walk up the
    # tree, which stops at any ancestor that already owes a layout, so the wrong-thread
    # touch was only CAUGHT when the fetch thread beat or missed the main thread's next
    # frame the right way. The patch now forces that order (main thread parked, no
    # layout owed) with a main-looper hand-off and two latches — no sleep, no timeout;
    # the benchmark spec's comment on the patch has the mechanism. Same site, same
    # statements, same operator, same signature, same marker, same case.
    class: ordering
    tier: L4
    symptoms: [crash, crashed, crashes, closed, closes, quit, disappeared, exited,
               "force close", "shut down", "stopped working", "kicked out"]

  # WRONG NAVIGATION (QUA-2713). L3: the journey cannot be finished — the screen you
  # asked for is not the screen you get — but the app is alive and no data is lost,
  # which is what separates it from the L4 above.
  # No `marker:` — a marker is a DISPLAY defect's screen string, and nothing here is
  # drawn wrongly; the symptoms are how a human reports a screen that will not change.
  - id: view-switch-stuck-on-year
    kind: functional
    # navigation, not `stuck`: nothing freezes. The oracle reads the destination screen
    # (`present: Standup`) and the live app is on the wrong one.
    class: navigation
    tier: L3
    symptoms: [stuck, trapped, unchanged, "wrong screen", "same screen", "wrong view",
               "did not change", "does not change", "did not switch", "does not switch",
               "still shows", "cannot get back", "went nowhere"]

  # LIFECYCLE / STATE LOSS (QUA-2712). L3: the journey runs to the end and the app is
  # alive, but what the user entered is not what was saved — no crash, no wrong screen.
  # No `marker:` — a marker is a DISPLAY defect's screen string, and nothing here is
  # drawn wrongly; "No repetition" is the app's own honest rendering of the value the
  # editor now holds.
  # Every symptom is either a single word (which lint_journey_cases' brief rule never
  # checks) or a PHRASE the brief does not contain. The brief has to say "repeat
  # weekly" and "landscape" out loud for the route to be followable at all, so bare
  # `repeat`, `weekly`, `rotate` and `landscape` would make the brief its own answer key.
  - id: repeat-lost-on-rotation
    kind: functional
    # lifecycle, although the oracle is a STORED-value read (repeat_interval), which alone
    # would say persistence: the value is lost only across the route's `rotate`, and that
    # trigger is what the class records. docs/defect-classes.md has the rule.
    class: lifecycle
    tier: L3
    symptoms: ["does not repeat", "doesn't repeat", "no repetition", "not repeating",
               "only once", "once only", "appears once", "occurs once",
               "single occurrence", "one occurrence", "back to none",
               "was lost", "were lost", "was dropped", "were dropped",
               "not saved", "did not save", "did not stick",
               reverted, forgot, forgotten]

  # ── seeded by QUA-2726 (epic QUA-2723: crash-first, no new persistence) ─────────────
  # WRONG NAVIGATION, the second — a distinct MECHANISM from `view-switch-stuck-on-year`:
  # that one substitutes a view MODE inside MainActivity, this one sends a list ROW to the
  # wrong KIND of editor. `Context.editEvent` picks the editor by the row's completion
  # flag instead of its type, so an open task goes to the event editor, which finds no
  # EVENT with that id and closes; the user is left on the list, never on the task's
  # screen. L3 like the first: the journey cannot be finished, the app is alive and
  # nothing is lost. No `marker:` — nothing is drawn wrongly. The symptoms are what a
  # tester writes about a row that will not open; none is a word or phrase of
  # cal-open-task-from-list's brief, and none sits inside its witness "Mark completed".
  - id: task-row-opens-event-editor
    kind: functional
    # navigation: the oracle reads the destination (`present: Mark completed`, the task
    # screen's own button) and the live app is on the list instead. Not the plan's dead
    # control: the tap is answered, it navigates — to an editor that bounces it back.
    class: navigation
    tier: L3
    symptoms: ["does not open", "doesn't open", "did not open", "didn't open",
               "won't open", "will not open", "would not open", "wouldn't open",
               "cannot open", "can't open", "nothing happens", "nothing happened",
               "stays on the list", "stayed on the list", "still on the list",
               "back to the list", "went back to the list", "event editor",
               "edit event", "not the task", "flashes", "flashed"]

  # CRASHES, the corpus's second and third (QUA-2726) — shaped on MedTimer's
  # `medicine-list-empty-reminders-crash`: `kind: functional` (each BLOCKS its case), L4,
  # and a seeded arm that fails by the app dying on the route rather than by a wrong
  # value. Symptoms are the words a tester writes about a death plus the exception the
  # case's `crash:` gate names; like the exemplar they are not padded with bare "app" or
  # "error" vocabulary that any report contains. Two different faults on two different
  # screens, so neither case can be passed by having read the other:
  #   task-complete-crash  — "Mark completed" cancels the task's reminder alarm BEFORE it
  #                          records the completion (QUA-2742), and the cancel lookup names
  #                          no PendingIntent mutability, which S+ refuses:
  #                          IllegalArgumentException, on a background thread, so the
  #                          completion is never recorded.
  #   all-day-save-crash   — an all-day event's end moves from noon to "24:00" of its
  #                          last day, an hour Joda-Time refuses: IllegalFieldValueException.
  - id: task-complete-crash
    kind: functional
    class: crash
    tier: L4
    symptoms: ["keeps stopping", "has stopped", "stopped working", "closed unexpectedly",
               "crashed", "crash", "force close", "illegalargumentexception"]
  - id: all-day-save-crash
    kind: functional
    class: crash
    tier: L4
    symptoms: ["keeps stopping", "has stopped", "stopped working", "closed unexpectedly",
               "crashed", "crash", "force close", "illegalfieldvalueexception"]

test_cases:

  - id: cal-create-event
    name: Create an event
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Standup\"."
      - "Save the event."
      - "Find \"Standup\" on the calendar for today."
    expected_outcome: "The event \"Standup\" is saved and shown on today's date."
    step_budget: 40
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title}, {type: Standup}, {tap: Save}]
      # The brief promises "shown on today's date", so the query checks the date. Its
      # `localtime` is the DEVICE's day: `query_db` evaluates it under the device's zone
      # (docs/journey-oracle-audit.md, "Host timezone").
      expect: {db: events.db, equals: "1", query: "select count(*) from events where title='Standup' and type=0 and date(start_ts,'unixepoch','localtime')=date('now','localtime');"}
    bugs: [event-editor-title-typo]

  - id: cal-create-task
    name: Create a task
    steps:
      - "Tap the + button and choose Task."
      - "Enter the title \"Groceries\"."
      - "Save the task."
      - "Find \"Groceries\" on the calendar for today."
    expected_outcome: "The task \"Groceries\" is saved and shown on today's date."
    step_budget: 40
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Task}, {tap: task_title}, {type: Groceries}, {tap: Save}]
      expect: {db: events.db, equals: "1", query: "select count(*) from events where title='Groceries' and type=1 and date(start_ts,'unixepoch','localtime')=date('now','localtime');"}
    bugs: [task-editor-title-typo]

  - id: cal-edit-event
    name: Rename an event
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Draft\" and save."
      - "Open \"Draft\" from the calendar."
      - "Change the title to \"Final\"."
      - "Save the event."
      - "Look at the calendar for today."
    expected_outcome: "The calendar shows \"Final\" and no longer shows \"Draft\"."
    step_budget: 50
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title}, {type: Draft}, {tap: Save}, {tap: Draft}, {tap: event_title}, {type: Final}, {tap: Save}]
      # The brief promises "no longer shows Draft" too: a rename that left a copy behind used to pass.
      expect: {db: events.db, equals: "1,0", query: "select (select count(*) from events where title='Final') || ',' || (select count(*) from events where title='Draft');"}
    bugs: [edit-event-not-saved]

  # ── FORCED-ORDERING exemplar (QUA-2714) ─────────────────────────────────────────
  # The route is the hunt corpus's `search` CONTROL plus a `wait`: proven to work on
  # this app, so a failure here is the seeded defect and not the route.
  #
  # Polarity, per the crash/ANR rule: the case keeps an ORDINARY completion oracle (the
  # event really was created) and `crash:` rides on it as a GATE, never a demand — "the
  # route runs with the app alive, and if it dies it must die THIS way". A positive
  # "must crash" would fail its own clean arm.
  #
  # The seeded arm dies AFTER the row is written, so the db count would still read 1;
  # the death dominates (run_steps -> CRASHED, which scores like violated) and that is
  # the documented shape, not an oversight. The gate is what stops some OTHER crash
  # being charged to this defect: a death whose signature does not contain
  # CalledFromWrongThreadException is INCONCLUSIVE, not a FAIL that agrees.
  #
  # Derived with --repeat 5 rather than the usual 3: forced ordering is the flakiest
  # bucket and this case is the template the rest copy.
  #
  # And --repeat 5 is what caught it. The committed 3/3 (QUA-2714) was luck: QUA-2733
  # re-derived this case three times at --repeat 5 and the seeded arm crashed in 6 of 10
  # trials (3/5 without its home-before-launch fix), the clean arm holding every time and
  # every surviving seeded trial having fired its marker. The ROUTE and the ORACLE were
  # never the problem; the patch was — see `search-results-off-main-thread` above and the
  # patch's comment in the benchmark spec. QUA-2726 forced the interleaving and
  # re-derived the case against that build on emulator-5556: clean HOLDS 5/5, seeded
  # CRASHED 5/5 (--repeat 5), every seeded trial on CalledFromWrongThreadException with
  # the marker fired — and 3/3 more in the whole-app --repeat 3 session before it, so
  # 8/8 across two stagings. This route and oracle are unchanged.
  - id: cal-search-event
    name: Find an event with search
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Dentist\" and save."
      - "Open the search in the toolbar."
      - "Type \"Dent\" into the search field."
      - "Read what the search lists."
    expected_outcome: "The event \"Dentist\" is saved, and searching for \"Dent\" lists it."
    step_budget: 50
    check:
      # `wait` last: the fault is raised on a background thread a moment after the
      # query runs, so the route has to still be watching when the process dies.
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title},
              {type: Dentist}, {tap: Save}, {tap: Search}, {type: Dent}, wait]
      expect: {db: events.db, equals: "1",
               query: "select count(*) from events where title='Dentist' and type=0;",
               crash: "CalledFromWrongThreadException"}
    bugs: [search-results-off-main-thread]

  # ── WRONG-NAVIGATION exemplar (QUA-2713) ────────────────────────────────────────
  # Route: 10 steps over 5 screen states — event list -> new-event editor -> event
  # list -> yearly view -> event list. The first six steps ARE cal-create-event's
  # route, which derives 5/5, so a failure in them is the route and not the defect;
  # the navigation this case exists to measure is the last four.
  #
  # Both view switches are the SAME control. The first (list -> yearly) works on both
  # arms and is what puts the app on the screen the defect needs; the second
  # (yearly -> list) is the one that lands somewhere else. That is why the case is
  # worth ten steps rather than three: the wrong destination is only reachable after
  # the route has already navigated somewhere, which is the whole point of seeding a
  # navigation defect rather than another data fault.
  #
  # Oracle: `present: Standup`, the title the route created one step earlier. The
  # simple event list draws event titles; the yearly view draws twelve month grids
  # and no event text, so the destination is read straight off the hierarchy. A
  # witness taken from the month, week or day view's own text would rot with the
  # calendar date instead — see the "host timezone" note in
  # docs/journey-oracle-audit.md for the same trap on a db oracle.
  #
  # The witness is weak in one known way: the route TYPES "Standup", so the string
  # the agent must read back off the device is a string it also supplied (orgzly's
  # orgzly-create-and-search carries the same caveat on its own witness). The oracle
  # does not depend on it —
  # `present:` is evaluated on the hierarchy, not on the agent's words.
  - id: cal-switch-back-to-list
    name: Switch the calendar view and come back
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Standup\" and save."
      - "Use the toolbar to switch the calendar to the yearly view."
      - "Use the toolbar to switch the calendar back to the simple event list."
      - "Read what the list shows."
    expected_outcome: "The simple event list is shown again and lists \"Standup\"."
    step_budget: 50
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title},
              {type: Standup}, {tap: Save},
              {tap: "Change view"}, {tap: "Yearly view"},
              {tap: "Change view"}, {tap: "Simple event list"}]
      expect: {present: Standup}
    evidence: [Standup]        # screen witness: the event title on the destination screen
    bugs: [view-switch-stuck-on-year]

  # ── LIFECYCLE exemplar (QUA-2712) ───────────────────────────────────────────────
  # Route: 9 steps, and the shape CLAUDE.md prescribes for a lifecycle case — the steps
  # that PRODUCE the state first, then exactly ONE lifecycle step, then the read. A
  # rotate AFTER the read would measure nothing.
  #
  # The first five steps are cal-create-event's route, which derives against this same
  # artifact, so a failure in them is the route and not the defect. Steps 6-7 set the
  # repetition; step 8 is the configuration change; step 9 is the save the oracle reads.
  #
  # This case is the FIRST route in the corpus to use `rotate` at all (QUA-2709 added
  # the step; its device acceptance ran here). `replay._rotate` turns auto-rotate off
  # before it pins user_rotation and then wait_stable()s for the recreated activity, and
  # `_reset` puts the device back to portrait before every pass — so the route may not
  # assume a landscape start and does not: it rotates into it explicitly and never back.
  #
  # Oracle: `db:`, the repetition the editor was given, read off the row the route just
  # wrote. Not `present:`, and deliberately: the repetition row is not on screen after
  # Save (the app is back on the event list), and the screen strings that WOULD show it
  # are either the value the brief already names ("Weekly") or dated event rows that rot
  # with the calendar. No `evidence:` for the same reason, matching every other `db:`
  # case in this file.
  #
  # One thing a reader of the truth file should know: the only screen strings that
  # differ between the arms on this route are the FOLLOWING WEEKS the recurrence draws
  # ('23 Wednesday', '30 Wednesday', '7 Wednesday', 'OCTOBER' on the derivation date), so
  # journey_tasks' `blocking_texts` for this case are dated and will not be on screen on
  # any other day. That costs nothing: blocking_texts only ever CREDIT a quote, and a
  # functional defect is credited through its symptom vocabulary, which is date-free.
  #
  # The clean arm is NOT trivially true: the upstream app really does carry
  # `mRepeatInterval` across a recreate (verified on device on the unpatched build —
  # Weekly set, rotated, saved, and the month view then drew the event on four following
  # Sundays). `repeat-dropped` is a DIFFERENT defect on a different line: it drops the
  # repetition at save time whether or not anything was rotated, so a route without a
  # `rotate` would catch it. This one is invisible until the activity is destroyed.
  - id: cal-repeat-survives-rotation
    name: Set an event to repeat, then turn the phone sideways
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Planning\"."
      - "Set the event to repeat weekly."
      - "With the editor still open, turn the phone sideways to landscape."
      - "Save the event."
      - "Look at the calendar for the next few weeks."
    expected_outcome: "The event \"Planning\" is saved as a weekly repeating event and shows on the following weeks too."
    step_budget: 50
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title},
              {type: Planning}, {tap: event_repetition}, {tap: Weekly},
              {rotate: landscape}, {tap: Save}]
      # 604800 = WEEK_SECONDS. A seeded arm that saves the event with no repetition
      # reads 0 here; an arm that never saved it at all reads empty. Both are a FAIL,
      # and the fired marker is what tells the two apart.
      expect: {db: events.db, equals: "604800",
               query: "select repeat_interval from events where title='Planning' and type=0;"}
    bugs: [repeat-lost-on-rotation]

  # ── CRASH on the task screen (QUA-2726, re-authored QUA-2742) ────────────────────
  # Route: 9 steps — the hunt's `complete_task` check (8 steps, which derives HOLDS on
  # the clean build with the completion row written, truth/hard-stability.json), then
  # ONE more tap that opens "Taxes" again, so a failure on the route is the seeded
  # defect and not the route.
  #
  # Polarity, per the crash rule: an ORDINARY completion oracle (the completion row
  # exists) with `crash:` riding on it as a GATE. The seeded arm dies inside "Mark
  # completed" BEFORE the row is written, and the death dominates (run_steps ->
  # CRASHED, scored like violated). A seeded arm that dies some other way is
  # INCONCLUSIVE, not a FAIL that agrees, and one that fails the row with the app alive
  # does not agree either (derive_journey refuses it when the check names a death).
  #
  # WHY THE ROUTE READS THE COMPLETION BACK (QUA-2742). The first version wrote the row
  # and then died in the task editor, a secondary activity: Android finished it and
  # restarted the process on the event list beneath, which showed the task completed.
  # Every recorded screen matched the clean arm's, a tester's PASS was right by the
  # brief, and the board charged it a missed crash and a failed completion. Moving the
  # fault before the write is necessary but NOT sufficient: the event list draws a
  # completed task struck through and dimmed — paint, not text — so its rows read
  # `Taxes`, `05:00 AM` either way (the committed truth's step-6 list, before the tap,
  # matched its step-8 list, after it). The task's own screen says it in words: its
  # toggle reads "Mark incomplete" once the completion is recorded and still "Mark
  # completed" when it is not. So the route opens "Taxes" again, and the brief asks the
  # tester to — the same move as contacts-phone's verification screen. The death
  # happens at step 8; the route carries on over the event list Android restarts, and
  # run_steps' closing crash check still finds it (so the seeded detail line names
  # step 9, the last step run, not the step that died). `derive_journey.py` now refuses
  # the old shape (a FAIL case whose seeded arm dies with an empty screen diff).
  - id: cal-complete-task
    name: Mark a task completed
    steps:
      - "Tap the + button and choose Task."
      - "Enter the title \"Taxes\" and save."
      - "Open \"Taxes\" from the event list."
      - "Tap \"Mark completed\"."
      - "Look at the event list, then open \"Taxes\" again."
    expected_outcome: "The task \"Taxes\" is marked completed: the event list shows it completed, and its screen now offers to mark it incomplete."
    step_budget: 50
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Task}, {tap: task_title},
              {type: Taxes}, {tap: Save}, {tap: Taxes}, {tap: "Mark completed"},
              {tap: Taxes}]
      expect: {db: events.db, equals: "1",
               query: "select count(*) from tasks where task_id=(select id from events where title='Taxes');",
               crash: IllegalArgumentException}
    bugs: [task-complete-crash]

  # ── CRASH in the event editor (QUA-2726) ─────────────────────────────────────────
  # Route: 7 steps — cal-create-event's route with one more tap, "All-day" (the editor's
  # own switch row, listed on every recorded screen of the new-event editor), before
  # Save. The all-day branch is the only thing the route adds, and it is what the fault
  # is gated on: a timed event saves exactly as before on the seeded build.
  #
  # Oracle: the event exists and is flagged all-day (FLAG_ALL_DAY = 1 in `flags`). No
  # date clause, on purpose: Fossify's "next full hour" default puts an event created
  # after 23:00 on TOMORROW, so a `date('now')` clause would flip with the wall clock.
  # The seeded arm dies inside Save, before the insert — and the death dominates anyway.
  - id: cal-create-all-day-event
    name: Create an all-day event
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Vacation\"."
      - "Switch on \"All-day\"."
      - "Save the event."
      - "Find \"Vacation\" in the event list."
    expected_outcome: "The event \"Vacation\" is saved as an all-day event and listed."
    step_budget: 45
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title},
              {type: Vacation}, {tap: All-day}, {tap: Save}]
      expect: {db: events.db, equals: "1",
               query: "select count(*) from events where title='Vacation' and type=0 and (flags & 1) = 1;",
               crash: IllegalFieldValueException}
    bugs: [all-day-save-crash]

  # ── WRONG-NAVIGATION, the second (QUA-2726) ─────────────────────────────────────
  # Route: 7 steps. The first six are cal-create-task's route with another title; the
  # seventh taps the new task's row in the simple event list (check_setup switched the
  # main screen to it). The hunt's `edit_task` and `complete_task` checks tap a task row
  # the same way and land on the task screen, so a failure before step 7 is the route
  # and not the defect.
  #
  # Oracle: `present: "Mark completed"` — the button TaskActivity shows only for a SAVED
  # task, read off the destination. On the seeded arm the row goes to the event editor,
  # which finds no EVENT with the task's id and closes, so the app is back on the list
  # and the button is nowhere. The tap writes nothing, so a `db:` oracle could not tell
  # the arms apart: this is a destination check or nothing.
  #
  # `evidence: ["Mark completed"]` is the screen witness: the brief names it, it is on the
  # clean route's final screen, it is no symptom of the defect, and an agent can only
  # report it from the device. Like `Standup` on cal-switch-back-to-list it is absent on
  # the seeded arm, which is fine — an expected-FAIL arm never consults it.
  #
  # LAST in the file on purpose: derive_journey runs cases in file order, clean arm
  # before seeded, and only surfaces a fired marker inside a CRASH detail. This case
  # does not crash, so its marker is read with verify.canary.fired_markers straight
  # after the derive, when the last pass run is this case's seeded arm (the method
  # QUA-2728 used for medtimer-check-stock). The derive reads markers on every pass
  # and records a problem for any on a clean arm, which covers the other side.
  - id: cal-open-task-from-list
    name: Open a task from the event list
    steps:
      - "Tap the + button and choose Task."
      - "Enter the title \"Laundry\" and save."
      - "In the event list, tap \"Laundry\" to open it."
      - "Read the screen that opens."
    expected_outcome: "The task \"Laundry\" opens on its own screen, which shows its title and a \"Mark completed\" button."
    step_budget: 45
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Task}, {tap: task_title},
              {type: Laundry}, {tap: Save}, {tap: Laundry}]
      expect: {present: "Mark completed"}
    evidence: ["Mark completed"]    # screen witness: the task screen's own button
    bugs: [task-row-opens-event-editor]
