# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Fossify Calendar — journey-mode test cases (one episode = this app + one test case + one version).
#
# No seeded data: the app opens on the month view of the current month. + offers a new
# Event or a new Task; the editor has a title, date/time, reminder and repetition rows,
# and a Save action in the toolbar. Tapping an item opens it; the toolbar has Delete.
# Storage: Room databases/events.db (events: title, type 0=event/1=task, reminder_1_minutes,
# repeat_interval; tasks: completed rows).

app: fossify-calendar

# TODO(publish, QUA-2714): THE UPLOAD IS STILL OUTSTANDING — hash and file are not yet
# one fact, so every fresh clone fails its sha256 check until an owner runs:
#     HF_TOKEN=<write token> uv run python scripts/publish_apk.py fossify-calendar \
#         --kind journey --write --upload --yes
# The hash below is the artifact this branch was derived against and nothing else: a
# from-scratch build (empty app/build) of ref 1.10.3 with all 8 patches, which
# derive_journey.py --repeat 5 agreed with 6/6, 12/12 stable, on 2026-09-15. It is
# written rather than left stale on purpose: a stale hash downloads the PREVIOUS build,
# which has no `search-results-off-main-thread` in it, so cal-search-event's seeded arm
# would quietly not crash and the exemplar would read as flaky — the one failure this
# case exists to rule out. A wrong-but-loud hash fails closed instead.
apk:
  repo: qualgent/qualgentbench-apps
  filename: journey/fossify-calendar-buggy.apk
  sha256: 81eb95a4915934d145d5bfed74b93a6309201bb562b410566ca79bf8efd3d663
  size_bytes: 32714470

defects:
  - id: event-delete-broken
    kind: functional
    tier: L2
    symptoms: [delete, deleted, "still listed", "still there", remains, "not removed"]
  - id: task-reminder-dropped
    kind: functional
    tier: L2
    symptoms: [reminder, "no reminder", "reminder was", dropped, "not saved"]
  - id: edit-event-not-saved
    kind: functional
    tier: L3
    symptoms: [edit, rename, renamed, "still draft", "did not save", "not saved", reverted]
  - id: repeat-dropped
    kind: functional
    tier: L3
    symptoms: [repeat, repetition, weekly, recurring, "does not repeat"]
  - id: task-completion-not-persisted
    kind: functional
    tier: L3
    symptoms: [completed, complete, "marked", "not completed", unchecked]
  - id: event-editor-title-typo
    kind: display
    tier: L1
    marker: "New Evnet"
    symptoms: [typo, misspelled, misspelt, evnet, spelled, spelling, title]
  - id: task-editor-title-typo
    kind: display
    tier: L1
    marker: "New Tsak"
    symptoms: [typo, misspelled, misspelt, tsak, spelled, spelling, title]
  # FORCED ORDERING (QUA-2714). L4: the app dies and the journey cannot continue.
  # No `marker:` — a marker is a DISPLAY defect's screen string, and nothing here is
  # drawn; the symptoms are how a human would report a disappearing app.
  - id: search-results-off-main-thread
    kind: functional
    tier: L4
    symptoms: [crash, crashed, crashes, closed, closes, quit, disappeared, exited,
               "force close", "shut down", "stopped working", "kicked out"]

test_cases:

  - id: cal-create-event
    name: Create an event
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Standup\"."
      - "Save the event."
      - "Find \"Standup\" on the calendar for today."
    expected_outcome: "The event \"Standup\" is saved and shown on today's date."
    step_budget: 40
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title}, {type: Standup}, {tap: Save}]
      # TODO(derive): re-run derive_journey.py --case cal-create-event after this oracle change
      # The brief promises "shown on today's date"; the query now checks the date (host
      # sqlite `localtime` — see docs/journey-oracle-audit.md, "host timezone").
      expect: {db: events.db, equals: "1", query: "select count(*) from events where title='Standup' and type=0 and date(start_ts,'unixepoch','localtime')=date('now','localtime');"}
    bugs: [event-editor-title-typo]

  - id: cal-create-task
    name: Create a task
    steps:
      - "Tap the + button and choose Task."
      - "Enter the title \"Groceries\"."
      - "Save the task."
      - "Find \"Groceries\" on the calendar for today."
    expected_outcome: "The task \"Groceries\" is saved and shown on today's date."
    step_budget: 40
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Task}, {tap: task_title}, {type: Groceries}, {tap: Save}]
      # TODO(derive): re-run derive_journey.py --case cal-create-task after this oracle change
      expect: {db: events.db, equals: "1", query: "select count(*) from events where title='Groceries' and type=1 and date(start_ts,'unixepoch','localtime')=date('now','localtime');"}
    bugs: [task-editor-title-typo]

  - id: cal-task-reminder
    name: Create a task with a reminder
    steps:
      - "Tap the + button and choose Task."
      - "Enter the title \"Pharmacy\"."
      - "Save the task."
      - "Open \"Pharmacy\" from the calendar and read its reminder."
    expected_outcome: "The saved task \"Pharmacy\" has a reminder 10 minutes before."
    step_budget: 45
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Task}, {tap: task_title}, {type: Pharmacy}, {tap: Save}]
      expect: {db: events.db, equals: "10", query: "select reminder_1_minutes from events where title='Pharmacy';"}
    bugs: [task-reminder-dropped]

  - id: cal-edit-event
    name: Rename an event
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Draft\" and save."
      - "Open \"Draft\" from the calendar."
      - "Change the title to \"Final\"."
      - "Save the event."
      - "Look at the calendar for today."
    expected_outcome: "The calendar shows \"Final\" and no longer shows \"Draft\"."
    step_budget: 50
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title}, {type: Draft}, {tap: Save}, {tap: Draft}, {tap: event_title}, {type: Final}, {tap: Save}]
      # TODO(derive): re-run derive_journey.py --case cal-edit-event after this oracle change
      # The brief promises "no longer shows Draft" too: a rename that left a copy behind used to pass.
      expect: {db: events.db, equals: "1,0", query: "select (select count(*) from events where title='Final') || ',' || (select count(*) from events where title='Draft');"}
    bugs: [edit-event-not-saved]

  - id: cal-delete-event
    name: Delete an event
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Lunch\" and save."
      - "Open \"Lunch\" from the calendar."
      - "Delete it and confirm."
      - "Look at the calendar for today."
    expected_outcome: "\"Lunch\" is no longer shown on the calendar."
    step_budget: 45
    check:
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title}, {type: Lunch}, {tap: Save}, {tap: Lunch}, {tap: Delete}, {tap: "Yes"}]
      expect: {db: events.db, equals: "0", query: "select count(*) from events where title='Lunch';"}
    bugs: [event-delete-broken]

  # ── FORCED-ORDERING exemplar (QUA-2714) ─────────────────────────────────────────
  # The route is the hunt corpus's `search` CONTROL plus a `wait`: proven to work on
  # this app, so a failure here is the seeded defect and not the route.
  #
  # Polarity, per the crash/ANR rule: the case keeps an ORDINARY completion oracle (the
  # event really was created) and `crash:` rides on it as a GATE, never a demand — "the
  # route runs with the app alive, and if it dies it must die THIS way". A positive
  # "must crash" would fail its own clean arm.
  #
  # The seeded arm dies AFTER the row is written, so the db count would still read 1;
  # the death dominates (run_steps -> CRASHED, which scores like violated) and that is
  # the documented shape, not an oversight. The gate is what stops some OTHER crash
  # being charged to this defect: a death whose signature does not contain
  # CalledFromWrongThreadException is INCONCLUSIVE, not a FAIL that agrees.
  #
  # Derived with --repeat 5 rather than the usual 3: forced ordering is the flakiest
  # bucket and this case is the template the rest copy.
  - id: cal-search-event
    name: Find an event with search
    steps:
      - "Tap the + button and choose Event."
      - "Enter the title \"Dentist\" and save."
      - "Open the search in the toolbar."
      - "Type \"Dent\" into the search field."
      - "Read what the search lists."
    expected_outcome: "The event \"Dentist\" is saved, and searching for \"Dent\" lists it."
    step_budget: 50
    check:
      # `wait` last: the fault is raised on a background thread a moment after the
      # query runs, so the route has to still be watching when the process dies.
      steps: [launch, {tap: calendar_fab}, {tap: Event}, {tap: event_title},
              {type: Dentist}, {tap: Save}, {tap: Search}, {type: Dent}, wait]
      expect: {db: events.db, equals: "1",
               query: "select count(*) from events where title='Dentist' and type=0;",
               crash: "CalledFromWrongThreadException"}
    bugs: [search-results-off-main-thread]
