              {long_press: Globex}, {tap: Transfer}, wait]
      expect: {present: "1 / 1 QR code"}
    evidence: ["1 / 1 QR code"]   # screen witness: the single-code counter
    bugs:
      - id: transfer-single-shows-next
        reference:
          kind: cross-check
          note: "The counter reads 1 / 1 QR code, so there is no second code; the screen still offers a Next control."
        reference_report:
          summary: Transfer screen for a single entry shows a Next button although there is only one code
          steps:
            - Launch Aegis Authenticator.
            - Tap the + button (Add new entry).
            - Tap Enter manually.
            - Type "Alpha" into the Name field.
            - Type "Acme" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXP" into the Secret field.
            - Tap SAVE.
            - Tap the + button (Add new entry).
            - Tap Enter manually.
            - Type "Bravo" into the Name field.
            - Type "Globex" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXQ" into the Secret field.
            - Tap SAVE.
