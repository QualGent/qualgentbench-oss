          failure_step: 'Step 4: Read the name and issuer the edit screen shows'

  # ── LIFECYCLE: a rename across a rotation ────────────────────────────────────────
  # list -> + menu -> editor -> list -> selection -> editor -> (rotate: recreated) ->
  # list. Without the rotation the seeded build saves the name like the clean one.
  - id: aegis-rename-across-rotation
    name: Rename an entry and rotate before saving
    brief:
      title: Keeping unsaved edits
      intended_behavior: >-
        An entry's edit screen holds on to what the user has typed until it is saved or
        discarded, even if the system rebuilds the screen in between, and saving stores
        exactly what was typed.
    steps:
      - "Add an entry named \"Alpha\" with issuer \"Acme\" and secret JBSWY3DPEHPK3PXP."
      - "Long-press the Acme entry and tap Edit in the toolbar."
      - "Change the name to \"Delta\"."
      - "Turn the device to landscape."
      - "Tap SAVE."
      - "Read how the list shows the entry."
    expected_outcome: "The list shows the entry as Acme (Delta)."
    step_budget: 55
    check:
      steps: [launch, {tap: Add new entry}, {tap: Enter manually}, {tap: text_name}, {type: Alpha},
              {tap: text_issuer}, {type: Acme}, {tap: text_secret}, {type: JBSWY3DPEHPK3PXP}, {tap: SAVE},
              {long_press: Acme}, {tap: Edit}, {tap: text_name}, {type: Delta},
              {rotate: landscape}, {tap: SAVE}, wait]
      expect: {present: "(Delta)"}
    evidence: ["(Delta)"]   # screen witness: the list row's account-name form, drawn only after the save
    bugs:
      - id: entry-name-lost-on-rotation
        reference_report:
          summary: A new entry name typed in the editor is lost when the device is rotated before saving
          steps:
            - Launch Aegis Authenticator.
            - Tap the + button (Add new entry).
            - Tap Enter manually.
            - Type "Alpha" into the Name field.
            - Type "Acme" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXP" into the Secret field.
            - Tap SAVE.
            - Press and hold the Acme entry in the list.
            - Tap Edit in the toolbar.
            - Type "Delta" into the Name field, replacing "Alpha".
            - Rotate the device to landscape.
            - Tap SAVE.
          expected: The Name field still reads Delta after the rotation, and after SAVE the list shows the entry as Acme "(Delta)".
          actual: After the rotation the Name field reverted to "Alpha"; after SAVE the list still shows the entry as Acme "(Alpha)".
          failure_step: 'Step 4: Turn the device to landscape'

  # ── ORDERING: transferring two entries ───────────────────────────────────────────
  # 9 screen states up to the Transfer screen. The seeded arm dies in MainActivity's
  # toolbar handler (ConcurrentModificationException at the second entry), before the
  # Transfer screen opens.
  - id: aegis-transfer-two-codes
    name: Open the transfer screen for two entries
    brief:
      title: Transferring several entries
      intended_behavior: >-
        Several selected entries can be transferred together. The transfer view starts
        with the first entry's QR code and counts how many codes the selection produced.
    steps:
      - "Add an entry named \"Alpha\" with issuer \"Acme\" and secret JBSWY3DPEHPK3PXP."
      - "Add an entry named \"Bravo\" with issuer \"Globex\" and secret JBSWY3DPEHPK3PXQ."
      - "Long-press the Acme entry, then tap the Globex entry so both are selected."
      - "Tap Transfer in the toolbar."
      - "Read the counter and the entry the screen shows."
    expected_outcome: "The transfer screen opens on Acme (Alpha) and reads \"1 / 2 QR codes\"."
    step_budget: 70
    check:
      steps: [launch, {tap: Add new entry}, {tap: Enter manually}, {tap: text_name}, {type: Alpha},
              {tap: text_issuer}, {type: Acme}, {tap: text_secret}, {type: JBSWY3DPEHPK3PXP}, {tap: SAVE},
              {tap: Add new entry}, {tap: Enter manually}, {tap: text_name}, {type: Bravo},
              {tap: text_issuer}, {type: Globex}, {tap: text_secret}, {type: JBSWY3DPEHPK3PXQ}, {tap: SAVE},
              {long_press: Acme}, {tap: Globex}, {tap: Transfer}, wait]
      expect: {present: "1 / 2 QR codes", crash: ConcurrentModificationException}
    evidence: ["1 / 2 QR codes"]   # screen witness: the two-code counter, only on the Transfer screen
    bugs:
      - id: share-ends-selection-mid-loop
        reference_report:
          summary: App crashes when tapping Transfer with two entries selected
          steps:
            - Launch Aegis Authenticator.
            - Tap the + button (Add new entry).
            - Tap Enter manually.
            - Type "Alpha" into the Name field.
            - Type "Acme" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXP" into the Secret field.
            - Tap SAVE.
            - Tap the + button (Add new entry).
            - Tap Enter manually.
            - Type "Bravo" into the Name field.
            - Type "Globex" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXQ" into the Secret field.
            - Tap SAVE.
            - Press and hold the Acme entry in the list.
            - Tap the Globex entry.
            - Tap Transfer in the toolbar.
          expected: The Transfer entries screen opens on Acme (Alpha) and reads "1 / 2 QR codes".
          actual: The transfer screen never opened. The app crashed and the device went back to the home screen; the device log shows ConcurrentModificationException.
          failure_step: 'Step 4: Tap Transfer in the toolbar'

# ── Drift flags (QUA-3490) ───────────────────────────────────────────────────────────
# Benign UI changes compiled into the journey APK beside the defects (the patches are in
# the benchmark spec's `drift:`). NOT defects: no case lists one under `bugs:`, nothing
# that scores reads them, and the brief does not change (its steps still name the
# drift-off UI). A memory track switches them on per stage (`journey.journey_tasks(...,
# drift=...)`); `rewrite:` is how the harness-only replay route walks the drifted UI.
# `scripts/derive_journey.py <app> --drift all --repeat 3` proves every affected case
# reaches the same verdict with them on (data/truth/drift-<app>.json).
drift:
  - id: aegis-drift-fab-label
    kind: relabel
    change: 'The + button is announced as "Add account" instead of "Add new entry".'
    rewrite:
      - from: {tap: Add new entry}
        to: [{tap: Add account}]
  - id: aegis-drift-enter-label
    kind: relabel
    change: 'The + menu''s "Enter manually" item reads "Type in details".'
    rewrite:
      - from: {tap: Enter manually}
        to: [{tap: Type in details}]
  - id: aegis-drift-transfer-overflow
    kind: move
    change: "With entries selected, the Transfer action moves from the toolbar into the More options menu."
    rewrite:
      - from: {tap: Transfer}
        to: [{tap: More options}, {tap: Transfer}]
  - id: aegis-drift-settings-label
    kind: relabel
    change: 'The main menu''s "Settings" entry reads "Preferences".'
    rewrite:
      - from: {tap: Settings}
        to: [{tap: Preferences}]
