            - Type "Acme" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXP" into the Secret field.
            - Tap SAVE.
            - Tap the + button (Add new entry).
            - Tap Enter manually.
            - Type "Bravo" into the Name field.
            - Type "Globex" into the Issuer field.
            - Type "JBSWY3DPEHPK3PXQ" into the Secret field.
