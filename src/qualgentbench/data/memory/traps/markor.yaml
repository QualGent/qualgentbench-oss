# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
#
# Trap memories (QUA-3491, spec 5.1): hand-written WRONG entries placed in M_k at `stage`.
# Shape: memory.tracks.TrapDef (= memory.metrics.Trap + text, drift, lint_allow, note).
# `memory.tracks.apply_traps` adds `text` as a NEW entry `entry_id` to a COPY of the stage
# memory; the packaged base memory is never edited. Exposure = entry_id rendered.

traps:
  # "Fixed" for a bug that is still live: the folder ANR is on in run-2's seeded run.
  - id: markor-trap-folder-fixed
    app: markor
    effect: missed_bug
    stage: run-2
    entry_id: bug-901
    bug: new-folder-blocks-main-thread
    cases: [markor-new-folder-with-note]
    text: >-
      Making a new folder with the FOLDER button in the new-file dialog used to leave
      the app frozen; this was fixed in the previous release, and the new folder now
      opens at once.
    note: the folder defect is still on in this stage's build

  # "Won't fix" on a seeded bug: the editor's File Browser opening the top folder.
  - id: markor-trap-file-browser-accepted
    app: markor
    effect: missed_bug
    stage: run-3
    entry_id: accepted-901
    bug: file-browser-opens-notebook-root
    cases: [markor-search-then-file-browser]
    text: >-
      "File Browser" in the editor's More options menu always opens the notebook's
      top folder, not the folder that holds the open note; the maintainer keeps it
      that way on purpose.
    note: intended behavior is the note's own folder; the seeded build opens the top folder

  # A button described in its old place: Save leaves the toolbar in run-4 (drift).
  - id: markor-trap-save-toolbar
    app: markor
    effect: not_completed
    stage: run-4
    entry_id: nav-901
    drift: markor-drift-save-overflow
    cases: [markor-save-then-restart]
    text: >-
      In the editor, Save is the disk icon on the top toolbar, beside More options;
      the More options menu itself has no Save item.
    note: with markor-drift-save-overflow on, Save is inside More options
