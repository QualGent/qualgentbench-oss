traps:
  - id: stt-trap-tag-wontfix
    app: simpletimetracker
    effect: missed_bug
    stage: run-2
    entry_id: accepted-901
    bug: tag-save-crash
    cases: [stt-tag-for-activity]
    text: >-
      Saving a new record tag from "Edit categories and tags" closes the app on this
      build; the maintainer accepted this as a known limitation that will not be
      changed.
    note: saving a record tag is supposed to work; the seeded build crashes there

  - id: stt-trap-statistics-share
    app: simpletimetracker
    effect: false_report
    stage: run-3
    entry_id: note-901
    cases: [stt-statistics-single-activity]
    markers: ["100%", "4%", "share", "fraction of the day", "percentage"]
    text: >-
      The Statistics tab shows each activity's time as a share of the whole day, so
      one hour of tracking reads as about 4%.
    note: the real share is of the tracked total; one tracked activity is 100%

  - id: stt-trap-add-card
    app: simpletimetracker
    effect: not_completed
    stage: run-4
    entry_id: nav-901
    drift: stt-drift-add-label
    cases: [stt-duplicate-activity-name]
    text: >-
      A new activity is always started from the card labelled "Add", the last tile of
      the Timers grid; no other tile on that screen creates an activity.
    note: with stt-drift-add-label on, that card reads "New activity"
