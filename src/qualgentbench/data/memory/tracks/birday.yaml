# token appears in an episode transcript the episode is void. Do not remove.
#
# App update track (QUA-3491, spec 5.1-5.2). Schema and rules: memory/tracks.py. Every case
# runs exactly once per ordering (both versions in its block; only the `seeded:` list runs
# seeded as the planned version, everything else contributes its clean run). run-1 is v1:
# clean, no drift. `fixed:` holds pair and trap cases (same stage in every ordering);
# `orderings:` shuffle the rest.

schema: 1
app: birday
stages:
  - {id: run-1, drift: []}
  - {id: run-2, drift: []}
  - {id: run-3, drift: []}
  - {id: run-4, drift: []}
fixed:
  run-1: [birday-edit-date, birday-favorite-from-list]
  run-2: [birday-edit-name-day, birday-delete-anniversary]
  run-3: [birday-favorite-note, birday-search-delete, birday-add-without-year]
  run-4: [birday-favorite-anniversary]
orderings:
  a:
    run-1: [birday-search-full-name]
    run-2: [birday-details-note]
    run-4: [birday-add-anniversary-rotate, birday-delete-all-events]
  b:
    run-1: [birday-add-anniversary-rotate]
    run-2: [birday-delete-all-events]
    run-4: [birday-search-full-name, birday-details-note]
seeded: [birday-edit-name-day, birday-favorite-note, birday-search-delete,
         birday-add-without-year]
pairs:
  - id: birday-pair-edit
    source: birday-edit-date
    target: birday-edit-name-day
    bug: edit-opens-new-event-form
    route: [Edit event, positiveButton]
  - id: birday-pair-favorites
    source: birday-favorite-from-list
    target: birday-favorite-note
    bug: favorite-born-year-off-by-one
    route: [Add to favorites, Favorites]
  - id: birday-pair-search-delete
    source: birday-delete-anniversary
    target: birday-search-delete
    bug: search-result-opens-unfiltered-row
    route: [homeSearch, eventPerson, Delete event]
traps: [birday-trap-no-year-fixed, birday-trap-anniversary-zodiac]
