# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
#
# App update track (QUA-3491, spec 5.1-5.2). Schema and rules: memory/tracks.py. Every case
# runs exactly once per ordering (both versions in its block; only the `seeded:` list runs
# seeded as the planned version, everything else contributes its clean run). run-1 is v1:
# clean, no drift. `fixed:` holds pair and trap cases (same stage in every ordering);
# `orderings:` shuffle the rest.

schema: 1
app: aegis
stages:
  - {id: run-1, drift: []}
  - {id: run-2, drift: []}
  - {id: run-3, drift: [aegis-drift-settings-label]}
  - id: run-4
    drift: [aegis-drift-settings-label, aegis-drift-fab-label, aegis-drift-enter-label,
            aegis-drift-transfer-overflow]
fixed:
  run-1: [aegis-delete-confirmation, aegis-transfer-one-entry, aegis-rename-entry]
  run-2: [aegis-delete-two-entries, aegis-transfer-two-entries, aegis-set-up-backups]
  run-3: [aegis-edit-second-entry, aegis-edit-used-entry]
  run-4: [aegis-transfer-two-codes]
orderings:
  a:
    run-3: [aegis-remove-only-group]
    run-4: [aegis-audit-log-after-transfer, aegis-rename-across-rotation]
  b:
    run-3: [aegis-rename-across-rotation]
    run-4: [aegis-remove-only-group, aegis-audit-log-after-transfer]
seeded: [aegis-delete-two-entries, aegis-transfer-two-entries, aegis-set-up-backups,
         aegis-edit-second-entry]
pairs:
  - id: aegis-pair-delete
    source: aegis-delete-confirmation
    target: aegis-delete-two-entries
    bug: delete-dialog-count-format-crash
    route: [More options, Delete]
  - id: aegis-pair-transfer
    source: aegis-transfer-one-entry
    target: aegis-transfer-two-entries
    bug: transfer-next-skips-code
    route: [Globex, Transfer]
  - id: aegis-pair-edit
    source: aegis-rename-entry
    target: aegis-edit-second-entry
    bug: edit-opens-first-entry
    route: [Edit]
traps: [aegis-trap-backup-accepted, aegis-trap-editor-read-only, aegis-trap-transfer-toolbar]
