# token appears in an episode transcript the episode is void. Do not remove.
#
# App update track (QUA-3491, spec 5.1-5.2). Schema and rules: memory/tracks.py. Every case
# runs exactly once per ordering (both versions in its block; only the `seeded:` list runs
# seeded as the planned version, everything else contributes its clean run). run-1 is v1:
# clean, no drift. `fixed:` holds pair and trap cases (same stage in every ordering);
# `orderings:` shuffle the rest.

schema: 1
app: markor
stages:
  - {id: run-1, drift: []}
  - {id: run-2, drift: []}
  - {id: run-3, drift: [markor-drift-fab-label]}
  - id: run-4
    drift: [markor-drift-fab-label, markor-drift-save-overflow,
            markor-drift-file-browser-label, markor-drift-details-overflow]
fixed:
  run-1: [markor-todo-set-priority, markor-move-two-recipes, markor-edit-survives-rotation]
  run-2: [markor-todo-complete-task, markor-edit-note-and-check-size, markor-new-folder-with-note]
  run-3: [markor-copy-note-to-top-folder, markor-search-then-file-browser]
  run-4: [markor-save-then-restart]
orderings:
  a:
    run-3: [markor-new-note-from-template]
    run-4: [markor-new-note-details, markor-new-note-in-folder]
  b:
    run-3: [markor-new-note-in-folder]
    run-4: [markor-new-note-from-template, markor-new-note-details]
seeded: [markor-todo-complete-task, markor-edit-note-and-check-size,
         markor-new-folder-with-note, markor-copy-note-to-top-folder,
         markor-search-then-file-browser]
pairs:
  - id: markor-pair-todo
    source: markor-todo-set-priority
    target: markor-todo-complete-task
    bug: todo-toggle-done-crash
    route: [To-Do, Priority]
  - id: markor-pair-copy
    source: markor-move-two-recipes
    target: markor-copy-note-to-top-folder
    bug: copy-into-folder-crash
    route: [Recipes, Soup.md, More options, SELECT THIS FOLDER]
  - id: markor-pair-size
    source: markor-edit-survives-rotation
    target: markor-edit-note-and-check-size
    bug: content-not-saved
    route: [document__fragment__edit__highlighting_editor, More options, File Browser, Details]
traps: [markor-trap-folder-fixed, markor-trap-file-browser-accepted, markor-trap-save-toolbar]
