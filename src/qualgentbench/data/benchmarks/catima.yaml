# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Catima (github.com/CatimaLoyalty/Android) — seeded-bug benchmark app.
# MEDIUM tier: 4 bugs + 2 working controls.
#
# Loyalty-card wallet (Stocard-shaped): cards with a store name, note, balance, barcode,
# plus star/favourite and archive states and card groups. Chosen when the Medium tier was
# rebalanced to solid-only apps — it is plain CRUD over a real SQLite database, so bugs
# are one-sentence statements and controls have a clean oracle.
#
# Storage: SQLiteOpenHelper databases/Catima.db, table `cards`
# (store, note, cardid, balance, starstatus, archivestatus).
#
# Each bug gates a DIFFERENT single-purpose method in DBHelper — star, archive, edit and
# delete are separate methods upstream, so no fix can repair another. insertLoyaltyCard is
# deliberately untouched: both controls depend on it.
#
# Journey (QUA-3458, epic QUA-3449): 11 more journey-only defects follow the hunt bugs
# below (no exploration feature names them, so hunt mode never switches them on), and
# `edit-not-saved` doubles as the journey corpus's persistence defect. The cases are in
# data/test-cases/catima.yaml.

app:
  id: catima
  name: Catima
  package: me.hackerchick.catima.debug         # debug build (applicationIdSuffix .debug)
  platform: android
  difficulty: medium

apk:
  repo: qualgent/qualgentbench-apps
  filename: medium/catima-buggy.apk
  sha256: 773035b83bf003d0c48db74aa97ea0ab5884897373ec27b4042d2727efe1b25e
  size_bytes: 26944494

build:
  repo: https://github.com/CatimaLoyalty/Android
  dir: Catima
  ref: "v2.44.0"                              # latest per `git tag --sort=-v:refname`
  gradle_task: ":app:assembleDebug"
  apk_glob: "app/build/outputs/apk/foss/debug/*.apk"
  # `build_app.py --demo-fired` anchor (QUA-3458): a line every launch runs, after which
  # one throwaway QgbFlags.fired("demo") call is inserted to prove the canary round trip.
  demo_fired:
    file: app/src/main/java/protect/card_locker/MainActivity.kt
    find: "super.onCreate(inputSavedInstanceState)"

flags:
  file: app/src/main/java/protect/card_locker/QgbFlags.java
  package: protect.card_locker

exploration:
  id: explore-catima
  step_budget: 500
  title: "Release sign-off \u2014 Cards"
  # HARNESS-ONLY (truth.setup_of): Catima starts empty, so every area needs a card.
  # Adding one goes through the barcode SCANNER by default; `Add a card with no
  # barcode` is the path that needs no camera. Runs on the CLEAN build.
  # Not `device_setup` — the agent still does all of this; see birday.
  check_setup:
    steps: [{tap: "Add"}, {tap: "More options"}, {tap: "Add a card with no barcode"},
            {type: "QACARD1"}, {tap: "OK"}, {tap: "Name"}, {type: "QASEED"},
            {tap: "Save"}]
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py).
    # `edit-not-saved` drops ONLY the store column on update, so the note written
    # through the same form still persists — which is what keeps add_note a control.
    - id: add_card
      state: ok
      probe: [card, store]
      check:
        steps: [launch, {tap: "Add"}, {tap: "More options"},
                {tap: "Add a card with no barcode"}, {type: "QACARD2"}, {tap: "OK"},
                {tap: "Name"}, {type: "QAADD"}, {tap: "Save"}]
        expect: {db: Catima.db, equals: "1",
                 query: "select count(*) from cards where store='QAADD';"}
    - id: add_note
      state: ok
      probe: [note, card]
      check:
        steps: [launch, {tap: "QASEED"}, {tap: "Edit"}, {tap: "Options"},
                {tap: "Note"}, {type: "QANOTE"}, {tap: "Save"}]
        expect: {db: Catima.db, equals: "1",
                 query: "select count(*) from cards where store='QASEED' and note like '%QANOTE%';"}
    - id: card_list
      state: ok
      probe: [card]
      check:
        steps: [launch, relaunch]
        expect: {present: "QASEED"}
    - id: card_detail
      state: ok
      probe: [card, store]
      check:
        # The card ID is on the detail screen only — the list shows the store name —
        # so this cannot hold without actually opening the card.
        steps: [launch, {tap: "QASEED"}]
        expect: {present: "QACARD1"}
    - id: star_card
      state: broken
      bug_id: star-not-persisted
      probe: [favorite, favourite, star]
      check:
        steps: [launch, {long_press: "QASEED"}, {tap: "More options"},
                {tap: "Add to favorites"}]
        expect: {db: Catima.db, equals: "1",
                 query: "select starstatus from cards where store='QASEED';"}
    - id: archive_card
      state: broken
      bug_id: archive-not-persisted
      probe: [archive]
      check:
        steps: [launch, {long_press: "QASEED"}, {tap: "More options"}, {tap: "Archive"}]
        expect: {db: Catima.db, equals: "1",
                 query: "select archive from cards where store='QASEED';"}
    - id: edit_card
      state: broken
      bug_id: edit-not-saved
      probe: [edit, store]
      check:
        # `storeNameEdit` by resource-id: the field arrives pre-filled, so its visible
        # text is the store name and `Name` is only the floating label beside it.
        steps: [launch, {tap: "QASEED"}, {tap: "Edit"}, {tap: "Card"},
                {tap: "storeNameEdit"}, {type: "EDIT"}, {tap: "Save"}]
        expect: {db: Catima.db, equals: "1",
                 query: "select count(*) from cards where store like '%EDIT%';"}
    - id: delete_card
      state: broken
      bug_id: delete-broken
      probe: [delete, remove]
      check:
        steps: [launch, {long_press: "QASEED"}, {tap: "More options"}, {tap: "Delete"},
                {tap: "Confirm"}]
        expect: {db: Catima.db, equals: "0",
                 query: "select count(*) from cards where store='QASEED';"}
  instruction: |
    You are a QA engineer. This build of a loyalty-card app has been handed to you
    for release sign-off. The list below is what the product team says each area should
    do. Verify them on the device and report what you actually observe.

    Cards are added with the + button. A card can be opened from the list to see its details.

    SPECIFICATION
      - add_card: a card you add is listed afterwards.
      - add_note: a note entered with a card is stored with it.
      - card_list: the list shows the cards that exist.
      - card_detail: a card's details are what was entered for it.
      - star_card: a card you mark as favourite stays marked.
      - archive_card: a card you archive stays archived.
      - edit_card: a card's details after editing are the details you entered.
      - delete_card: a card you delete is no longer listed.

bugs:
  # L3 — the star fills in the UI but is always written as "not starred", so it is empty
  # again when the list reloads.
  - id: star-not-persisted
    title: Starring a card does not stick
    patch:
      file: app/src/main/java/protect/card_locker/DBHelper.java
      find: |-
        public static boolean updateLoyaltyCardStarStatus(SQLiteDatabase database, final int id, final int starStatus) {
            ContentValues contentValues = new ContentValues();
            contentValues.put(LoyaltyCardDbIds.STAR_STATUS, starStatus);
      replace: |-
        public static boolean updateLoyaltyCardStarStatus(SQLiteDatabase database, final int id, final int starStatus) {
            ContentValues contentValues = new ContentValues();
            // BUG(star-not-persisted): the star is always stored as off.
            contentValues.put(LoyaltyCardDbIds.STAR_STATUS,
                    protect.card_locker.QgbFlags.on("star-not-persisted") ? 0 : starStatus);

  # L3 — archiving reports success but the card stays unarchived, so it is still in the
  # main list after a refresh.
  - id: archive-not-persisted
    title: Archiving a card does not stick
    patch:
      file: app/src/main/java/protect/card_locker/DBHelper.java
      find: |-
        public static boolean updateLoyaltyCardArchiveStatus(SQLiteDatabase database, final int id, final int archiveStatus) {
            ContentValues contentValues = new ContentValues();
            contentValues.put(LoyaltyCardDbIds.ARCHIVE_STATUS, archiveStatus);
      replace: |-
        public static boolean updateLoyaltyCardArchiveStatus(SQLiteDatabase database, final int id, final int archiveStatus) {
            ContentValues contentValues = new ContentValues();
            // BUG(archive-not-persisted): the archive flag is always stored as off.
            contentValues.put(LoyaltyCardDbIds.ARCHIVE_STATUS,
                    protect.card_locker.QgbFlags.on("archive-not-persisted") ? 0 : archiveStatus);

  # L3 — the edit screen closes as if saved; the row keeps its old values. The STORE
  # column is left untouched while everything else still writes, so the card the user
  # renamed silently keeps its old name.
  #
  # (An earlier draft of this patch added a helper method that nothing called — a dead
  # bug. Gate a statement on the real path, never introduce a new symbol.)
  - id: edit-not-saved
    title: Editing a card's store name does not save
    # The find block MUST be anchored on the updateLoyaltyCard signature. The bare
    # "// Card / ContentValues …" block is byte-identical in insertLoyaltyCard (line
    # ~566) and updateLoyaltyCard (~639), so the old find matched the INSERT first and
    # the defect landed on card CREATION: with the flag live no card could be added at
    # all, which silently broke the add_card control and made six areas unreachable in
    # hunt mode. Guided never saw it — clean tasks run with no flags set.
    patch:
      file: app/src/main/java/protect/card_locker/DBHelper.java
      find: |-
        public static boolean updateLoyaltyCard(
                SQLiteDatabase database, final int id, final String store, final String note,
                final Date validFrom, final Date expiry, final BigDecimal balance,
                final Currency balanceType, final String cardId, final String barcodeId,
                final CatimaBarcode barcodeType, final @NonNull Charset barcodeEncoding,
                final Integer headerColor, final int starStatus,
                final Long lastUsed, final int archiveStatus) {
            database.beginTransaction();

            // Card
            ContentValues contentValues = new ContentValues();
            contentValues.put(LoyaltyCardDbIds.STORE, store);
      replace: |-
        public static boolean updateLoyaltyCard(
                SQLiteDatabase database, final int id, final String store, final String note,
                final Date validFrom, final Date expiry, final BigDecimal balance,
                final Currency balanceType, final String cardId, final String barcodeId,
                final CatimaBarcode barcodeType, final @NonNull Charset barcodeEncoding,
                final Integer headerColor, final int starStatus,
                final Long lastUsed, final int archiveStatus) {
            database.beginTransaction();

            // Card
            ContentValues contentValues = new ContentValues();
            // BUG(edit-not-saved): the edited store name is dropped on the way to the DB.
            // Anchored on updateLoyaltyCard so insertLoyaltyCard is untouched and the
            // add_card control still passes. The canary fires only when the name changed,
            // i.e. only when the dropped write loses something (QUA-3458).
            if (!QgbFlags.on("edit-not-saved")) {
                contentValues.put(LoyaltyCardDbIds.STORE, store);
            } else {
                Cursor qgbOld = database.query(LoyaltyCardDbIds.TABLE,
                        new String[]{LoyaltyCardDbIds.STORE}, whereAttrs(LoyaltyCardDbIds.ID),
                        withArgs(id), null, null, null);
                if (qgbOld.moveToFirst() && !store.equals(qgbOld.getString(0))) {
                    protect.card_locker.QgbFlags.fired("edit-not-saved");
                }
                qgbOld.close();
            }
  # L2 — delete removes the card from the list but never from the database.
  - id: delete-broken
    title: Deleting a card does not remove it
    patch:
      file: app/src/main/java/protect/card_locker/DBHelper.java
      find: |-
        public static boolean deleteLoyaltyCard(SQLiteDatabase database, Context context, final int id) {
            // Delete card
            int rowsDeleted = database.delete(LoyaltyCardDbIds.TABLE,
                    whereAttrs(LoyaltyCardDbIds.ID),
                    withArgs(id));
      replace: |-
        public static boolean deleteLoyaltyCard(SQLiteDatabase database, Context context, final int id) {
            // BUG(delete-broken): the card row is never deleted, but success is reported.
            if (QgbFlags.on("delete-broken")) {
                return true;
            }
            // Delete card
            int rowsDeleted = database.delete(LoyaltyCardDbIds.TABLE,
                    whereAttrs(LoyaltyCardDbIds.ID),
                    withArgs(id));

  # ── Journey-only defects (QUA-3458, epic QUA-3449) ───────────────────────────────
  # No exploration feature names these, so hunt mode never activates them; each has its
  # one guided task below only because build_app.py wants a task per patched bug. Every
  # patch calls protect.card_locker.QgbFlags.fired("<id>") on the line before its effect, and only when the
  # effect happens.

  # CRASH — Spend in the balance dialog divides the amount before subtracting it; a
  # non-terminating quotient (5 / 3) throws before the new balance is written.
  - id: spend-balance-crash
    title: Spending points from a card crashes the app
    patch:
      file: app/src/main/java/protect/card_locker/cardview/LoyaltyCardViewDialogs.java
      find: |-
        builder.setPositiveButton(R.string.spend, (dialogInterface, i) -> {
                    try {
                        BigDecimal balanceChange = Utils.parseBalance(input.getText().toString(), loyaltyCard.balanceType);
      replace: |-
        builder.setPositiveButton(R.string.spend, (dialogInterface, i) -> {
                    try {
                        BigDecimal balanceChange = Utils.parseBalance(input.getText().toString(), loyaltyCard.balanceType);
                        // BUG(spend-balance-crash): the spent amount is split before it is
                        // subtracted; an exact divide throws for any amount not divisible by 3.
                        if (protect.card_locker.QgbFlags.on("spend-balance-crash")) {
                            try {
                                balanceChange = balanceChange.divide(new BigDecimal(3)).multiply(new BigDecimal(3));
                            } catch (ArithmeticException qgbE) {
                                protect.card_locker.QgbFlags.fired("spend-balance-crash");
                                throw qgbE;
                            }
                        }

  # CRASH — saving a group whose card selection changed throws before the selection is
  # written (the group screen's Save).
  - id: group-cards-save-crash
    title: Saving a group's cards crashes the app
    patch:
      file: app/src/main/java/protect/card_locker/ManageGroupActivity.kt
      find: |-
        mAdapter.commitToDatabase()
                    if (currentGroupName != mGroup._id) {
      replace: |-
        // BUG(group-cards-save-crash): the changed selection is indexed one past its end.
                    if (mAdapter.hasChanged() && protect.card_locker.QgbFlags.on("group-cards-save-crash")) {
                        protect.card_locker.QgbFlags.fired("group-cards-save-crash")
                        throw IndexOutOfBoundsException("group selection index out of range")
                    }
                    mAdapter.commitToDatabase()
                    if (currentGroupName != mGroup._id) {

  # CRASH — Duplicate parses the card ID as a number to propose the next one; a card ID
  # with a letter in it throws as the duplicate opens, before anything is saved.
  - id: duplicate-card-id-crash
    title: Duplicating a card with a non-numeric ID crashes the app
    patch:
      file: app/src/main/java/protect/card_locker/LoyaltyCardEditActivity.java
      find: |-
        finish();
        return false;
        }
        viewModel.setLoyaltyCard(loyaltyCard);
      replace: |-
        finish();
        return false;
        }
                    // BUG(duplicate-card-id-crash): the duplicate's card ID is parsed as a number.
                    if (viewModel.getDuplicateFromLoyaltyCardId() && protect.card_locker.QgbFlags.on("duplicate-card-id-crash")) {
                        try {
                            Integer.parseInt(loyaltyCard.cardId);
                        } catch (NumberFormatException qgbE) {
                            protect.card_locker.QgbFlags.fired("duplicate-card-id-crash");
                            throw qgbE;
                        }
                    }
                    viewModel.setLoyaltyCard(loyaltyCard);

  # CRASH — Archive from the card screen's overflow menu throws before the archive flag is
  # written (the list's selection Archive is a different path and is untouched).
  - id: card-screen-archive-crash
    title: Archiving from the card screen crashes the app
    patch:
      file: app/src/main/java/protect/card_locker/cardview/LoyaltyCardViewActivity.java
      find: |-
        } else if (id == R.id.action_archive) {
                    DBHelper.updateLoyaltyCardArchiveStatus(database, loyaltyCardId, 1);
      replace: |-
        } else if (id == R.id.action_archive) {
                    // BUG(card-screen-archive-crash): the archive action runs on a card state never loaded.
                    if (protect.card_locker.QgbFlags.on("card-screen-archive-crash")) {
                        protect.card_locker.QgbFlags.fired("card-screen-archive-crash");
                        throw new IllegalStateException("card archive state not loaded");
                    }
                    DBHelper.updateLoyaltyCardArchiveStatus(database, loyaltyCardId, 1);

  # DISPLAY (content-format) — the card list draws a balance ten times its stored value.
  # The stored balance, the card screen and its dialogs are right.
  - id: list-balance-tenfold
    title: The card list shows balances ten times too large
    patch:
      file: app/src/main/java/protect/card_locker/LoyaltyCardCursorAdapter.java
      find: |-
        inputHolder.setExtraField(inputHolder.mBalanceField, Utils.formatBalance(mContext, loyaltyCard.balance, loyaltyCard.balanceType), null, showDivider);
      replace: |-
        // BUG(list-balance-tenfold): the list row multiplies the balance by ten.
                    java.math.BigDecimal qgbBalance = loyaltyCard.balance;
                    if (protect.card_locker.QgbFlags.on("list-balance-tenfold")) {
                        protect.card_locker.QgbFlags.fired("list-balance-tenfold");
                        qgbBalance = qgbBalance.multiply(java.math.BigDecimal.TEN);
                    }
                    inputHolder.setExtraField(inputHolder.mBalanceField, Utils.formatBalance(mContext, qgbBalance, loyaltyCard.balanceType), null, showDivider);

  # DISPLAY (widget-inventory) — the card screen's overflow menu offers Unarchive for a
  # card that is not archived (an extra control; Archive is still offered beside it).
  - id: unarchive-offered-for-active-card
    title: The card screen offers Unarchive for a card that is not archived
    patch:
      file: app/src/main/java/protect/card_locker/cardview/LoyaltyCardViewActivity.java
      find: |-
        menu.findItem(R.id.action_unarchive).setVisible(false);
      replace: |-
        // BUG(unarchive-offered-for-active-card): Unarchive stays in the menu of an active card.
                        boolean qgbExtra = protect.card_locker.QgbFlags.on("unarchive-offered-for-active-card");
                        if (qgbExtra) {
                            protect.card_locker.QgbFlags.fired("unarchive-offered-for-active-card");
                        }
                        menu.findItem(R.id.action_unarchive).setVisible(qgbExtra);

  # DISPLAY (content-format) — the Groups screen counts one card more than the group has.
  - id: group-card-count-off-by-one
    title: The Groups screen counts one card too many
    patch:
      file: app/src/main/java/protect/card_locker/GroupCursorAdapter.java
      find: |-
        int groupCardCount = DBHelper.getGroupCardCount(mDatabase, group._id);
      replace: |-
        int groupCardCount = DBHelper.getGroupCardCount(mDatabase, group._id);
                // BUG(group-card-count-off-by-one): the drawn count includes one card too many.
                if (protect.card_locker.QgbFlags.on("group-card-count-off-by-one")) {
                    protect.card_locker.QgbFlags.fired("group-card-count-off-by-one");
                    groupCardCount = groupCardCount + 1;
                }

  # NAVIGATION — with a search typed, tapping a result opens the card at that position in
  # the UNFILTERED list, so the card screen shows (and acts on) another card.
  - id: search-result-opens-other-card
    title: A search result opens a different card
    patch:
      file: app/src/main/java/protect/card_locker/MainActivity.kt
      find: |-
        loyaltyCard = mAdapter.getCard(inputPosition)
      replace: |-
        // BUG(search-result-opens-other-card): the position is read against the unfiltered list.
                        val qgbShown = mAdapter.getCard(inputPosition)
                        var qgbOpened = qgbShown
                        if (mFilter.isNotEmpty() && protect.card_locker.QgbFlags.on("search-result-opens-other-card")) {
                            val qgbAll = DBHelper.getLoyaltyCardCursor(mDatabase, "", null, mOrder, mOrderDirection,
                                DBHelper.LoyaltyCardArchiveFilter.Unarchived)
                            if (qgbAll.moveToPosition(inputPosition)) {
                                qgbOpened = LoyaltyCard.fromCursor(this, qgbAll)
                            }
                            qgbAll.close()
                            if (qgbOpened.id != qgbShown.id) {
                                protect.card_locker.QgbFlags.fired("search-result-opens-other-card")
                            }
                        }
                        loyaltyCard = qgbOpened

  # LIFECYCLE — when the card editor is recreated (a rotation), the note typed so far is
  # cleared before the fields are filled back in; saving then stores an empty note.
  - id: note-lost-on-rotation
    title: A note typed while adding a card is lost when the screen rotates
    patch:
      file: app/src/main/java/protect/card_locker/LoyaltyCardEditActivity.java
      find: |-
        noteFieldEdit.setText(viewModel.getLoyaltyCard().note);
      replace: |-
        // BUG(note-lost-on-rotation): a recreated editor drops the note it was holding.
                if (onRestoring && protect.card_locker.QgbFlags.on("note-lost-on-rotation")
                        && !viewModel.getLoyaltyCard().note.isEmpty()) {
                    protect.card_locker.QgbFlags.fired("note-lost-on-rotation");
                    viewModel.getLoyaltyCard().setNote("");
                }
                noteFieldEdit.setText(viewModel.getLoyaltyCard().note);

  # ORDERING — the card editor's barcode preview is drawn by running the result RUN
  # INLINE on a worker thread instead of POSTING it to the main thread, with the main
  # thread parked where it owes no layout pass, so Android's thread check is reached every
  # time (the cal-search-event two-latch shape). The editor's barcode preview only:
  # the scan screen's barcode list and the card screen post as before.
  - id: barcode-preview-off-main-thread
    title: Choosing a barcode type for a card crashes the app
    patches:
      - file: app/src/main/java/protect/card_locker/BarcodeImageWriterTask.java
        find: |-
          public void onPostExecute(Object castResult) {
                  Bitmap result = (Bitmap) castResult;
        replace: |-
          // The view this task draws into.
              public ImageView qgbTarget() {
                  return imageViewReference.get();
              }

              public void onPostExecute(Object castResult) {
                  Bitmap result = (Bitmap) castResult;
      - file: app/src/main/java/protect/card_locker/async/TaskHandler.java
        find: |-
          final Object result = callable.call();

                          // Post results on UI Thread so we can show them
                          uiHandler.post(() -> {
                              callable.onPostExecute(result);
                          });
        replace: |-
          final Object result = callable.call();

                          // BUG(barcode-preview-off-main-thread): the editor's preview is drawn
                          // inline on a worker thread instead of being posted to the main thread.
                          android.view.View qgbTarget = callable instanceof protect.card_locker.BarcodeImageWriterTask
                                  ? ((protect.card_locker.BarcodeImageWriterTask) callable).qgbTarget() : null;
                          if (type == TYPE.BARCODE && qgbTarget != null
                                  && qgbTarget.getContext() instanceof protect.card_locker.LoyaltyCardEditActivity
                                  && protect.card_locker.QgbFlags.on("barcode-preview-off-main-thread")) {
                              final android.view.View qgbRoot = qgbTarget.getRootView();
                              new Thread(() -> {
                                  final java.util.concurrent.CountDownLatch qgbParked = new java.util.concurrent.CountDownLatch(1);
                                  final java.util.concurrent.CountDownLatch qgbRelease = new java.util.concurrent.CountDownLatch(1);
                                  uiHandler.post(new Runnable() {
                                      @Override
                                      public void run() {
                                          if (qgbRoot.isLayoutRequested()
                                                  || (qgbRoot.getParent() != null && qgbRoot.getParent().isLayoutRequested())) {
                                              uiHandler.post(this);
                                          } else {
                                              qgbParked.countDown();
                                              try {
                                                  qgbRelease.await();
                                              } catch (InterruptedException ignored) {
                                              }
                                          }
                                      }
                                  });
                                  try {
                                      qgbParked.await();
                                  } catch (InterruptedException e) {
                                      throw new RuntimeException(e);
                                  }
                                  protect.card_locker.QgbFlags.fired("barcode-preview-off-main-thread");
                                  try {
                                      callable.onPostExecute(result);
                                  } finally {
                                      qgbRelease.countDown();
                                  }
                              }, "qgb-barcode").start();
                              return;
                          }

                          // Post results on UI Thread so we can show them
                          uiHandler.post(() -> {
                              callable.onPostExecute(result);
                          });

  # ANR — confirming a group's deletion parks the main thread on a latch whose countDown
  # is posted to the main Looper it just parked: a permanent, timing-free deadlock inside
  # the dialog's OK handler. Nothing is deleted; the next touch goes unanswered and
  # Android raises the ANR itself.
  - id: group-delete-blocks-main-thread
    title: Deleting a group freezes the app
    patch:
      file: app/src/main/java/protect/card_locker/ManageGroupsActivity.kt
      find: |-
        DBHelper.deleteGroup(mDatabase, groupName)
      replace: |-
        // BUG(group-delete-blocks-main-thread): the main thread waits on work posted to itself.
                        if (protect.card_locker.QgbFlags.on("group-delete-blocks-main-thread")) {
                            protect.card_locker.QgbFlags.fired("group-delete-blocks-main-thread")
                            val qgbLatch = java.util.concurrent.CountDownLatch(1)
                            android.os.Handler(android.os.Looper.getMainLooper()).post { qgbLatch.countDown() }
                            qgbLatch.await()
                        }
                        DBHelper.deleteGroup(mDatabase, groupName)

