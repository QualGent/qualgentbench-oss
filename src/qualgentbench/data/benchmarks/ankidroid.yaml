# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# AnkiDroid (github.com/ankidroid/Anki-Android) — seeded-bug benchmark app, HARD tier.
# The spaced-repetition flashcard app: decks, a note editor (fields, tags, deck
# picker), a card browser and a scheduler-driven reviewer. The scheduler itself is
# the Rust backend — every seeded defect lives in the Kotlin layer above it.
#
# CONDITIONAL + HIDDEN defects (batch-4 style): a saved note stores every field
# after the first empty, tags are dropped on save, a note lands in the Default deck
# whatever deck is selected, and answering Good is recorded as Again (the card
# keeps coming back — revlog proves it). Two areas are HIDDEN: the deck list's
# new-count and the browser's "N cards shown" subtitle each under-report by one,
# both contradicting other numbers on the very same screen.
#
# JOURNEY-ONLY defects (QUA-2725, epic QUA-2723), after the hunt `bugs:` above: two
# crashes (the card browser on an empty deck, the reviewer's Show answer) and a wrong
# navigation (a browser card opens a blank Add screen). No exploration feature names
# them, so hunt mode never switches them on and the hard tier does not move; they
# exist for data/test-cases/ankidroid.yaml.
#
# Storage: the collection is SQLite at
# /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2
# — the EXTERNAL app dir, which run-as cannot read but the adb shell user can, so
# `db:` uses the absolute-path form of the oracle (plain `cat`). decks.name carries
# the backend's `unicase` collation the host SQLite lacks: queries never compare or
# aggregate on it (count(id), card/note tables only).
#
# Seeded state (assets/ankidroid/): a "Spanish" deck holding 3 Basic notes
# (uno/one, dos/two, tres/three; never studied → deck row 3-0-0, title "3 cards
# due", revlog empty), Spanish is the editor's current deck; prefs.xml sets
# IntroductionSlidesShown + deckPath and pushes the backup nag far into the future.
# The play flavor is built: `full` hits an all-files-access wall on first launch.

app:
  id: ankidroid
  name: AnkiDroid
  package: com.ichi2.anki.debug                # play flavor debug build
  platform: android
  difficulty: hard

apk:
  repo: qualgent/qualgentbench-apps
  filename: hard/ankidroid-buggy.apk
  sha256: c9e68ce43ec86879e545cbb4d2ac829da4c420bf298698bc7b76e5c934285cc9
  size_bytes: 62986773

build:
  repo: https://github.com/ankidroid/Anki-Android
  dir: Anki-Android                            # under QualGent-Repos/
  ref: "v2.24.0"                               # release tag; compileSdk 36
  gradle_task: ":AnkiDroid:assemblePlayDebug"
  apk_glob: "AnkiDroid/build/outputs/apk/play/debug/*arm64-v8a*.apk"   # ABI splits

flags:
  file: AnkiDroid/src/main/java/com/ichi2/anki/QgbFlags.kt   # .kt → Kotlin shim
  package: com.ichi2.anki

# Seed the collection into the external app dir and the prefs (intro done, deck path,
# backup nag suppressed), after pm clear and before launch.
# The debug build ships LeakCanary, whose SECOND launcher activity turns
# resolve-activity into the system chooser and makes `monkey` pick a launcher at
# random; the harness launches from the package's launcher list with LeakCanary
# skipped (the `pm disable` that once hid it is gone, see `shell:` below).
#
# THE APP CREATES ITS OWN EXTERNAL TREE FIRST (QUA-2743, 2026-09-22). The fixture used
# to `mkdir -p` the collection directory itself. On a device where AnkiDroid had never
# run, that made the fixture the creator of Android/data/<pkg>/files/AnkiDroid, and the
# app's first launch failed with `StorageAccessException: No write access to AnkiDroid
# directory` (QUA-2731's first episode, emulator-5558). Measured on emulator-5554
# (android-35): root was NOT the cause — unrooted, from a never-installed state, the
# fixture's tree came out `shell:ext_data_rw` and failed identically; while files
# created INSIDE a tree the app had already made are usable by the app whoever writes
# them (root-created dir and file beneath the app's own `files/` staged fine). The
# app's own collection file is `-rw-r-----`, so the shell cannot overwrite it. So the
# fixture clears whatever tree is there (a broken fixture's leftovers included), launches
# the app ONCE with the staged prefs so it makes its own tree and an empty collection,
# force-stops it, wipes what that launch left in the sandbox (back to the post-`pm
# clear` state the corpus was derived from), replaces the app's empty collection with
# the staged one as a new file, and rewrites the prefs. No `root: true` (it existed only
# for that `pm disable`); `tests/test_device_setup_root.py` plays this on a fake device.
#
# ACRA OFF, in the file ACRA actually reads (QUA-2725, 2026-09-18). prefs.xml has always
# said `acra.disable=true` and `reportErrorMode=1` (never report), but AnkiDroid 2.24
# initialises ACRA with `withSharedPreferencesName("acra")`, so ACRA reads
# shared_prefs/acra.xml and never saw either key: every run logged "ACRA is enabled for
# com.ichi2.anki.debug". An ENABLED ACRA takes over every uncaught exception — it opens
# its own "AnkiDroid Feedback" report dialog in the `:acra` process and kills the app
# process itself (Process.killProcess), without handing the throwable to the platform's
# handler. Measured on the first journey crash cases: a throw inside a coroutine
# collector left NO crash-buffer record and NO fatal exit-info row, so the death was
# invisible to `verify.crash` (the seeded arm derived HOLDS with the Feedback dialog on
# screen), and a throw on the main thread was detected only through the pre-handler's
# log line, then landed on the same dialog. acra.xml below restores what prefs.xml
# already meant: ACRA forwards to the platform's default handler, which records and
# handles the crash like any other app's. Nothing else reads ACRA's state, and no hunt
# check crashes with the flags as written, so no hunt truth moves.
device_setup:
  push:
    - {src: assets/ankidroid/collection.anki2, dest: /sdcard/qgb-anki.anki2}
    - {src: assets/ankidroid/prefs.xml, dest: /sdcard/qgb-anki-prefs.xml}
    - {src: assets/ankidroid/acra.xml, dest: /sdcard/qgb-anki-acra.xml}
  shell:
    # (removed 2026-09-14) `pm disable <pkg>/leakcanary...LeakLauncherActivity` — the
    # shell user cannot change another package's component state on an unrooted
    # device (SecurityException, rc=255). The step had failed silently on every run
    # since it was added, so the corpus was derived without it; once setup steps
    # began failing loudly it blocked all AnkiDroid staging. The LeakCanary launcher
    # icon it meant to hide is harmless: the agent is told which app to test.
    # Prefs first, so the one launch below goes straight to the deck picker, which opens
    # (and so creates) the collection; the intro would not.
    - "run-as com.ichi2.anki.debug mkdir -p shared_prefs"
    - "cat /sdcard/qgb-anki-prefs.xml | run-as com.ichi2.anki.debug sh -c 'cat > shared_prefs/com.ichi2.anki.debug_preferences.xml'"
    - "cat /sdcard/qgb-anki-acra.xml | run-as com.ichi2.anki.debug sh -c 'cat > shared_prefs/acra.xml'"
    # Whatever tree is there, app-owned or not, goes: the app recreates it as its own.
    - "rm -rf /storage/emulated/0/Android/data/com.ichi2.anki.debug"
    - "am start -W -n com.ichi2.anki.debug/com.ichi2.anki.IntentHandler"
    # Up to 30 s for the app's own collection file, then a settle; fails the step if it
    # never appears, so a launch that did not create it cannot stage half a world.
    - "i=0; while [ ! -f /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2 ] && [ $i -lt 30 ]; do sleep 1; i=$((i+1)); done; sleep 2; [ -f /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2 ]"
    - "am force-stop com.ichi2.anki.debug"
    - "run-as com.ichi2.anki.debug sh -c 'rm -rf ./*'"
    # The app's own empty collection is -rw-r----- (the shell cannot write it), so it is
    # removed and the staged one copied in as a NEW file inside the app's tree.
    - "rm -f /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2 /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2-wal /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2-shm"
    - "cp /sdcard/qgb-anki.anki2 /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2"
    - "run-as com.ichi2.anki.debug mkdir -p shared_prefs"
    - "cat /sdcard/qgb-anki-prefs.xml | run-as com.ichi2.anki.debug sh -c 'cat > shared_prefs/com.ichi2.anki.debug_preferences.xml'"
    - "cat /sdcard/qgb-anki-acra.xml | run-as com.ichi2.anki.debug sh -c 'cat > shared_prefs/acra.xml'"

exploration:
  id: explore-ankidroid
  step_budget: 500
  title: "Release sign-off — Flashcards"
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py).
    # The + FAB opens a menu (Add / Create deck / …). The note editor has Front and
    # Back fields (content-desc anchors), a Tags row (dialog: "Add tag" icon → Name →
    # Add → Confirm) and a Save action; the current deck is already Spanish. Tapping
    # a deck starts review ("Show answer" → Again/Hard/Good/Easy). The card front
    # renders in a WebView whose text IS in the hierarchy dump.
    - id: deck_list
      state: ok
      probe: [deck, list]
      check:
        steps: [launch, wait]
        expect: {present: "Spanish"}
    - id: due_total
      state: ok
      probe: [due, total]
      check:
        steps: [launch, wait]
        expect: {present: "3 cards due"}
    - id: note_add
      state: ok
      probe: [note, add, front]
      check:
        steps: [launch, {tap: "Add"}, {tap: "Add"}, {tap: "Front"}, {type: "quatro"},
                {tap: "Back"}, {type: "four"}, {tap: "Save"}, wait]
        expect: {db: /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2,
                 equals: "1",
                 query: "select count(*) from notes where flds like 'quatro%';"}
    - id: deck_create
      state: ok
      probe: [deck, create]
      check:
        steps: [launch, {tap: "Add"}, {tap: "Create deck"}, {tap: "Name"}, {type: "French"},
                {tap: "Create"}, wait]
        expect: {db: /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2,
                 equals: "3",
                 query: "select count(id) from decks;"}
    - id: browser_list
      state: ok
      probe: [browser, cards]
      check:
        steps: [launch, {tap: "Open drawer"}, {tap: "Card browser"}, wait]
        expect: {present: "uno"}
    - id: study_open
      state: ok
      probe: [study, review]
      check:
        steps: [launch, {tap: "Spanish"}, wait]
        expect: {present: "Show answer"}
    - id: note_back
      state: broken
      bug_id: note-back-field-dropped
      probe: [back, field]
      check:
        steps: [launch, {tap: "Add"}, {tap: "Add"}, {tap: "Front"}, {type: "quatro"},
                {tap: "Back"}, {type: "four"}, {tap: "Save"}, wait]
        expect: {db: /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2,
                 equals: "1",
                 query: "select count(*) from notes where flds like 'quatro%four';"}
    - id: note_deck
      state: broken
      bug_id: note-added-to-default-deck
      probe: [deck, wrong, default]
      check:
        # The editor's current deck is Spanish; the saved card must be in it, not
        # in Default (did 1).
        steps: [launch, {tap: "Add"}, {tap: "Add"}, {tap: "Front"}, {type: "quatro"},
                {tap: "Back"}, {type: "four"}, {tap: "Save"}, wait]
        expect: {db: /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2,
                 equals: "1",
                 query: "select count(*) from cards c join notes n on n.id=c.nid where n.flds like 'quatro%' and c.did<>1;"}
    - id: note_tags
      state: broken
      bug_id: note-tags-dropped
      probe: [tag]
      check:
        steps: [launch, {tap: "Add"}, {tap: "Add"}, {tap: "Front"}, {type: "cinco"},
                {tap: "Tags"}, {tap: "Add tag"}, {tap: "Name"}, {type: "verbs"},
                {tap: "Add"}, {tap: "Confirm"}, {tap: "Save"}, wait]
        expect: {db: /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2,
                 equals: "1",
                 query: "select count(*) from notes where tags like '%verbs%';"}
    - id: study_rating
      state: broken
      bug_id: good-rated-as-again
      probe: [good, again, rating]
      check:
        # Good on a new card writes a revlog row with ease 3; the seeded build
        # records ease 1 (Again) and the card keeps coming back.
        steps: [launch, {tap: "Spanish"}, {tap: "Show answer"}, {tap: "Good"}, wait]
        expect: {db: /storage/emulated/0/Android/data/com.ichi2.anki.debug/files/AnkiDroid/collection.anki2,
                 equals: "3",
                 query: "select ease from revlog order by id desc limit 1;"}
    # HIDDEN — not named in the brief. Reported under `other` by an agent that notices.
    - id: deck_new_count
      state: broken
      hidden: true
      bug_id: deck-new-count-low
      probe: [new, due]   # the report compares the row's new-count with the "cards due" total
      check:
        # Clean deck picker shows 3-0-0 and no "2" anywhere; the seeded build
        # renders the new-count one short while the title still says 3 cards due.
        steps: [launch, wait]
        expect: {absent: "2"}
    - id: browser_count
      state: broken
      hidden: true
      bug_id: browser-count-low
      probe: [shown]
      check:
        steps: [launch, {tap: "Open drawer"}, {tap: "Card browser"}, wait]
        expect: {present: "3 cards shown"}
  instruction: |
    You are a QA engineer. This build of a flashcard app has been handed to you for
    release sign-off. A "Spanish" deck with three cards is set up and nothing has
    been studied yet. The list below is what the product team says each area should
    do. Verify them on the device and report what you actually observe. Also report
    anything else on screen that looks incorrect (use an area name starting with
    "other" and describe exactly what you saw and on which screen).

    The + button adds notes (Front/Back fields, a Tags row, the deck selector) and
    creates decks. Tapping a deck starts a review: "Show answer", then
    Again/Hard/Good/Easy. The navigation drawer reaches the Card browser and
    Statistics.

    SPECIFICATION
      - deck_list: the deck list shows the decks that exist.
      - due_total: the subtitle under the app title shows how many cards are due in total.
      - note_add: a note you add is saved with the text you entered.
      - deck_create: a deck you create exists afterwards.
      - browser_list: the card browser lists the cards of the current deck.
      - study_open: tapping a deck with due cards opens the reviewer on a card.
      - note_back: every field of a saved note keeps what you typed (check the saved card's answer side too).
      - note_deck: a saved note's cards belong to the deck selected in the editor.
      - note_tags: tags you add in the editor are saved with the note.
      - study_rating: the rating you answer with is the rating that is recorded — a card answered Good is scheduled ahead, not repeated like Again.

bugs:
  # L2 — every field after the first is blanked when an added note is saved; the
  # front survives (note_add is the control twin).
  - id: note-back-field-dropped
    title: A saved note loses every field after the first
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/NoteEditorFragment.kt
      find: |-
        // load all of the fields into the note
        for (f in editFields!!) {
        updateField(f)
        }
      replace: |-
        // load all of the fields into the note
        for (f in editFields!!) {
        updateField(f)
        }
        // BUG(note-back-field-dropped): every field after the first is stored empty.
        if (com.ichi2.anki.QgbFlags.on("note-back-field-dropped")) { for (qgbI in 1 until editorNote!!.fields.size) editorNote!!.setField(qgbI, "") }

  # L2 — tags are dropped on save, on the add path and the edit path alike.
  - id: note-tags-dropped
    title: Tags are not saved with a note
    patches:
      # (1) adding a note
      - file: AnkiDroid/src/main/java/com/ichi2/anki/NoteEditorFragment.kt
        find: |-
          // Save tags to model
          editorNote!!.setTagsFromStr(getColUnsafe, tagsAsString(selectedTags!!))
        replace: |-
          // Save tags to model
          // BUG(note-tags-dropped): the selected tags never reach the note.
          if (!com.ichi2.anki.QgbFlags.on("note-tags-dropped")) editorNote!!.setTagsFromStr(getColUnsafe, tagsAsString(selectedTags!!))
      # (2) editing an existing note
      - file: AnkiDroid/src/main/java/com/ichi2/anki/NoteEditorFragment.kt
        find: |-
          editorNote!!.setTagsFromStr(getColUnsafe, tagsAsString(selectedTags!!))
          changed = true
        replace: |-
          // BUG(note-tags-dropped): same on the edit path.
          if (!com.ichi2.anki.QgbFlags.on("note-tags-dropped")) editorNote!!.setTagsFromStr(getColUnsafe, tagsAsString(selectedTags!!))
          changed = true

  # L3 — the note is added to the Default deck whatever deck the editor shows.
  - id: note-added-to-default-deck
    title: A new note lands in the Default deck
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/NoteEditorFragment.kt
      find: |-
        addNote(editorNote!!, deckId)
      replace: |-
        // BUG(note-added-to-default-deck): the selected deck is ignored.
        addNote(editorNote!!, if (com.ichi2.anki.QgbFlags.on("note-added-to-default-deck")) 1L else deckId)

  # L3 — a Good answer reaches the scheduler as Again: the card repeats and the
  # revlog rows carry ease 1.
  - id: good-rated-as-again
    title: Answering Good is recorded as Again
    patches:
      # (1) the base viewer (previewer/legacy paths)
      - file: AnkiDroid/src/main/java/com/ichi2/anki/AbstractFlashcardViewer.kt
        find: |-
          open suspend fun answerCardInner(rating: Rating) {
          // Legacy tests assume they can call answerCard() even outside of Reviewer
          withCol {
          sched.answerCard(currentCard!!, rating)
          }
          }
        replace: |-
          open suspend fun answerCardInner(rating: Rating) {
          // BUG(good-rated-as-again): a Good answer is passed to the scheduler as Again.
          val qgbRating = if (com.ichi2.anki.QgbFlags.on("good-rated-as-again") && rating == Rating.GOOD) Rating.AGAIN else rating
          // Legacy tests assume they can call answerCard() even outside of Reviewer
          withCol {
          sched.answerCard(currentCard!!, qgbRating)
          }
          }
      # (2) the Reviewer override — the path a real study session takes
      - file: AnkiDroid/src/main/java/com/ichi2/anki/Reviewer.kt
        find: |-
          override suspend fun answerCardInner(rating: Rating) {
          val state = queueState!!
          val cardId = currentCard!!.id
          Timber.d("answerCardInner: $cardId $rating")
          var wasLeech = false
          undoableOp(this) {
          sched.answerCard(state, rating).also {
        replace: |-
          override suspend fun answerCardInner(rating: Rating) {
          // BUG(good-rated-as-again): a Good answer reaches the scheduler as Again.
          val qgbRating = if (com.ichi2.anki.QgbFlags.on("good-rated-as-again") && rating == Rating.GOOD) Rating.AGAIN else rating
          val state = queueState!!
          val cardId = currentCard!!.id
          Timber.d("answerCardInner: $cardId $rating")
          var wasLeech = false
          undoableOp(this) {
          sched.answerCard(state, qgbRating).also {

  # HIDDEN UI — the deck row's new-count renders one short (title and reviewer
  # still show the true numbers).
  - id: deck-new-count-low
    title: The deck list's new-count is one short
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/widgets/DeckAdapter.kt
      find: |-
        binding.deckNew.text = node.newCount.toString()
      replace: |-
        // BUG(deck-new-count-low): the displayed new-count is one short.
        binding.deckNew.text = (node.newCount - (if (com.ichi2.anki.QgbFlags.on("deck-new-count-low") && node.newCount > 0) 1 else 0)).toString()

  # HIDDEN UI — the browser subtitle counts one fewer than the rows it lists.
  - id: browser-count-low
    title: The browser's "cards shown" subtitle is one short
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/CardBrowser.kt
      find: |-
        val count = viewModel.rowCount
      replace: |-
        // BUG(browser-count-low): the subtitle under-counts by one.
        val count = viewModel.rowCount - (if (com.ichi2.anki.QgbFlags.on("browser-count-low") && viewModel.rowCount > 0) 1 else 0)

  # ── journey-only CRASH and NAVIGATION defects (QUA-2725, epic QUA-2723) — no
  # exploration feature, so hunt mode never activates them (write_bug_flags' explore
  # branch activates the bug_ids of `state: broken` FEATURES only), and the hard tier
  # does not move. They exist for data/test-cases/ankidroid.yaml, where they replace the
  # three persistence defects that file no longer seeds (docs/defect-classes.md,
  # section 8: the patches of those three stay above, because each is also a hard-tier
  # hunt defect with a derived `broken` row in truth/hard-stability.json).
  #
  # Templates: medtimer's medicine-list-empty-reminders-crash (crash) and
  # fossify-calendar's view-switch-stuck-on-year (navigation). Each fault throws, or
  # picks its destination, UNCONDITIONALLY on the path a tester takes — no race, no
  # timing, no device margin — and each calls `QgbFlags.fired(...)` inside its own flag
  # branch on the line BEFORE the fault, only on the path that actually faults, so a
  # marker on disk means this seeded site is what fired.
  #
  # WHERE A THROW KILLS THIS APP, AND WHERE IT DOES NOT. Most of AnkiDroid's UI work runs
  # inside `launchCatchingTask` / `runCatching` (CoroutineHelpers.kt), which CATCH any
  # Exception and put up an error dialog: a fault seeded there leaves the app alive and
  # would never read as CRASHED. Both crashes below therefore sit on paths that catch
  # nothing — a Flow collector started by `launchCollectionInLifecycleScope` (a plain
  # lifecycleScope.launch, no CoroutineExceptionHandler anywhere in the app) and a View
  # click listener. The throwable filter AnkiDroidApp chains in (ThrowableFilterService)
  # discards only network/sync/storage exceptions. ACRA is the last handler in the chain,
  # and it hands the throwable to the platform's default handler ONLY because
  # device_setup switches it off in shared_prefs/acra.xml (see the note there): with
  # ACRA on, the first derive of anki-browse-new-deck measured HOLDS 3/3 on a process
  # ACRA had killed itself. With it off, both exceptions die the platform's way — crash
  # buffer, fatal exit-info — and derive CRASHED 3/3. The two crashes differ in screen,
  # operator and exception, and neither is the medtimer list crash's
  # NoSuchElementException.
  #
  # THE LEGACY-FALLBACK CAVEAT, as for the search crash in fossify-calendar.yaml: with
  # files/qgb_flags.txt MISSING the shim turns every defect on, and
  # `reviewer-show-answer-crash` sits on the route of the hunt feature `study_rating`
  # (Spanish -> Show answer -> Good). If a hunt derivation ever sees `study_rating`
  # crash, that is a failed flag write, not this defect leaking into hunt mode. No hunt
  # route selects an empty deck in the browser or taps a browser row.

  # CRASH 1 — the card browser dies on an empty deck. The browser is reached from the
  # drawer, and its toolbar (deck name + "N cards shown") opens the deck chooser; any
  # deck with no cards — a deck the user has just created, a filtered view that matches
  # nothing — gives a search result of zero rows. No artificial state: creating a deck
  # and looking at it is the first thing a new user does.
  #
  # THE FAULT. The browser fragment's search-state collector now scrolls the list back
  # to the first result whenever a search completes ("keep the first result in view"),
  # and reads that row with `getRowAtPosition(0)` — `cards[0]` on the row list — with no
  # emptiness guard. On a result of zero rows that is
  # java.lang.IndexOutOfBoundsException ("Index 0 out of bounds for length 0"), thrown
  # inside a `launchCollectionInLifecycleScope` collector, which catches nothing, so the
  # process dies. Every non-empty result renders exactly as before (the scroll lands on
  # the row that is already first), so the browser the route opens on (Spanish, 3
  # cards) is untouched and the death is attributable to the one tap that empties it.
  - id: browser-empty-deck-crash
    title: The card browser dies on a deck with no cards
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/browser/CardBrowserFragment.kt
      # Three lines, unique: the activity (CardBrowser.kt) has its own
      # `searchStateChanged`, which an anchor naming THIS file never sees, and its body
      # is different anyway.
      find: |-
        fun searchStateChanged(searchState: SearchState) {
        cardsAdapter.notifyDataSetChanged()
        progressIndicator.isVisible = searchState == Initializing || searchState == Searching
      # `fired()` on the line BEFORE the read that throws, and only when the result is
      # empty — the one path that faults. A synchronous File.createNewFile on the UI
      # thread; this build installs no StrictMode penalty for it.
      replace: |-
        fun searchStateChanged(searchState: SearchState) {
            cardsAdapter.notifyDataSetChanged()
            progressIndicator.isVisible = searchState == Initializing || searchState == Searching
            // BUG(browser-empty-deck-crash): a finished search scrolls back to its first row,
            // read with getRowAtPosition(0) and no emptiness guard, so a search with no
            // results (an empty deck) throws IndexOutOfBoundsException in this collector.
            if (searchState == SearchState.Completed && com.ichi2.anki.QgbFlags.on("browser-empty-deck-crash")) {
                if (activityViewModel.rowCount == 0) com.ichi2.anki.QgbFlags.fired("browser-empty-deck-crash")
                autoScrollTo(RowSelection(activityViewModel.getRowAtPosition(0), topOffset = 0))
            }

  # CRASH 2 — showing a card's answer kills the app. Studying is the app's core loop:
  # deck list -> tap a deck -> the reviewer's question -> "Show answer" -> rate it.
  #
  # THE FAULT. displayCardAnswer() carries the comment "Clean up the user answer and the
  # correct answer", and upstream only cleans the user's half. The patch "finishes" it:
  # the typed answer is trimmed and capped at the length of the expected answer. But
  # `typeAnswer.correct` is only set for a card whose template has a {{type:...}} field;
  # on every other card — every Basic card, i.e. all three in the fixture — it is null,
  # and `correct!!` throws java.lang.NullPointerException. displayCardAnswer() runs
  # straight from the Show answer button's View.OnClickListener (flipCardListener), on
  # the main thread, outside any catching wrapper, so the process dies before the answer
  # is drawn and nothing is answered.
  - id: reviewer-show-answer-crash
    title: Showing a card's answer kills the app
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/AbstractFlashcardViewer.kt
      # Four lines, unique: the comment occurs once in the file.
      find: |-
        // Clean up the user answer and the correct answer
        if (!typeAnswer!!.useInputTag) {
        typeAnswer!!.input = answerField!!.text.toString()
        }
      replace: |-
        // Clean up the user answer and the correct answer
        if (!typeAnswer!!.useInputTag) {
            typeAnswer!!.input = answerField!!.text.toString()
        }
        // BUG(reviewer-show-answer-crash): the typed answer is capped at the expected
        // answer's length, as if every card expected one; `correct` is null on a card with
        // no {{type:}} field (every Basic card), so `!!` throws NullPointerException.
        if (com.ichi2.anki.QgbFlags.on("reviewer-show-answer-crash")) {
            val qgbExpected = typeAnswer!!.correct
            if (qgbExpected == null) com.ichi2.anki.QgbFlags.fired("reviewer-show-answer-crash")
            typeAnswer!!.input = typeAnswer!!.input.trim().take(qgbExpected!!.trim().length)
        }

  # NAVIGATION — a card tapped in the browser opens a blank Add screen. "Wrong control
  # flow or navigation" is an 11% plan target.
  #
  # THE FAULT. CardBrowser's `onSelectedCardUpdated` is the single chokepoint for "open
  # the note editor on the card the user picked" (a row tap, the E shortcut and the
  # Edit note action all emit `cardSelectionEventFlow` into it). The class keeps its two
  # editor launchers side by side — `addNoteLauncher` and `editNoteLauncher()` — and
  # the patch wires the chokepoint to the ADD one, with the add result handler that goes
  # with it: the slip two neighbouring properties invite. Same statements, same order,
  # one destination. A tester who taps "tres" to read or fix that card lands on a blank
  # "Add" note editor for the browser's deck, with none of the card's fields, and the
  # control that should take them to the card is the one that is broken. Nothing
  # crashes and nothing is written, which is what makes it `navigation` rather than
  # `crash` or `persistence`.
  #
  # WHY IT IS CHECKABLE FROM THE HIERARCHY. The two destinations disagree about text:
  # the card's own editor shows its fields' contents (Front "tres", Back "three"), the
  # Add screen shows empty fields. The case reads `present: three` on the destination —
  # the fixture's own value, stable against the calendar date.
  #
  # Unconditional on purpose, like medtimer's stock button: no check_setup in this spec
  # taps a browser row, and no other case's route does either.
  - id: browser-card-opens-add-note
    title: A card tapped in the card browser opens a blank Add screen instead
    patch:
      file: AnkiDroid/src/main/java/com/ichi2/anki/CardBrowser.kt
      # Three lines, unique: `onEditCardActivityResult.launch(it.toIntent(this@CardBrowser))`
      # occurs once; `editNoteLauncher()` also opens loadNoteEditorFragmentIfFragmented,
      # spelled `?: return` there. The closing brace is inside the anchor because the
      # replace wraps the whole block.
      find: |-
        editNoteLauncher()?.let {
        onEditCardActivityResult.launch(it.toIntent(this@CardBrowser))
        }
      # `fired()` on the line BEFORE the substituted destination is launched.
      replace: |-
        // BUG(browser-card-opens-add-note): the card the user picked is sent to the ADD
        // note destination (the browser's other editor launcher) instead of its own editor.
        if (com.ichi2.anki.QgbFlags.on("browser-card-opens-add-note")) {
            com.ichi2.anki.QgbFlags.fired("browser-card-opens-add-note")
            onAddNoteActivityResult.launch(addNoteLauncher.toIntent(this@CardBrowser))
        } else {
            editNoteLauncher()?.let {
                onEditCardActivityResult.launch(it.toIntent(this@CardBrowser))
            }
        }

