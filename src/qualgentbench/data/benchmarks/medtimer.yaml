# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# MedTimer (github.com/Futsch1/medTimer) — seeded-bug benchmark app, HARD tier.
# A medication manager: medicines with reminders, dose events (taken/skipped),
# stock tracking with refill, calendar overview, analysis charts and a tabular
# event view. Multi-module Kotlin app; the flag shim lives in :core:common (the one
# module every other module depends on).
#
# CONDITIONAL + HIDDEN defects (batch-4 style): taking a dose decrements the stock
# by only 1 whatever the amount (invisible when the amount IS 1), switching an event
# to Skipped is written back as Taken, an edited reminder dosage silently reverts,
# and renaming a medicine is discarded on save (other edits persist). Two areas are
# HIDDEN: the medicine list's "(N left)" under-reports the stock by one, and the
# list's reminder time renders one hour late — both contradict the detail screens.
#
# Storage: Room databases/medTimer (Medicine.amount = stock as REAL,
# Reminder.amount = dosage as TEXT, ReminderEvent.status RAISED/TAKEN/SKIPPED) —
# the `db:` oracle reads it through run-as. The debug build skips the intro
# entirely (BuildConfig.DEBUG gate), so there is no first-launch wall.
#
# Seeded state:
#   assets/medtimer/medTimer.db (captured from a real v1.25.2 run) — Aspirin: stock
#   10, one ACTIVE time-based reminder 8:00 AM dosage 2 (list row "Aspirin (10
#   left, <date>) / 1 reminder / 8:00 AM"; the run-out date drifts with the run day
#   and is never an anchor). Ibuprofen: stock 10 plus one INACTIVE reminder
#   (reminderId 2, dosage 2) that exists only so a seeded raised event resolves to
#   a real reminder — inactive reminders never fire and are hidden from the list.
#   device_setup then INSERTS two events with now() timestamps so they sit on
#   today's Overview: "Ibuprofen (2.5)" TAKEN (a logged dose) and "Ibuprofen (4)"
#   RAISED (a reminder waiting to be answered; its status icon desc is "Reminded" —
#   tapping it opens the Taken / Skipped / Reschedule menu, the ONLY deterministic
#   route into stock handling).
#
# Why events are seeded: the Overview's "Log additional dose" FAB exposes NO
# accessibility node (absent from both uiautomator and u2 dumps — a real a11y bug
# in the app, do NOT anchor on it). Agents see it visually; the harness cannot.
# Timing note: Aspirin's active 8:00 AM reminder may auto-raise its own event when
# a run happens after 08:00 — no check anchors on Aspirin's Overview cards or on
# unfiltered event counts.

app:
  id: medtimer
  name: MedTimer
  package: com.futsch1.medtimer                # foss debug build keeps the plain id
  platform: android
  difficulty: hard

apk:
  repo: qualgent/qualgentbench-apps
  filename: hard/medtimer-buggy.apk
  sha256: b4db23486401c49206cacd634ef5134a67233fb145a8e9a3f6cf9df20bf17a4a
  size_bytes: 71667222

build:
  repo: https://github.com/Futsch1/medTimer
  dir: MedTimer                                # under QualGent-Repos/
  ref: "v1.25.2"                               # release tag; compileSdk 37 (platform android-37.0)
  gradle_task: ":app:assembleFossDebug"
  apk_glob: "app/build/outputs/apk/foss/debug/*.apk"
  # Toolchain floor at this ref, checked before the first Gradle call
  # (build_app.py --check-toolchain). Detected from the checkout when omitted; stated
  # here so a clean machine learns what it needs WITHOUT cloning 300 MB first.
  compile_sdk: 37                              # app/build.gradle.kts compileSdk
  jdk: 21                                      # app/build.gradle.kts JavaVersion.VERSION_21

flags:
  file: core/common/src/main/java/com/futsch1/medtimer/core/common/QgbFlags.kt   # .kt → Kotlin shim
  package: com.futsch1.medtimer.core.common

# Seed the Room DB (two medicines, two reminders) after pm clear and before launch;
# insert the two events stamped now() so they land on today's Overview — through the
# host-side `sql:` step, never an on-device sqlite3 (Google Play images ship none, and
# the old `run-as … sqlite3` line failed silently there); re-grant the notification
# permission pm clear revoked so no system dialog blocks.
device_setup:
  push:
    - {src: assets/medtimer/medTimer.db, dest: /sdcard/qgb-medtimer.db}
  shell:
    - "pm grant com.futsch1.medtimer android.permission.POST_NOTIFICATIONS"
    - "run-as com.futsch1.medtimer mkdir -p databases"
    - "cat /sdcard/qgb-medtimer.db | run-as com.futsch1.medtimer sh -c 'cat > databases/medTimer'"
    - "run-as com.futsch1.medtimer sh -c 'rm -f databases/medTimer-wal databases/medTimer-shm'"
  sql:
    - package: com.futsch1.medtimer
      db: medTimer
      statements: "insert into ReminderEvent (medicineName,amount,status,remindedTimestamp,processedTimestamp,reminderId,stockHandled) values ('Ibuprofen','2.5','TAKEN',strftime('%s','now'),strftime('%s','now'),-1,1),('Ibuprofen','4','RAISED',strftime('%s','now'),strftime('%s','now'),2,0);"

exploration:
  id: explore-medtimer
  step_budget: 500
  title: "Release sign-off — Medication manager"
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py).
    # Bottom tabs: Overview / Medicine / Analysis. A medicine's list-row TEXT is
    # "Name (N left, date)" — never an exact anchor; the row is entered through its
    # exact subtitle ("1 reminder" / "0 reminders"). An Overview event card's status
    # icon (desc "Reminded" while raised) opens Taken / Skipped / Reschedule;
    # tapping the card body opens its edit sheet (Taken / Skipped buttons, name,
    # amount, times, notes), which saves when closed with back. A medicine's screen
    # (tap its list row) shows its name field, icon row (Medicine settings / Notes /
    # Tags / Medicine stock / Calendar) and its reminders as inline time and dosage
    # fields; back saves.
    - id: medicine_list
      state: ok
      probe: [medicine, list]
      check:
        steps: [launch, {tap: "Medicine"}, wait]
        expect: {present: "Aspirin"}
    - id: add_medicine
      state: ok
      probe: [medicine, add]
      check:
        steps: [launch, {tap: "Medicine"}, {tap: "Add medicine"}, {tap: "Medicine name"},
                {type: "Lisinopril"}, {tap: "OK"}, wait]
        expect: {db: medTimer, equals: "1",
                 query: "select count(*) from Medicine where medicineName='Lisinopril';"}
    - id: event_shown
      state: ok
      probe: [event, overview]
      check:
        steps: [launch, wait]
        expect: {present: "Ibuprofen (2.5)"}
    - id: event_take
      state: ok
      probe: [take, taken]
      check:
        # WHICH reminder (QUA-2736, the hunt twin of QUA-2735). A status icon is
        # labelled with the event's STATE, not its medicine: every raised reminder's
        # icon reads "Reminded". Once the device clock passes 08:00 Aspirin's reminder
        # is raised too and sorts above the Ibuprofen rows device_setup stamps at
        # staging time, so a bare `{tap: "Reminded"}` answers Aspirin (amount 2) and
        # this area stops measuring the 4-unit dose. `row:` keeps only the "Reminded"
        # sharing a horizontal band with "Ibuprofen (4)" (replay._candidates) — route
        # resolution, harness-only; the brief is unchanged. Before 08:00 it is the only
        # "Reminded" anyway; after it, it is the right one.
        # Derived 2026-09-22 at 12:41-13:17 DEVICE time (i.e. after 08:00, the condition
        # that makes the anchor ambiguous) on emulator-5554 / qgbench_root2, android-35,
        # against this spec's hunt APK sha256 b4db2348…17a4a, checked before and after:
        # `derive_truth.py medtimer --device emulator-5554 --repeat 3` — 12/12 areas
        # agree, 12/12 stable, byte-identical to the committed hard-stability rows. The
        # same device with the bare anchor derived `upstream` for BOTH areas (event_take
        # read '0' events taken, dose_stock read Ibuprofen 10.0 on both builds), which is
        # the failure QUA-2735 predicted.
        steps: [launch, {tap: "Reminded", row: "Ibuprofen (4)"}, {tap: "Taken"}, wait]
        expect: {db: medTimer, equals: "1",
                 query: "select count(*) from ReminderEvent where amount='4' and status='TAKEN';"}
    - id: analysis_table
      state: ok
      probe: [analysis, history]
      check:
        steps: [launch, {tap: "Analysis"}, {tap: "Tabular view"}, wait]
        expect: {present: "Ibuprofen"}
    - id: reminder_shown
      state: ok
      probe: [reminder, medicine]
      check:
        steps: [launch, {tap: "Medicine"}, {tap: "1 reminder"}, wait]
        expect: {present: "8:00 AM"}
    - id: dose_stock
      state: broken
      bug_id: stock-decrement-ignores-amount
      probe: [stock, decrement]
      check:
        # Answer the raised 4-unit reminder with Taken — the stock must drop by the
        # dose (10 → 6). The seeded build always decrements 1; a dose of 1 hides it.
        # Scoped to Ibuprofen's row for the same reason as event_take above: unscoped,
        # a derive staged after 08:00 answers Aspirin's reminder and Ibuprofen's stock
        # never moves on either build.
        steps: [launch, {tap: "Reminded", row: "Ibuprofen (4)"}, {tap: "Taken"}, wait]
        expect: {db: medTimer, equals: "6.0",
                 query: "select amount from Medicine where medicineName='Ibuprofen';"}
    - id: event_skip
      state: broken
      bug_id: event-skip-not-saved
      probe: [skip, skipped]
      check:
        steps: [launch, {tap: "Ibuprofen (2.5)"}, {tap: "Skipped"}, {press: back}, wait]
        expect: {db: medTimer, equals: "1",
                 query: "select count(*) from ReminderEvent where medicineName='Ibuprofen' and status='SKIPPED';"}
    - id: reminder_dosage
      state: broken
      bug_id: reminder-amount-edit-lost
      probe: [dosage, reminder, edit]
      check:
        # Aspirin's reminder row shows time 8:00 AM and dosage 2 as inline fields.
        steps: [launch, {tap: "Medicine"}, {tap: "1 reminder"}, {tap: "2"}, {type: "3"},
                {press: back}, {press: back}, wait]
        expect: {db: medTimer, equals: "1",
                 query: "select count(*) from Reminder where amount='3';"}
    - id: medicine_rename
      state: broken
      bug_id: medicine-rename-lost
      probe: [rename, name]
      check:
        steps: [launch, {tap: "Medicine"}, {tap: "0 reminders"}, {tap: "Ibuprofen"},
                {type: "Naproxen"}, {press: back}, {press: back}, wait]
        expect: {db: medTimer, equals: "1",
                 query: "select count(*) from Medicine where medicineName='Naproxen';"}
    # HIDDEN — not named in the brief. Reported under `other` by an agent that notices.
    - id: stock_left_display
      state: broken
      hidden: true
      bug_id: stock-left-display-low
      probe: [left]
      check:
        steps: [launch, {tap: "Medicine"}, wait]
        expect: {present: "10 left"}
    - id: reminder_time_display
      state: broken
      hidden: true
      bug_id: reminder-time-display-shifted
      probe: [9:00]   # the wrongly displayed time the report will quote
      check:
        steps: [launch, {tap: "Medicine"}, wait]
        expect: {present: "8:00 AM"}
  instruction: |
    You are a QA engineer. This build of a medication manager has been handed to you
    for release sign-off. Two medicines are set up: Aspirin (stock tracked, one
    daily reminder) and Ibuprofen (stock tracked). Today's Overview already has one
    logged Ibuprofen dose and one raised Ibuprofen reminder waiting to be answered.
    The list below is what the product team says each area should do. Verify them
    on the device and report what you actually observe. Also report anything else
    on screen that looks incorrect (use an area name starting with "other" and
    describe exactly what you saw and on which screen).

    The bottom tabs are Overview, Medicine and Analysis. An event card's status
    icon opens quick actions (Taken / Skipped / Reschedule); tapping the card body
    opens its editor (status, amount, times), which saves when closed. A medicine's
    screen (from the Medicine tab) has its name, a stock screen, and its reminders
    with inline time and dosage fields; leaving the screen saves.

    SPECIFICATION
      - medicine_list: the Medicine tab lists the medicines that exist with their details.
      - add_medicine: a medicine you add is listed afterwards.
      - event_shown: today's Overview shows the recorded and pending events.
      - event_take: answering a raised reminder with Taken records it as taken.
      - analysis_table: the Analysis tabular view lists the recorded events.
      - reminder_shown: a medicine's screen shows its configured reminders.
      - dose_stock: a dose recorded as taken reduces the medicine's stock by the dose amount.
      - event_skip: an event you switch to Skipped is recorded as skipped.
      - reminder_dosage: an edited reminder dosage is kept.
      - medicine_rename: a renamed medicine keeps its new name.

bugs:
  # L3 — the stock decrement caps the amount at 1: a dose of 1 behaves perfectly,
  # a dose of 2+ under-decrements. The refund path (un-taking) is untouched.
  - id: stock-decrement-ignores-amount
    title: Taking a dose decrements the stock by only one
    patch:
      file: feature/reminders/src/main/java/com/futsch1/medtimer/feature/reminders/StockHandlingProcessor.kt
      find: |-
        val medicine = medicineRepository.decreaseStock(medicineId, amount) ?: return null
      replace: |-
        // BUG(stock-decrement-ignores-amount): whatever the dose, at most 1 is deducted.
        val medicine = medicineRepository.decreaseStock(medicineId, if (com.futsch1.medtimer.core.common.QgbFlags.on("stock-decrement-ignores-amount") && amount > 1.0) 1.0 else amount) ?: return null

  # L2 — every event write funnels through this update; a SKIPPED status is
  # silently stored as TAKEN (the amount/notes edits persist — the control).
  - id: event-skip-not-saved
    title: Skipping a dose is stored as taken
    patch:
      file: core/database/src/main/java/com/futsch1/medtimer/database/ReminderEventRepositoryImpl.kt
      find: |-
        override suspend fun update(reminderEvent: ReminderEvent) {
        reminderEventDao.update(reminderEvent.toEntity())
        }
      replace: |-
        override suspend fun update(reminderEvent: ReminderEvent) {
        // BUG(event-skip-not-saved): SKIPPED is written back as TAKEN.
        val qgbEvent = if (com.futsch1.medtimer.core.common.QgbFlags.on("event-skip-not-saved") && reminderEvent.status == ReminderEvent.ReminderStatus.SKIPPED) reminderEvent.copy(status = ReminderEvent.ReminderStatus.TAKEN) else reminderEvent
        reminderEventDao.update(qgbEvent.toEntity())
        }

  # L2 — a reminder update writes every field except the dosage, which is pinned to
  # its stored value.
  - id: reminder-amount-edit-lost
    title: An edited reminder dosage reverts
    patches:
      # (1) single update
      - file: core/database/src/main/java/com/futsch1/medtimer/database/ReminderRepositoryImpl.kt
        find: |-
          override suspend fun update(reminder: Reminder) {
          reminderDao.update(reminder.toEntity())
          }
        replace: |-
          override suspend fun update(reminder: Reminder) {
          val qgbEntity = reminder.toEntity()
          // BUG(reminder-amount-edit-lost): the dosage is pinned to its stored value.
          if (com.futsch1.medtimer.core.common.QgbFlags.on("reminder-amount-edit-lost")) { reminderDao.fetch(reminder.id)?.let { qgbEntity.amount = it.amount } }
          reminderDao.update(qgbEntity)
          }
      # (2) the bulk update the medicine screen actually saves through
      - file: core/database/src/main/java/com/futsch1/medtimer/database/ReminderRepositoryImpl.kt
        find: |-
          override suspend fun updateMany(reminders: List<Reminder>) {
          reminderDao.updateAll(reminders.map { it.toEntity() })
          }
        replace: |-
          override suspend fun updateMany(reminders: List<Reminder>) {
          // BUG(reminder-amount-edit-lost): same pin on the bulk path.
          val qgbEntities = reminders.map { r ->
          val e = r.toEntity()
          if (com.futsch1.medtimer.core.common.QgbFlags.on("reminder-amount-edit-lost")) { reminderDao.fetch(r.id)?.let { old -> e.amount = old.amount } }
          e
          }
          reminderDao.updateAll(qgbEntities)
          }

  # L3 — a medicine update writes every field except the name, which is pinned to
  # its stored value (stock/notes edits persist).
  - id: medicine-rename-lost
    title: Renaming a medicine is discarded on save
    patch:
      file: core/database/src/main/java/com/futsch1/medtimer/database/MedicineRepositoryImpl.kt
      find: |-
        override suspend fun update(medicine: Medicine) {
        medicineDao.update(medicine.toEntity())
        }
      replace: |-
        override suspend fun update(medicine: Medicine) {
        val qgbEntity = medicine.toEntity()
        // BUG(medicine-rename-lost): the name is pinned to its stored value.
        if (com.futsch1.medtimer.core.common.QgbFlags.on("medicine-rename-lost")) { medicineDao.fetch(medicine.id)?.let { qgbEntity.name = it.name } }
        medicineDao.update(qgbEntity)
        }

  # HIDDEN UI — the list's "(N left)" shows one fewer than the stock; the medicine's
  # own stock screen shows the true amount.
  - id: stock-left-display-low
    title: The medicine list under-reports the stock by one
    patch:
      file: core/ui/src/main/java/com/futsch1/medtimer/core/ui/MedicineStringFormatter.kt
      find: |-
        MedicineHelper.formatAmount(medicine.amount, medicine.unit)
      replace: |-
        // BUG(stock-left-display-low): the list shows one fewer than the stock.
        MedicineHelper.formatAmount(medicine.amount - (if (com.futsch1.medtimer.core.common.QgbFlags.on("stock-left-display-low") && medicine.amount > 0) 1.0 else 0.0), medicine.unit)

  # HIDDEN UI — the list renders reminder times one hour late; the reminder's own
  # editor shows the true time.
  - id: reminder-time-display-shifted
    title: The medicine list shows reminder times one hour late
    # QUA-2708 reported that this patch does not fire on a REBUILD of v1.25.2, and
    # blocked medtimer's `apk:` blocks on it. QUA-2710 root-caused that report and it
    # does NOT hold: the rebuild and the published APK are the SAME CODE. Comparing
    # the two artifacts dex by dex (published b4db2348…, clean rebuild cf6479e7…),
    # 26 of 27 dex files are byte-identical, `classes11.dex` — which holds the patched
    # MedicineStringFormatter — among them, and this patch's compiled path
    # (QgbFlags.on → `add-int/lit8 +60` → ReminderTime.copy$default → toTimeString)
    # sits at the SAME offset in both. The only difference in the whole APK is
    # `classes6.dex` (:core:common), whose sole change is the ADDED
    # QgbFlags.FIRED_DIR + fired() that QUA-2708 itself introduced; QgbFlags.on() and
    # load() are byte-identical. The old-UI/new-UI lead is dead twice over: this patch
    # and stock-left-display-low are read by the SAME call site
    # (MedicinesScreenViewModel.kt:62 and :64, one MedicineScreenItem), so no UI-path
    # split can fire one and not the other.
    # What is left is a CASE-STABILITY question about medtimer-review-aspirin, not a
    # build question: one derivation session against a code-identical artifact did not
    # see '9:00 AM' in the screen diff. `--repeat 3` only says it was stably absent
    # within that one session (same boot, same app data) — it cannot tell a build
    # difference from a session-level condition. TODO(derive): re-derive
    # medtimer-review-aspirin on a device and explain the absent marker before anyone
    # quotes a number from that case; until then treat the published APK and a clean
    # rebuild as interchangeable for this defect, because they are.
    patch:
      file: core/ui/src/main/java/com/futsch1/medtimer/core/ui/MedicineStringFormatter.kt
      find: |-
        return reminders.map { r -> r.time }.sorted()
        .map { timeFormatter.toTimeString(it) }
      replace: |-
        return reminders.map { r -> r.time }.sorted()
        // BUG(reminder-time-display-shifted): the summary renders every time one hour late.
        .map { timeFormatter.toTimeString(if (com.futsch1.medtimer.core.common.QgbFlags.on("reminder-time-display-shifted")) it.copy(minutes = it.minutes + 60) else it) }

  # ── journey-only CRASH defect (QUA-2710) — no exploration feature, so hunt mode
  # never activates it; it exists for data/test-cases/medtimer.yaml. This is the
  # corpus's first seeded CRASH, and the template later ones copy, so the shape is
  # spelled out here.
  #
  # THE FAULT. The medicine list's row (MedicineCard) ends with a summary line that
  # lists the medicine's reminder times. Upstream guards it with
  # `reminderTimes.isNotEmpty()`. The patch keeps that branch but drops the guard from
  # the READ inside it, in the shape a real refactor takes ("lead with the earliest
  # time"): `reminderTimes.first()`. Kotlin's `first()` on an empty list throws
  # java.util.NoSuchElementException, and this runs inside composition on the UI
  # thread, so the process dies and Android shows "MedTimer keeps stopping".
  #
  # WHY IT IS REACHABLE AND NARROW. `inactive` (reminders exist but none active) is
  # checked FIRST, so Ibuprofen — one inactive reminder — takes that branch and is
  # untouched. Aspirin has one ACTIVE reminder, so its list is non-empty and the
  # patched expression renders the identical string. The ONLY row that reaches
  # `first()` with an empty list is a medicine with NO reminders at all — which is
  # exactly what the user has just created when they add one. So the fixture's two
  # medicines render identically on both arms, the clean/seeded screen diff before the
  # add is EMPTY, and the death is attributable to one action.
  #
  # ATTRIBUTION. `QgbFlags.fired(...)` sits on the line BEFORE the throw and only on
  # the path that throws (the empty-list row), so the marker on disk means "this
  # seeded site is what killed the app" and replay.gate_crash can treat identity as
  # settled by construction rather than by parsing a stack. It is deliberately NOT
  # called for every row: `fired()` touches a file, and this is the UI thread.
  - id: medicine-list-empty-reminders-crash
    title: The medicine list dies on a medicine that has no reminders
    patch:
      file: feature/ui/src/main/java/com/futsch1/medtimer/feature/ui/medicine/MedicineCard.kt
      find: |-
        } else if (medicine.reminderTimes.isNotEmpty()) {
        Text(
        text = medicine.reminderTimes.joinToString(", "),
        style = MaterialTheme.typography.bodySmall
        )
        }
      replace: |-
        } else if (medicine.reminderTimes.isNotEmpty() || com.futsch1.medtimer.core.common.QgbFlags.on("medicine-list-empty-reminders-crash")) {
        // BUG(medicine-list-empty-reminders-crash): the summary line leads with the
        // row's earliest reminder time and the emptiness guard no longer stands in
        // front of the read. A medicine with no reminders at all reaches first() with
        // an empty list, which throws NoSuchElementException during composition and
        // kills the app. Rows that DO have reminders render exactly as before.
        if (medicine.reminderTimes.isEmpty()) com.futsch1.medtimer.core.common.QgbFlags.fired("medicine-list-empty-reminders-crash")
        Text(
        text = (listOf(medicine.reminderTimes.first()) + medicine.reminderTimes.drop(1)).joinToString(", "),
        style = MaterialTheme.typography.bodySmall
        )
        }

  # ── journey-only HANG defects (QUA-2711) — no exploration feature, so hunt mode
  # never activates them; they exist for data/test-cases/medtimer.yaml. These are the
  # corpus's first two FREEZES, and the pair the plan's "Performance, ANR, freeze"
  # bucket was missing: until now the ANR path and the stuck probe had only ever met a
  # process frozen by hand (`scripts/crash_probe.py --anr` / `--stuck`, which SIGSTOPs
  # the app), never a seeded code path that blocks the main thread.
  #
  # THE OPERATOR IS THE SAME IN BOTH, AND IT IS AN ORDERING CHANGE, NOT A SLEEP.
  # CLAUDE.md's rule for forced interleavings: an operator that changes an ORDERING is
  # seedable (post-vs-run), one that merely WIDENS a window (a sleep, a slower loop) is
  # not, because a widened window measures the device rather than the defect. Both
  # patches below take work that was LAUNCHED on a coroutine scope and RUN it instead,
  # through `runBlocking(Dispatchers.Main)` on a thread that is already the main thread.
  # That is a permanent, timing-free deadlock, not a long wait: `runBlocking` parks the
  # main thread and posts the body to the main Looper, which is the thread it just
  # parked, so the body can never run. There is no margin to measure and no trial that
  # can come out the other way — which is exactly what `--repeat 3` is there to confirm.
  #
  # WHY TWO, AND WHAT SEPARATES THEM. The DETECTION PATHS differ, and that is the whole
  # point of the pair (see docs/architecture.md and CLAUDE.md's crash/ANR/stuck note):
  #   * `overview-action-blocks-main-thread` freezes INSIDE a click handler, so the
  #     route's own next touch goes unanswered and the input dispatcher raises an ANR
  #     by itself. The case reads it through `anrs_since` -> `app_crashed_since` ->
  #     `replay.crash_verdict`, with an `anr:` GATE saying which death is allowed.
  #   * `analysis-table-freezes-on-open` freezes in a `LaunchedEffect`, one frame AFTER
  #     the touch that opened the screen was already answered. Nothing is pending on
  #     the input queue, so Android never raises an ANR at all — the live finding that
  #     made `replay._check_stuck` necessary. Only the probe's one tap reveals it, so
  #     that case carries `stuck:` and no `anr:`.
  #
  # ATTRIBUTION. `QgbFlags.fired(...)` sits on the line BEFORE the block in both, and
  # only inside the flag's own branch, so the marker is on disk before the thread is
  # gone. A marker written AFTER the block would never be written at all.
  - id: overview-action-blocks-main-thread
    title: Answering a reminder from the overview freezes the app
    patch:
      file: feature/ui/src/main/java/com/futsch1/medtimer/feature/ui/overview/OverviewFragment.kt
      find: |-
        lifecycleScope.launch {
        actionsVisitor.startVisit(button).use {
        actions.buttonClicked(actionsVisitor)
        }
        }
      replace: |-
        if (com.futsch1.medtimer.core.common.QgbFlags.on("overview-action-blocks-main-thread")) {
        // BUG(overview-action-blocks-main-thread): the quick action is RUN instead of
        // LAUNCHED, so the click handler does not return until the action is finished.
        // runBlocking parks the main thread and posts the body to the main Looper it
        // just parked: the action never runs and the handler never returns. The touch
        // that opened the menu is therefore never finished either, and the next one is
        // never read, so the input dispatcher raises an ANR ~5 s later.
        com.futsch1.medtimer.core.common.QgbFlags.fired("overview-action-blocks-main-thread")
        kotlinx.coroutines.runBlocking(kotlinx.coroutines.Dispatchers.Main) {
        actionsVisitor.startVisit(button).use {
        actions.buttonClicked(actionsVisitor)
        }
        }
        } else {
        lifecycleScope.launch {
        actionsVisitor.startVisit(button).use {
        actions.buttonClicked(actionsVisitor)
        }
        }
        }

  - id: analysis-table-freezes-on-open
    title: The Analysis tabular view stops drawing when it is opened
    patch:
      file: feature/ui/src/main/java/com/futsch1/medtimer/feature/ui/statistics/table/ReminderTable.kt
      find: |-
        val columns = persistentListOf(
        SortableTableColumn(title = stringResource(R.string.taken), minWidth = 120.dp),
      replace: |-
        androidx.compose.runtime.LaunchedEffect(Unit) {
        // BUG(analysis-table-freezes-on-open): the row refresh the table starts when it
        // enters composition is AWAITED on the main thread instead of being collected.
        // The effect already runs on the main thread, so runBlocking(Dispatchers.Main)
        // parks it and waits for a body only that thread could run. The screen the user
        // just opened stops drawing, and because the chip touch that opened it was
        // already answered a frame earlier, NOTHING is pending on the input queue —
        // Android never raises an ANR on its own. Only the next touch reveals it.
        if (com.futsch1.medtimer.core.common.QgbFlags.on("analysis-table-freezes-on-open")) {
        com.futsch1.medtimer.core.common.QgbFlags.fired("analysis-table-freezes-on-open")
        kotlinx.coroutines.runBlocking(kotlinx.coroutines.Dispatchers.Main) { rows.size }
        }
        }
        val columns = persistentListOf(
        SortableTableColumn(title = stringResource(R.string.taken), minWidth = 120.dp),

  # ── journey-only CRASH and NAVIGATION defects (QUA-2728, epic QUA-2723) — no
  # exploration feature, so hunt mode never activates them (write_bug_flags' explore
  # branch activates the bug_ids of `state: broken` FEATURES only), and the hard tier
  # does not move. They exist for data/test-cases/medtimer.yaml, where they replace the
  # four persistence defects that file no longer seeds (docs/defect-classes.md,
  # section 8: the patches of those four stay above, because each is also a hard-tier
  # hunt defect with a derived `broken` row in truth/hard-stability.json).
  #
  # Templates: medicine-list-empty-reminders-crash above (crash) and fossify-calendar's
  # view-switch-stuck-on-year (navigation). Each fault throws, or picks its destination,
  # UNCONDITIONALLY on the path a tester takes — no race, no timing, no device margin —
  # and each calls `QgbFlags.fired(...)` inside its own flag branch on the line BEFORE
  # the fault, only on the path that actually faults, so a marker on disk means this
  # seeded site is what fired. The two crashes are deliberately NOT the list crash's
  # fault: different screens, different operators, different exceptions
  # (NoSuchElementException stays the list's own signature).
  #
  # THE LEGACY-FALLBACK CAVEAT, as for the search crash in fossify-calendar.yaml: with
  # files/qgb_flags.txt MISSING the shim turns every defect on, and
  # `dose-edit-save-crash` sits on the route of the hunt feature `event_skip` (its
  # editor saves through the same close). If a hunt derivation ever sees `event_skip`
  # crash, that is a failed flag write, not this defect leaking into hunt mode.

  # CRASH 1 — a reminder cannot be created. Adding a reminder to a medicine is the
  # app's core journey: Medicine tab -> a medicine -> Add reminder -> "Time based
  # reminder" -> NewReminderDialog -> "Create reminder".
  #
  # THE FAULT. The create path normalises the picked time through java.time.LocalTime,
  # but hands the minutes of the DAY to LocalTime.of as the minute of the HOUR — the
  # `% 60` that ReminderTime.getLocalTime() itself uses is missing. LocalTime.of rejects
  # any minute outside 0..59 with java.time.DateTimeException ("Invalid value for
  # MinuteOfHour"), so every reminder from 1:00 AM on dies, including the dialog's own
  # suggested 8:00 AM (480 minutes). The throw is inside activity.lifecycleScope.launch
  # on Dispatchers.Main.immediate with no CoroutineExceptionHandler anywhere in the app
  # (and no custom UncaughtExceptionHandler), so it reaches the main thread's default
  # handler and the process dies. Only a time in the 12 AM hour would get through.
  - id: new-reminder-time-crash
    title: Creating a time-based reminder kills the app
    patch:
      file: feature/ui/src/main/java/com/futsch1/medtimer/feature/ui/medicine/dialogs/NewReminderDialog.kt
      # Two lines: `ReminderTime(timeEditor.getMinutes())` alone is already unique in this
      # file (NewReminderStockDialog.kt has its own copy, which an anchor naming THIS file
      # never sees), and the leading `if` pins it to the time-based branch.
      find: |-
        val reminderTime = if (reminder.reminderType == ReminderType.TIME_BASED) {
        ReminderTime(timeEditor.getMinutes())
      replace: |-
        val reminderTime = if (reminder.reminderType == ReminderType.TIME_BASED) {
        if (com.futsch1.medtimer.core.common.QgbFlags.on("new-reminder-time-crash")) {
        // BUG(new-reminder-time-crash): the picked time goes through LocalTime, but the
        // minutes of the DAY are passed as the minute of the HOUR (the `% 60` is
        // missing), so LocalTime.of throws DateTimeException for any time from 1:00 AM on.
        val qgbMinutes = timeEditor.getMinutes()
        if (qgbMinutes !in 0..59) com.futsch1.medtimer.core.common.QgbFlags.fired("new-reminder-time-crash")
        ReminderTime(java.time.LocalTime.of(qgbMinutes / 60, qgbMinutes))
        } else {
        ReminderTime(timeEditor.getMinutes())
        }

  # CRASH 2 — an edited dose cannot be saved. Correcting a logged dose is the other
  # everyday write on the Overview: tap the event card -> its editor sheet -> change the
  # amount -> close it (EditEventSheetDialogFragment.onDismiss -> updateEvent()).
  #
  # THE FAULT. updateEvent() now caps the event's note at 500 characters, and does it
  # with substring(0, 500) where take(500) was meant. String.substring throws
  # java.lang.StringIndexOutOfBoundsException whenever the string is SHORTER than the
  # cap, which is every note a person writes, the empty one included — so closing the
  # editor after ANY edit throws. updateEvent's body runs on viewModelScope
  # (Dispatchers.Main.immediate) straight from onDismiss, before its first suspension,
  # so the process dies before the row is written: the seeded arm stores nothing. A
  # note of 500 characters or more would get through, and nobody types one.
  - id: dose-edit-save-crash
    title: Saving an edited dose kills the app
    patch:
      file: feature/ui/src/main/java/com/futsch1/medtimer/feature/ui/overview/EditEventViewModel.kt
      # Unique: updateEvent() is the only reader of `storedEvent` that returns early.
      find: |-
        val event = storedEvent ?: return@launch
      replace: |-
        val event = storedEvent ?: return@launch
        if (com.futsch1.medtimer.core.common.QgbFlags.on("dose-edit-save-crash")) {
        // BUG(dose-edit-save-crash): the note is capped at 500 characters with
        // substring(0, 500) instead of take(500), which throws
        // StringIndexOutOfBoundsException for every note shorter than the cap.
        if (_notes.value.length < 500) com.futsch1.medtimer.core.common.QgbFlags.fired("dose-edit-save-crash")
        _notes.value = _notes.value.substring(0, 500)
        }

  # NAVIGATION — the stock button goes to the wrong screen. "Wrong control flow or
  # navigation" is an 11% plan target; fossify-calendar's view switch was its only
  # member.
  #
  # THE FAULT. EditMedicineSubmenus.open() is the single chokepoint for the medicine
  # screen's icon row (Medicine settings / Notes / Tags / Medicine stock / Calendar).
  # Its STOCK_TRACKING branch is wired to the SETTINGS branch's destination — the
  # copy-paste slip the `when`'s five near-identical branches invite. Same statements,
  # same order, one destination: a tester who taps "Medicine stock" to read or refill a
  # medicine's stock lands on its Medicine settings screen (color, notification
  # priority, "Medicine cannot be skipped"), which has no stock field at all, and the
  # control that should take them there is the one that is broken. Nothing freezes and
  # nothing is lost, which is what makes it `navigation` rather than `crash` or `stuck`.
  #
  # WHY IT IS CHECKABLE FROM THE HIERARCHY. The two destinations disagree about text:
  # the stock screen's first row is "Amount" (with the stock, 10, as its summary) and
  # the settings screen has no such row. The case reads `present: Amount` on the
  # destination — static chrome, stable against the calendar date, unlike the run-out
  # date the stock screen also shows.
  #
  # Unconditional on purpose: unlike view-switch-stuck-on-year there is no check_setup
  # in this spec for an ungated destination to strand, and no other case's route taps
  # "Medicine stock".
  - id: stock-button-opens-settings
    title: A medicine's stock button opens its settings screen instead
    patch:
      file: feature/ui/src/main/java/com/futsch1/medtimer/feature/ui/medicine/EditMedicineSubmenus.kt
      # `Submenu.STOCK_TRACKING -> {` is unique; the next four lines are inside the anchor
      # because the replace re-points them.
      find: |-
        Submenu.STOCK_TRACKING -> {
        val action =
        EditMedicineFragmentDirections.actionEditMedicineFragmentToStockSettingsFragment(
        medicine.id
        )
      # `fired()` on the line BEFORE the substituted destination takes effect. A
      # synchronous File.createNewFile on the UI thread; this build installs no
      # StrictMode, and the same call already rides the UI thread in the list crash.
      replace: |-
        Submenu.STOCK_TRACKING -> {
        // BUG(stock-button-opens-settings): the stock button navigates to the SETTINGS
        // destination (the branch above) instead of its own. The destination is the only
        // thing that changes.
        val qgbWrongDestination = com.futsch1.medtimer.core.common.QgbFlags.on("stock-button-opens-settings")
        if (qgbWrongDestination) com.futsch1.medtimer.core.common.QgbFlags.fired("stock-button-opens-settings")
        val action = if (qgbWrongDestination) {
        EditMedicineFragmentDirections.actionEditMedicineFragmentToMedicineSettingsFragment(
        medicine.id
        )
        } else {
        EditMedicineFragmentDirections.actionEditMedicineFragmentToStockSettingsFragment(
        medicine.id
        )
        }

