# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Markor (github.com/gsantner/markor) — seeded-bug benchmark app.
# MEDIUM tier: 4 bugs + 2 working controls.
#
# THIS APP IS THE `file` ORACLE PROBE. Every other benchmark app so far stores state in
# a database or SharedPreferences inside its sandbox; Markor stores notes as real files
# in shared storage, so it is the first app scored by reading the filesystem.
# Device-verified on API 33: the app creates /sdcard/Documents/markor and it is readable
# with a plain `adb shell ls` — no run-as needed.
#
# JAVA APP, no Kotlin plugin (build.gradle sets enable_plugin_kotlin = false), so the
# flag shim is generated as .java. build_app.py picks the template from the extension.
#
# The file CREATION path (GsFileUtils.writeFile) is deliberately untouched so both
# controls have an oracle; the bugs sit on editor-save, rename, delete and search.

app:
  id: markor
  name: Markor
  package: net.gsantner.markor
  platform: android
  difficulty: medium

apk:
  repo: qualgent/qualgentbench-apps
  filename: medium/markor-buggy.apk
  sha256: 946e9b976f38305cc797c22debcc5ede1e8d7183945ee77f3046e0c770420a75
  size_bytes: 17151622

build:
  repo: https://github.com/gsantner/markor
  dir: Markor
  ref: "v2.16.1"                           # release tag, never `main`. NB: pick it with
                                           # `git tag --sort=-v:refname`, NOT `tail` —
                                           # lexical sort ranks v2.9.0 above v2.16.1 and
                                           # that tag predates a whole package reshuffle.
  gradle_task: ":app:assembleFlavorDefaultDebug"
  apk_glob: "app/build/outputs/apk/flavorDefault/debug/*.apk"
  # `build_app.py --demo-fired` anchor (QUA-3457): a line every launch runs, after which
  # one throwaway QgbFlags.fired("demo") call is inserted to prove the canary round trip.
  demo_fired:
    file: app/src/main/java/net/gsantner/markor/activity/MainActivity.java
    find: "super.onCreate(savedInstanceState);"

flags:
  file: app/src/main/java/net/gsantner/markor/QgbFlags.java
  package: net.gsantner.markor

# Markor keeps notes in shared storage, which survives `pm clear` AND an uninstall,
# so without this every trial opened on the previous trial's files.
shared_storage:
  - /sdcard/Documents/markor

device_setup:
  # Markor's first run opens IntroActivity — a multi-page AppIntro that `pm clear`
  # brings back on EVERY replay reset. Both arms dismissed it live and neither
  # recorded the dismissal, so all 16 reproductions died at step 2 on a REAL id
  # (`fab_add_new_item`) that simply is not on the intro screen.
  #
  # Seeding the "intro was shown" pref BEFORE the snapshot makes the episode start on
  # the file browser, which is the state every later launch reaches — the same
  # idempotence rule birday's relaunch-before-snapshot established. The changelog
  # dialog that follows needs nothing: relaunch() already runs _dismiss_overlays and
  # "ok" is in its label list.
  #
  # The key is IntroActivity.class.getCanonicalName() + "was_shown", read from
  # PreferenceManager.getDefaultSharedPreferences -> <package>_preferences.xml.
  #
  # The notebook fixture (QUA-3457, the journey cases): four short notes, two of them in
  # a Recipes folder, pushed into the notebook directory after `shared_storage` wipes it.
  # Their modification time is pinned so the list's date column reads the same on every
  # machine (adb push keeps the HOST file's mtime, which is the clone's checkout time).
  # The hunt checks name only QASEED / QAADD / QAFOLD, which none of these collide with.
  push:
    - {src: assets/markor/markor_preferences.xml, dest: /data/local/tmp/markor_prefs.xml}
    - {src: assets/markor/notebook/Shopping.md, dest: /sdcard/Documents/markor/Shopping.md}
    - {src: assets/markor/notebook/Travel.md, dest: /sdcard/Documents/markor/Travel.md}
    - {src: assets/markor/notebook/Recipes/Pancakes.md, dest: /sdcard/Documents/markor/Recipes/Pancakes.md}
    - {src: assets/markor/notebook/Recipes/Soup.md, dest: /sdcard/Documents/markor/Recipes/Soup.md}
  shell:
    - "run-as net.gsantner.markor sh -c 'mkdir -p shared_prefs && cp /data/local/tmp/markor_prefs.xml shared_prefs/net.gsantner.markor_preferences.xml'"
    - "touch -d '2026-09-15 09:00:00' /sdcard/Documents/markor/Shopping.md /sdcard/Documents/markor/Travel.md /sdcard/Documents/markor/Recipes/Pancakes.md /sdcard/Documents/markor/Recipes/Soup.md /sdcard/Documents/markor/Recipes"

exploration:
  id: explore-markor
  step_budget: 500
  title: "Release sign-off \u2014 Markdown notes"
  # HARNESS-ONLY (truth.setup_of): clears the five-page intro and its changelog dialog,
  # then creates one note WITH CONTENT. The content matters: `content-not-saved` is
  # scoped to `file.exists() && file.length() > 0`, so a check that edits an EMPTY file
  # saves normally on both builds and the area derives `ok`. Runs on the CLEAN build,
  # which is what lets the seed content be written at all.
  # Not `device_setup` — the agent still does all of this; see birday.
  #
  # markor keeps its notebook in SHARED storage, which survives `pm clear` and even an
  # uninstall, so `shared_storage:` above is snapshotted and restored per check
  # (replay.snapshot_shared). Without that, pass two of every check would start from
  # whatever pass one left behind — the delete check in particular.
  # The `wait`s are load-bearing: the intro is a ViewPager whose page images take
  # longer than the 1s inter-step settle, so consecutive taps landed mid-transition and
  # setup failed at a different step each run.
  check_setup:
    # No intro walk. `device_setup` seeds IntroActivity's "was shown" pref before the
    # snapshot, so every launch — the agent's and the deriver's — lands on the file
    # browser. Walking a NEXT/NEXT/DONE flow that no longer appears failed step 1 and
    # aborted all 7 areas on 2026-08-13. The changelog dialog behind it needs nothing:
    # relaunch() runs _dismiss_overlays and "ok" is in its label list.
    steps: [{tap: "Create a new file or folder"}, {tap: "Name"},
            {type: "QASEED"}, {tap: "OK"}, wait, {append: "QASEEDTEXT"}, {tap: "Save"},
            {press: back}]
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py). Markor
    # stores notes as FILES, not rows, so these assert on screen rather than via `db:`.
    - id: create_note
      state: ok
      probe: [note, markor]
      check:
        steps: [launch, {tap: "Create a new file or folder"}, {tap: "Name"},
                {type: "QAADD"}, {tap: "OK"}, {press: back}]
        expect: {present: "QAADD.md"}
    - id: create_folder
      state: ok
      probe: [folder]
      check:
        steps: [launch, {tap: "Create a new file or folder"}, {tap: "Name"},
                {type: "QAFOLD"}, {tap: "FOLDER"}]
        expect: {present: "QAFOLD"}
    - id: file_list
      state: ok
      probe: [note, folder]
      check:
        steps: [launch, relaunch]
        expect: {present: "QASEED.md"}
    - id: note_detail
      state: ok
      probe: [note, edit]
      check:
        # The body text is only rendered once the file is open — the list shows names.
        steps: [launch, {tap: "QASEED.md"}]
        expect: {present: "QASEEDTEXT"}
    - id: save_content
      state: broken
      bug_id: content-not-saved
      probe: [edit, markor, save]
      check:
        # `relaunch` between the save and the re-open, so what is asserted is what
        # reached the FILE, not an editor buffer still holding the typed text.
        steps: [launch, {tap: "QASEED.md"}, {append: "QAEDIT"}, {tap: "Save"},
                relaunch, {tap: "QASEED.md"}]
        # The whole merged word, not `QAEDIT`: typing APPENDS to the seeded body, and
        # `_present` matches on token boundaries (deliberately — it is what stopped
        # `present "20"` matching a display reading `200`). `QAEDIT` sits inside
        # `QASEEDTEXTQAEDIT` with a letter before it, so it would never match and the
        # area derived `upstream` on a build that saves correctly.
        expect: {present: "QASEEDTEXTQAEDIT"}
    - id: rename_file
      state: broken
      bug_id: rename-not-saved
      probe: [rename]
      check:
        # The dialog arrives pre-filled with the cursor at the START, so typing
        # PREPENDS: QASEED.md -> XQASEED.md. Verified on the clean build; assuming it
        # appended cost this area a spurious `upstream`.
        # `append`, not `type`: the rename dialog opens PRE-FILLED with the current
        # name and the caret at the start, so the keystroke path inserts. `type` sets
        # the field (2026-08-12), which renamed the file to plain "X" and derived
        # `upstream` — the check failed identically with and without the seeding.
        steps: [launch, {long_press: "QASEED.md"}, {tap: "Rename"}, {append: "X"},
                {tap: "OK"}]
        expect: {present: "XQASEED.md"}
    - id: delete_file
      state: broken
      bug_id: delete-broken
      probe: [delete]
      check:
        steps: [launch, {long_press: "QASEED.md"}, {tap: "Delete"}, {tap: "OK"}]
        expect: {absent: "QASEED.md"}
    # NO CHECK yet. `search-broken` kills CONTENT search (matchLine returns null), and
    # whether the results view replaces the file list or overlays it decides whether
    # `present`/`absent` can tell the two builds apart at all — an overlay leaves the
    # unfiltered list in the hierarchy and the assertion would hold either way. Not
    # guessed at; needs a device pass on the results view.
    - id: search_files
      state: broken
      bug_id: search-broken
      probe: [search]
  instruction: |
    You are a QA engineer. This build of a markdown notes app has been handed to you
    for release sign-off. The list below is what the product team says each area should
    do. Verify them on the device and report what you actually observe.

    Files and folders are created with the + button from the file list.

    SPECIFICATION
      - create_note: a note you create is listed afterwards.
      - create_folder: a folder you create is listed afterwards.
      - file_list: the file list shows the files that exist.
      - note_detail: a note's contents are what was entered for it.
      - save_content: a note's contents after editing are the contents you entered.
      - rename_file: a file's name after renaming is the name you entered.
      - delete_file: a file you delete is no longer listed.
      - search_files: searching returns the files that match the search text.

bugs:
  # L4 — the editor reports a successful save and the text stays on screen, but nothing
  # reaches the file, so the note is empty again when reopened. Gated at the DOCUMENT
  # save, not at GsFileUtils.writeFile, so creating files still works (controls).
  - id: content-not-saved
    title: Note content is not written to the file
    patch:
      file: app/src/main/java/net/gsantner/markor/model/Document.java
      find: |-
        if (isBinaryFileNoTextLoading()) {
            return true;
        }
      replace: |-
        if (isBinaryFileNoTextLoading()) {
            return true;
        }
        // BUG(content-not-saved): reports success without writing anything.
        // Scoped to a file that ALREADY exists on disk. saveContent is also the path
        // that creates a note in the first place, so gating it unconditionally meant a
        // new note was never written at all — the create_note control could not pass
        // while this defect was live, and hunt scored the agent's correct report as a
        // false positive. Guided never saw it: clean tasks run with no flags set.
        if (net.gsantner.markor.QgbFlags.on("content-not-saved")
                && file.exists() && file.length() > 0) {
            // QUA-3457: the journey canary; saveContent is only reached when the text
            // differs from what was loaded, so the skipped write is the defect's effect.
            net.gsantner.markor.QgbFlags.fired("content-not-saved");
            return true;
        }

  # L3 — rename silently does nothing; the old name is still on disk.
  - id: rename-not-saved
    title: Renaming a file does not rename it
    patch:
      file: app/src/main/java/net/gsantner/opoc/util/GsFileUtils.java
      find: |-
        public static boolean renameFile(File srcFile, File destFile) {
            if (srcFile.getAbsolutePath().equals(destFile.getAbsolutePath())) {
                return false;
            }
      replace: |-
        public static boolean renameFile(File srcFile, File destFile) {
            // BUG(rename-not-saved): the rename is skipped but reported as done.
            if (net.gsantner.markor.QgbFlags.on("rename-not-saved")) {
                return true;
            }
            if (srcFile.getAbsolutePath().equals(destFile.getAbsolutePath())) {
                return false;
            }

  # L2 — delete removes the row from the list but never the file, so it is back after a
  # refresh.
  #
  # NOTE: this first gated GsFileUtils.deleteRecursive() — WRONG. The file browser deletes
  # through WrMarkorSingleton.deleteFile() (app/thirdparty/), which calls file.delete()
  # directly and never touches deleteRecursive. The agent reported the feature as working,
  # and it was. Third dead bug of the project, same root cause every time: patch the path
  # the UI actually takes, verified by following the call chain from the click handler.
  - id: delete-broken
    title: Deleting a file does not remove it
    patch:
      file: app/thirdparty/java/other/writeily/model/WrMarkorSingleton.java
      find: |-
        final MarkorContextUtils cu = new MarkorContextUtils(context);
        if (context != null && cu.isUnderStorageAccessFolder(context, file, file.isDirectory())) {
      replace: |-
        // BUG(delete-broken): the file is never deleted, but success is reported.
        if (net.gsantner.markor.QgbFlags.on("delete-broken")) {
            return true;
        }
        final MarkorContextUtils cu = new MarkorContextUtils(context);
        if (context != null && cu.isUnderStorageAccessFolder(context, file, file.isDirectory())) {

  # L2 — every line comparison misses, so a search for text that is plainly in a file
  # returns no results. Gated at the line matcher, the single place both the regex and
  # plain-text paths funnel through.
  - id: search-broken
    title: Searching inside files finds nothing
    patch:
      file: app/src/main/java/net/gsantner/markor/frontend/filesearch/FileSearchEngine.java
      find: |-
        private String matchLine(final String line) {
            final String preparedLine = _config.isCaseSensitiveQuery ? line : line.toLowerCase();
      replace: |-
        private String matchLine(final String line) {
            // BUG(search-broken): the query never matches any line.
            if (net.gsantner.markor.QgbFlags.on("search-broken")) {
                return null;
            }
            final String preparedLine = _config.isCaseSensitiveQuery ? line : line.toLowerCase();

  # ── Journey-only defects (QUA-3457, epic QUA-3449) ─────────────────────────────────
  # Twelve journey cases seed these to the app's class quota (crash 4 / display 2 /
  # persistence 1 / navigation 2 / lifecycle 2 / ANR 1); the persistence slot reuses
  # `content-not-saved` above. No exploration feature names them, so hunt and guided
  # mode never switch them on; each still needs its `tasks:` entry below. Every patch
  # calls QgbFlags.fired("<id>") on the line BEFORE its fault, and only when the
  # defect's effect actually happens (canary proof: build_app.py --buggy --demo-fired
  # --smoke). Each site was found by following the call chain from the control the
  # case touches (the delete-broken lesson above): the To-Do buttons dispatch through
  # TodoTxtActionButtons.onActionClick, the browser's selection actions through
  # GsFileBrowserFragment.onOptionsItemSelected, the editor's File Browser through
  # MainActivity.onNewIntent.

  # CRASH — "Toggle done" on a To-Do task. The completion mark is split and indexed one
  # past its end before the line is rewritten, so the task is never marked done.
  # ActionButtonBase's click handler catches every exception onActionClick throws (a
  # first draft threw inline and the app lived on with the task unmarked), so the fault
  # runs on the editor's next main-loop message, outside that catch.
  - id: todo-toggle-done-crash
    title: Marking a To-Do task done crashes the app
    patch:
      file: app/src/main/java/net/gsantner/markor/format/todotxt/TodoTxtActionButtons.java
      find: |-
        final String doneMark = "x" + (_appSettings.isTodoAddCompletionDateEnabled() ? (" " + TodoTxtTask.getToday()) : "") + " ";
      replace: |-
        final String doneMark = "x" + (_appSettings.isTodoAddCompletionDateEnabled() ? (" " + TodoTxtTask.getToday()) : "") + " ";
        if (net.gsantner.markor.QgbFlags.on("todo-toggle-done-crash")) {
            net.gsantner.markor.QgbFlags.fired("todo-toggle-done-crash");
            // BUG(todo-toggle-done-crash): the mark's parts are read one past their end.
            final String[] qgbParts = doneMark.trim().split(" ");
            _hlEditor.post(() -> android.util.Log.d("Markor", qgbParts[qgbParts.length]));
            return true;
        }

  # CRASH — setting a To-Do task's priority. The chosen letter is read at index 1 of a
  # one-character string, so the line is never rewritten and the process dies.
  - id: todo-priority-crash
    title: Setting a To-Do task's priority crashes the app
    patch:
      file: app/src/main/java/net/gsantner/markor/format/todotxt/TodoTxtActionButtons.java
      find: |-
        MarkorDialogFactory.showPriorityDialog(getActivity(), selTasks.get(0).getPriority(), (priority) -> {
      replace: |-
        MarkorDialogFactory.showPriorityDialog(getActivity(), selTasks.get(0).getPriority(), (priority) -> {
            if (priority.length() == 1 && net.gsantner.markor.QgbFlags.on("todo-priority-crash")) {
                net.gsantner.markor.QgbFlags.fired("todo-priority-crash");
                // BUG(todo-priority-crash): the letter is read past the end of the choice.
                android.util.Log.d("Markor", String.valueOf(priority.charAt(1)));
            }

  # CRASH — creating a note from a built-in template. The OK handler throws after the
  # template is read and before the file is written, so no note is created.
  - id: template-create-crash
    title: Creating a note from a template crashes the app
    patch:
      file: app/src/main/java/net/gsantner/markor/frontend/NewFileDialog.java
      find: |-
        final Pair<String, Integer> content = getTemplateContent(template, title);
      replace: |-
        if (ti > 0 && net.gsantner.markor.QgbFlags.on("template-create-crash")) {
            net.gsantner.markor.QgbFlags.fired("template-create-crash");
            // BUG(template-create-crash): the template is treated as having an unresolved placeholder.
            throw new IllegalArgumentException("unresolved template placeholder in " + templateSpinner.getSelectedItem());
        }
        final Pair<String, Integer> content = getTemplateContent(template, title);

  # CRASH — copying a file into a folder. The folder picker's "Select this folder"
  # callback throws before anything is copied.
  - id: copy-into-folder-crash
    title: Copying a file into a folder crashes the app
    patch:
      file: app/src/main/java/net/gsantner/opoc/frontend/filebrowser/GsFileBrowserFragment.java
      find: |-
        WrMarkorSingleton.getInstance().moveOrCopySelected(files, file, getActivity(), isMove);
      replace: |-
        if (!isMove && net.gsantner.markor.QgbFlags.on("copy-into-folder-crash")) {
            net.gsantner.markor.QgbFlags.fired("copy-into-folder-crash");
            // BUG(copy-into-folder-crash): the copy destination is treated as unresolved.
            throw new IllegalStateException("no copy destination for " + files.size() + " file(s)");
        }
        WrMarkorSingleton.getInstance().moveOrCopySelected(files, file, getActivity(), isMove);

  # DISPLAY (content-format) — the Details dialog's "Lines / Words / Characters" row
  # counts one word too many. The file and the other two counts are right.
  - id: details-word-count-off
    title: The Details dialog counts one word too many
    patch:
      file: app/src/main/java/net/gsantner/markor/frontend/FileInfoDialog.java
      find: |-
        tv(root, R.id.ui__fileinfodialog__textinfo_description).setText(String.format(Locale.ENGLISH, "%d / %d / %d", valLines.intValue(), valWords.intValue(), valChars.intValue()));
      replace: |-
        // BUG(details-word-count-off): the word count is drawn one too high.
        int qgbWords = valWords.intValue();
        if (qgbWords > 0 && net.gsantner.markor.QgbFlags.on("details-word-count-off")) {
            net.gsantner.markor.QgbFlags.fired("details-word-count-off");
            qgbWords += 1;
        }
        tv(root, R.id.ui__fileinfodialog__textinfo_description).setText(String.format(Locale.ENGLISH, "%d / %d / %d", valLines.intValue(), qgbWords, valChars.intValue()));

  # DISPLAY (widget-inventory) — with SEVERAL files selected, the selection toolbar
  # still offers Rename, a single-item action (an extra control). Upstream shows it for
  # exactly one selected item, as it does Details. (A first draft seeded an extra
  # "Select all" once everything is selected; the clean build already shows it then,
  # because the adapter's item count includes more than the ".." row, so that defect
  # had no visible effect.)
  - id: rename-offered-for-multiple
    title: The selection toolbar offers Rename for several selected files
    patch:
      file: app/src/main/java/net/gsantner/opoc/frontend/filebrowser/GsFileBrowserFragment.java
      find: |-
        _fragmentMenu.findItem(R.id.action_rename_selected_item).setVisible(selMulti1 && selWritable & !selInVirtualDirectory);
      replace: |-
        // BUG(rename-offered-for-multiple): the single-item action stays visible for a multi-selection.
        final boolean qgbRenameMany = selMultiMore && net.gsantner.markor.QgbFlags.on("rename-offered-for-multiple");
        if (qgbRenameMany && selWritable && !selInVirtualDirectory) {
            net.gsantner.markor.QgbFlags.fired("rename-offered-for-multiple");
        }
        _fragmentMenu.findItem(R.id.action_rename_selected_item).setVisible((selMulti1 || qgbRenameMany) && selWritable & !selInVirtualDirectory);

  # NAVIGATION — the editor's "File Browser" action opens the notebook's top folder
  # instead of the folder that holds the open note (only for a note inside a subfolder).
  # The action starts MainActivity with the note's file, and both ways in (a new
  # instance's onCreate and an existing one's onNewIntent) end in the adapter's
  # showFile, so that is where it is seeded; a first draft patched onNewIntent alone and
  # never fired, because the editor started a new MainActivity.
  - id: file-browser-opens-notebook-root
    title: The editor's File Browser opens the wrong folder
    patch:
      file: app/src/main/java/net/gsantner/opoc/frontend/filebrowser/GsFileBrowserListAdapter.java
      find: |-
        final File dir = file.getParentFile();
        if (dir != null) {
        loadFolder(dir, file);
        }
      replace: |-
        File dir = file.getParentFile();
        if (net.gsantner.markor.QgbFlags.on("file-browser-opens-notebook-root")
                && dir != null && _dopt.rootFolder != null && !dir.equals(_dopt.rootFolder)) {
            net.gsantner.markor.QgbFlags.fired("file-browser-opens-notebook-root");
            // BUG(file-browser-opens-notebook-root): the notebook's top folder is opened instead of the note's.
            dir = _dopt.rootFolder;
        }
        if (dir != null) {
            loadFolder(dir, file);
        }

  # NAVIGATION — returning from the editor to a file list that was showing a
  # subfolder lands on the notebook's top folder instead of that subfolder.
  - id: back-from-editor-resets-folder
    title: Going back from a note in a folder lands on the top folder
    patch:
      file: app/src/main/java/net/gsantner/opoc/frontend/filebrowser/GsFileBrowserFragment.java
      find: |-
        if (_reloadRequiredOnResume && isVisible() && folder != null && activity != null) {
        reloadCurrentFolder();
        }
      replace: |-
        if (_reloadRequiredOnResume && isVisible() && folder != null && activity != null) {
            final File qgbTop = _appSettings.getNotebookDirectory();
            if (net.gsantner.markor.QgbFlags.on("back-from-editor-resets-folder")
                    && !folder.equals(qgbTop) && GsFileUtils.isChild(qgbTop, folder)) {
                net.gsantner.markor.QgbFlags.fired("back-from-editor-resets-folder");
                // BUG(back-from-editor-resets-folder): the list returns to the top folder.
                _filesystemViewerAdapter.setCurrentFolder(qgbTop);
            } else {
                reloadCurrentFolder();
            }
        }

  # LIFECYCLE — configuration change. The editor saves on every pause, except (seeded)
  # the pause of a rotation, and the recreated editor reloads the file from disk, so text
  # typed since the last save is gone after the phone is turned.
  - id: rotation-drops-unsaved-edit
    title: Text typed in a note is lost when the phone is rotated
    patch:
      file: app/src/main/java/net/gsantner/markor/activity/DocumentEditAndViewFragment.java
      find: |-
        public void onPause() {
        saveDocument(false);
      replace: |-
        public void onPause() {
            final Activity qgbActivity = getActivity();
            if (qgbActivity != null && qgbActivity.isChangingConfigurations()
                    && net.gsantner.markor.QgbFlags.on("rotation-drops-unsaved-edit")) {
                // BUG(rotation-drops-unsaved-edit): the rotation's pause skips the save.
                if (_document != null && _hlEditor != null && !_document.isContentSame(_hlEditor.getText())) {
                    net.gsantner.markor.QgbFlags.fired("rotation-drops-unsaved-edit");
                }
            } else {
                saveDocument(false);
            }

  # LIFECYCLE — process death. The editor's Save button (seeded) writes nothing and
  # leaves the write to the editor's next pause, which every normal exit runs (back,
  # switching apps), so a saved note looks saved for as long as the app lives. When the
  # process dies first, the edit is gone. (A first draft forgot favourites on a cold
  # start; every string the Favourites screen could show was already on screen before
  # the restart, so no witness could prove the restart was reached.)
  - id: save-deferred-until-close
    title: A saved edit is lost when the app is killed before the note is closed
    patch:
      file: app/src/main/java/net/gsantner/markor/activity/DocumentEditAndViewFragment.java
      find: |-
        case R.id.action_save: {
        saveDocument(true);
      replace: |-
        case R.id.action_save: {
            if (net.gsantner.markor.QgbFlags.on("save-deferred-until-close")) {
                // BUG(save-deferred-until-close): the explicit save is left to the next onPause.
                if (_document != null && _hlEditor != null && !_document.isContentSame(_hlEditor.getText())) {
                    net.gsantner.markor.QgbFlags.fired("save-deferred-until-close");
                }
                return true;
            }
            saveDocument(true);

  # ANR — the new-file dialog's FOLDER button parks the main thread on a latch whose
  # countDown is posted to the main Looper it just parked: a permanent, timing-free
  # deadlock inside the click handler. No folder is created, and the next touch goes
  # unanswered, so Android raises the ANR itself.
  - id: new-folder-blocks-main-thread
    title: Creating a folder freezes the app
    patch:
      file: app/src/main/java/net/gsantner/markor/frontend/NewFileDialog.java
      find: |-
        dialogBuilder.setNeutralButton(R.string.folder, (dialogInterface, i) -> {
      replace: |-
        dialogBuilder.setNeutralButton(R.string.folder, (dialogInterface, i) -> {
            // BUG(new-folder-blocks-main-thread): the main thread waits on work posted to itself.
            if (net.gsantner.markor.QgbFlags.on("new-folder-blocks-main-thread")) {
                net.gsantner.markor.QgbFlags.fired("new-folder-blocks-main-thread");
                final java.util.concurrent.CountDownLatch qgbLatch = new java.util.concurrent.CountDownLatch(1);
                new android.os.Handler(android.os.Looper.getMainLooper()).post(qgbLatch::countDown);
                try {
                    qgbLatch.await();
                } catch (InterruptedException ignored) {
                }
            }

