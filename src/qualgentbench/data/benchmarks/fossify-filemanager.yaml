            if (selectedKeys.size > 1 && org.fossify.filemanager.QgbFlags.on("multi-delete-blocks-main-thread")) {
                org.fossify.filemanager.QgbFlags.fired("multi-delete-blocks-main-thread")
                val qgbLatch = java.util.concurrent.CountDownLatch(1)
                android.os.Handler(android.os.Looper.getMainLooper()).post { qgbLatch.countDown() }
                qgbLatch.await()
            }
        deleteFiles()
        }

# ── Guided tasks (one skill per episode) ─────────────────────────────────────────
tasks:
  - id: fossify-filemanager-create-folder
    tier: L1
    bug_id: create-folder-broken
    type: bug
    title: A created folder exists
    expected_verdict: FAIL
    optimal_steps: 8
    step_budget: 45
    instruction: |
      Verify creating a folder. Open Download/QGB, use the + button to create a folder
      named "Trip", then look at the list (refresh if needed). The folder should be
      listed. If it is not there, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: create, screen_keywords: ["folder"]}

  - id: fossify-filemanager-hide
    tier: L2
    bug_id: hide-file-broken
    type: bug
    title: A hidden file is hidden
    expected_verdict: FAIL
    optimal_steps: 8
    step_budget: 45
    instruction: |
      Verify hiding a file. Open Download/QGB, long-press alpha.txt and choose Hide,
      then leave the folder and open it again. The file should no longer be listed. If
      it is still listed, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: hide, screen_keywords: ["hide"]}

  - id: fossify-filemanager-delete
    tier: L2
    bug_id: delete-file-broken
    type: bug
    title: A deleted file is gone
    expected_verdict: FAIL
    optimal_steps: 8
    step_budget: 45
    instruction: |
      Verify deleting a file. Open Download/QGB, long-press beta.txt, delete it and
