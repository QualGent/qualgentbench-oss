  # ORDERING — hiding a selected file runs the post-rename UI update (refresh the list,
  # close the selection) INLINE on the background thread that renamed it, instead of
  # posting it to the main thread. A bare run-inline is not a deterministic crash
  # (CLAUDE.md, the cal-search-event 6/10 lesson), so the order that makes Android CHECK
  # is forced too, with fossify-calendar's `search-results-off-main-thread` shape: the
  # worker posts a hand-off to the main looper, which re-posts itself until the window
  # owes no layout pass, then parks the main thread on a latch while the update runs
  # inline. No sleep, no timeout; `finally` un-parks the main thread if nothing threw.
  - id: hide-refresh-off-main-thread
    title: Hiding a file crashes the app
    patch:
      file: app/src/main/kotlin/org/fossify/filemanager/adapters/ItemsAdapter.kt
      find: |-
        activity.toggleItemVisibility(it.path, hide)
        }
        activity.runOnUiThread {
      replace: |-
        activity.toggleItemVisibility(it.path, hide)
        }
        // BUG(hide-refresh-off-main-thread): the UI update below is RUN INLINE on the
        // worker thread instead of being POSTED, with the main thread parked where it owes
        // no layout pass, so Android's thread check is reached every time. Ordering only.
        val qgbOffMain = org.fossify.filemanager.QgbFlags.on("hide-refresh-off-main-thread")
        val qgbApply: (() -> Unit) -> Unit = { body ->
            if (qgbOffMain && android.os.Looper.myLooper() != android.os.Looper.getMainLooper()) {
                val qgbParked = java.util.concurrent.CountDownLatch(1)
                val qgbRelease = java.util.concurrent.CountDownLatch(1)
                activity.runOnUiThread(object : Runnable {
                    override fun run() {
                        val qgbRoot = activity.window.decorView
                        if (qgbRoot.isLayoutRequested || qgbRoot.parent?.isLayoutRequested == true) {
                            qgbRoot.post(this)
                        } else {
                            qgbParked.countDown()
                            qgbRelease.await()
                        }
                    }
                })
                qgbParked.await()
                org.fossify.filemanager.QgbFlags.fired("hide-refresh-off-main-thread")
                try {
                    body()
                } finally {
                    qgbRelease.countDown()
                }
            } else {
                activity.runOnUiThread { body() }
            }
        }
        qgbApply {

  # ANR — confirming the deletion of SEVERAL selected items parks the main thread on a
  # latch whose countDown is posted to the main Looper it just parked: a permanent,
  # timing-free deadlock inside the dialog's click handler. Nothing is deleted, and the
  # next touch goes unanswered, so Android raises the ANR itself.
  - id: multi-delete-blocks-main-thread
    title: Deleting several items at once freezes the app
    patch:
      file: app/src/main/kotlin/org/fossify/filemanager/adapters/ItemsAdapter.kt
      find: |-
