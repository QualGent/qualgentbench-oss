# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Aegis Authenticator (github.com/beemdevelopment/Aegis) — seeded-bug benchmark app, HARD tier.
# A 2FA vault: entries (name, issuer, secret), groups, favorites. 5 independent
# functional bugs across delete / issuer / group / edit / favorite. Adding an entry, the
# entry list and search are working CONTROLS (state: ok).
#
# Storage: the whole vault is ONE JSON file, files/aegis.json (Java app, sandbox path →
# the `file` oracle reads it through run-as). The vault is created WITHOUT a password
# (the intro's "None" option) so the JSON stays readable; `device_setup` seeds an empty
# plaintext vault plus the "intro done" pref so every episode opens on the entry list.
#
# Bug spread: delete is dead (L1); the issuer is dropped on save (L1, the list shows it
# at once); a new group is never added (L2); an edit closes normally but reverts (L3);
# a favorite shows for the session and is gone after a relaunch (L4 — the JSON writer
# always stores favorite=false). Each patch is a single-site mutation on a distinct
# code path (VaultRepository.removeEntry / addGroup / replaceEntry, VaultEntry.setIssuer /
# toJson).

app:
  id: aegis
  name: Aegis Authenticator
  package: com.beemdevelopment.aegis.debug     # debug build (applicationIdSuffix .debug)
  platform: android
  difficulty: hard

apk:
  repo: qualgent/qualgentbench-apps
  filename: hard/aegis-buggy.apk
  sha256: 4205cf18f5b7ace1352875065a1207755e6ee0c0d72cf7380ad9a5962dc4b37b
  size_bytes: 21713277

build:
  repo: https://github.com/beemdevelopment/Aegis
  dir: Aegis                                   # under QualGent-Repos/
  ref: "v3.4.2"                                # release tag, NOT master
  gradle_task: ":app:assembleDebug"
  apk_glob: "app/build/outputs/apk/debug/*.apk"
  compile_sdk: 35                              # app/build.gradle compileSdk at v3.4.2
  # `build_app.py aegis --buggy --demo-fired --smoke <serial>` inserts one throwaway
  # QgbFlags.fired("demo") after this line (every launch runs it) and reads it back.
  demo_fired:
    file: app/src/main/java/com/beemdevelopment/aegis/ui/MainActivity.java
    find: "setContentView(R.layout.activity_main);"

flags:
  file: app/src/main/java/com/beemdevelopment/aegis/QgbFlags.java   # .java → Java shim
  package: com.beemdevelopment.aegis

# Seed an empty plaintext vault + "intro done", after pm clear and before launch.
# The prefs also turn off pref_warn_time_sync (QUA-3453): staging pins the device clock
# with `settings put global auto_time 0` (QUA-2781), and with auto time off Aegis opens
# every launch on an "Automatic time synchronization" dialog instead of the entry list.
device_setup:
  push:
    - {src: assets/aegis/aegis-empty.json, dest: /sdcard/qgb-aegis.json}
    - {src: assets/aegis/aegis-prefs.xml, dest: /sdcard/qgb-aegis-prefs.xml}
  shell:
    - "run-as com.beemdevelopment.aegis.debug mkdir -p files shared_prefs"
    - "cat /sdcard/qgb-aegis.json | run-as com.beemdevelopment.aegis.debug sh -c 'cat > files/aegis.json'"
    - "cat /sdcard/qgb-aegis-prefs.xml | run-as com.beemdevelopment.aegis.debug sh -c 'cat > shared_prefs/com.beemdevelopment.aegis.debug_preferences.xml'"

exploration:
  id: explore-aegis
  step_budget: 500
  title: "Release sign-off — Authenticator"
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py).
    # The + button offers "Enter manually"; the form fields are text_name / text_issuer /
    # text_secret (the secret must be base32). Long-pressing an entry opens the action
    # mode: Favorite / Edit are icons, Delete is under its overflow (confirm = OK). The
    # group picker is a bottom sheet: addGroup → name dialog → btnSave.
    - id: add_entry
      state: ok
      probe: [entry, add]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "SAVE"}, wait]
        expect: {file: /data/data/com.beemdevelopment.aegis.debug/files/aegis.json,
                 contains: "Alpha"}
    - id: entry_list
      state: ok
      probe: [entry, list]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "SAVE"}, relaunch]
        expect: {present: "Alpha"}
    - id: search
      state: ok
      probe: [search]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "SAVE"}, {tap: "Search"}, {type: "Alp"}]
        expect: {present: "Alpha"}
    - id: delete_entry
      state: broken
      bug_id: entry-delete-broken
      probe: [entry, delete]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "SAVE"}, {long_press: "Alpha"}, {tap: "More options"}, {tap: "Delete"},
                {tap: "OK"}, wait]
        expect: {file: /data/data/com.beemdevelopment.aegis.debug/files/aegis.json,
                 contains: "Alpha", absent: true}
    - id: issuer
      state: broken
      bug_id: issuer-dropped
      probe: [issuer]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_issuer"}, {type: "Acme"}, {tap: "text_secret"},
                {type: "JBSWY3DPEHPK3PXP"}, {tap: "SAVE"}, wait]
        expect: {file: /data/data/com.beemdevelopment.aegis.debug/files/aegis.json,
                 contains: "Acme"}
    - id: create_group
      state: broken
      bug_id: group-not-added
      probe: [group]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "No group"}, {tap: "addGroup"}, {tap: "text_input"}, {type: "Work"},
                {tap: "OK"}, {tap: "btnSave"}, {tap: "SAVE"}, wait]
        expect: {file: /data/data/com.beemdevelopment.aegis.debug/files/aegis.json,
                 contains: "Work"}
    - id: edit_entry
      state: broken
      bug_id: edit-entry-not-saved
      probe: [entry, edit]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "SAVE"}, {long_press: "Alpha"}, {tap: "Edit"}, {tap: "text_name"},
                {type: "Beta"}, {tap: "SAVE"}, wait]
        expect: {file: /data/data/com.beemdevelopment.aegis.debug/files/aegis.json,
                 contains: "Beta"}
    - id: favorite
      state: broken
      bug_id: favorite-not-persisted
      probe: [favorite]
      check:
        steps: [launch, {tap: "Add new entry"}, {tap: "Enter manually"}, {tap: "text_name"},
                {type: "Alpha"}, {tap: "text_secret"}, {type: "JBSWY3DPEHPK3PXP"},
                {tap: "SAVE"}, {long_press: "Alpha"}, {tap: "Favorite"}, wait]
        expect: {file: /data/data/com.beemdevelopment.aegis.debug/files/aegis.json,
                 contains: "\"favorite\": true"}
  instruction: |
    You are a QA engineer. This build of a two-factor authenticator app has been handed
    to you for release sign-off. The list below is what the product team says each area
    should do. Verify them on the device and report what you actually observe.

    The + button adds an entry ("Enter manually" needs a name and a base32 secret such
    as JBSWY3DPEHPK3PXP). Long-pressing an entry selects it and shows its actions in the
    toolbar; the entry form's group picker can create a new group.

    SPECIFICATION
      - add_entry: an entry you add is listed afterwards.
      - entry_list: the list shows the entries that exist.
      - search: searching for part of an entry's name shows that entry.
      - delete_entry: an entry you delete is no longer listed.
      - issuer: the issuer you enter for an entry is shown with it.
      - create_group: a group you create from the entry form exists afterwards.
      - edit_entry: an entry's name after editing is the name you entered.
      - favorite: an entry you mark as favorite is still a favorite when you open the app again.

bugs:
  # L1 — dead delete: the entry is never removed from the vault.
  - id: entry-delete-broken
    title: Deleting an entry does not remove it
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/vault/VaultRepository.java
      find: |-
        public VaultEntry removeEntry(VaultEntry entry) {
        return _vault.getEntries().remove(entry);
      replace: |-
        public VaultEntry removeEntry(VaultEntry entry) {
        // BUG(entry-delete-broken): the entry is never removed.
        if (com.beemdevelopment.aegis.QgbFlags.on("entry-delete-broken")) return entry;
        return _vault.getEntries().remove(entry);

  # L1 — the issuer typed into the form is stored empty.
  - id: issuer-dropped
    title: An entry's issuer is not saved
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/vault/VaultEntry.java
      find: |-
        public void setIssuer(String issuer) {
        _issuer = issuer;
      replace: |-
        public void setIssuer(String issuer) {
        // BUG(issuer-dropped): the issuer is always stored empty.
        _issuer = com.beemdevelopment.aegis.QgbFlags.on("issuer-dropped") ? "" : issuer;

  # L2 — a new group is never added to the vault.
  - id: group-not-added
    title: Creating a group does not add it
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/vault/VaultRepository.java
      find: |-
        public void addGroup(VaultGroup group) {
        _vault.getGroups().add(group);
      replace: |-
        public void addGroup(VaultGroup group) {
        // BUG(group-not-added): the group is never added.
        if (!com.beemdevelopment.aegis.QgbFlags.on("group-not-added")) _vault.getGroups().add(group);

  # L3 — the edit screen closes as if saved, but the entry is never replaced.
  - id: edit-entry-not-saved
    title: Editing an entry does not save the change
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/vault/VaultRepository.java
      find: |-
        public VaultEntry replaceEntry(VaultEntry entry) {
        return _vault.getEntries().replace(entry);
      replace: |-
        public VaultEntry replaceEntry(VaultEntry entry) {
        // BUG(edit-entry-not-saved): the edited entry is never written back.
        if (com.beemdevelopment.aegis.QgbFlags.on("edit-entry-not-saved")) {
            // Canary added by QUA-3453 (the journey reuses this defect): it names the
            // seeded site that ran and changes nothing else.
            com.beemdevelopment.aegis.QgbFlags.fired("edit-entry-not-saved");
            return entry;
        }
        return _vault.getEntries().replace(entry);

  # L4 — the in-memory favorite flag is honoured for the session, but the JSON writer
  # always stores it as false, so it is gone after a relaunch.
  - id: favorite-not-persisted
    title: A favorite does not survive a relaunch
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/vault/VaultEntry.java
      find: |-
        obj.put("favorite", _isFavorite);
      replace: |-
        // BUG(favorite-not-persisted): the favorite flag is always written as false.
        obj.put("favorite", com.beemdevelopment.aegis.QgbFlags.on("favorite-not-persisted") ? false : _isFavorite);

  # ── journey-only defects seeded by QUA-3453 (epic QUA-3449: the class quota) ───────
  # aegis's journey cases live in data/test-cases/aegis.yaml. None of these eleven has an
  # exploration feature, so hunt mode never switches one on, and the hunt build does not
  # carry them (journey mode installs the journey build). Every patch calls
  # QgbFlags.fired("<id>") on the line before its fault takes effect (the attribution
  # canary, docs/adding-an-app.md). Each was placed after following the call chain from
  # the click handler that reaches it (plan §6 rule 10).

  # CRASH — the Transfer screen's Next control steps two codes instead of one. With two
  # entries selected, the second tap target is index 2 of a 2-element list, so
  # generateQR throws java.lang.IndexOutOfBoundsException and the app dies on Next.
  - id: transfer-next-skips-code
    title: Moving to the next transfer code crashes the app
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/TransferEntriesActivity.java
      find: |-
        _currentEntryCount++;
      replace: |-
        // BUG(transfer-next-skips-code): Next advances two codes, past the last one.
        if (com.beemdevelopment.aegis.QgbFlags.on("transfer-next-skips-code")) {
            com.beemdevelopment.aegis.QgbFlags.fired("transfer-next-skips-code");
            _currentEntryCount++;
        }
        _currentEntryCount++;

  # CRASH — the multi-entry delete confirmation formats its count as text: `%d` receives
  # a String, so java.util.IllegalFormatConversionException ("d != java.lang.String")
  # kills the app when Delete is chosen with two or more entries selected. A single-entry
  # delete takes the other branch and is unaffected.
  - id: delete-dialog-count-format-crash
    title: Deleting several entries at once crashes the app
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/dialogs/Dialogs.java
      find: |-
        message = context.getResources().getQuantityString(R.plurals.delete_entries_description, services.size(), services.size());
      replace: |-
        // BUG(delete-dialog-count-format-crash): the count is passed as text to a %d.
        if (com.beemdevelopment.aegis.QgbFlags.on("delete-dialog-count-format-crash")) {
            com.beemdevelopment.aegis.QgbFlags.fired("delete-dialog-count-format-crash");
            message = context.getResources().getQuantityString(R.plurals.delete_entries_description, services.size(), String.valueOf(services.size()));
        } else
        message = context.getResources().getQuantityString(R.plurals.delete_entries_description, services.size(), services.size());

  # CRASH — removing a group in Manage groups removes the row one past it. For the only
  # (or last) group that is out of range: java.lang.IndexOutOfBoundsException on the
  # confirmation's OK. The vault is untouched (the screen writes only on its own SAVE).
  - id: group-remove-wrong-index-crash
    title: Removing a group crashes the app
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/views/GroupAdapter.java
      find: |-
        _groups.remove(position);
      replace: |-
        // BUG(group-remove-wrong-index-crash): the row after the group is removed.
        if (com.beemdevelopment.aegis.QgbFlags.on("group-remove-wrong-index-crash")) {
            com.beemdevelopment.aegis.QgbFlags.fired("group-remove-wrong-index-crash");
            position = position + 1;
        }
        _groups.remove(position);

  # CRASH — the edit screen formats an entry's last-used time with a pattern holding an
  # illegal letter: java.lang.IllegalArgumentException ("Illegal pattern character 'Q'")
  # in onCreate. Only an entry that has been used (tapped in the list) has a timestamp,
  # so opening Edit on a never-used entry is unaffected.
  - id: last-used-date-format-crash
    title: Editing an entry that has been used crashes the app
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/EditEntryActivity.java
      find: |-
        DateFormat dateFormat = DateFormat.getDateTimeInstance(DateFormat.MEDIUM, DateFormat.MEDIUM, Locale.getDefault());
        readableDate = dateFormat.format(new Date(timestamp));
      replace: |-
        DateFormat dateFormat = DateFormat.getDateTimeInstance(DateFormat.MEDIUM, DateFormat.MEDIUM, Locale.getDefault());
        // BUG(last-used-date-format-crash): the pattern carries an illegal letter.
        if (com.beemdevelopment.aegis.QgbFlags.on("last-used-date-format-crash")) {
            com.beemdevelopment.aegis.QgbFlags.fired("last-used-date-format-crash");
            dateFormat = new java.text.SimpleDateFormat("MMM d, yyyy h:mm:ss Q", Locale.getDefault());
        }
        readableDate = dateFormat.format(new Date(timestamp));

  # DISPLAY (content-format) — the audit log's reference line for a shared entry repeats
  # the issuer where the account name belongs: "Acme (Acme)" for Acme / Alpha. The stored
  # entry and the event are right; only the line is wrong.
  - id: audit-reference-issuer-twice
    title: The audit log names a shared entry by its issuer twice
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/views/AuditLogHolder.java
      find: |-
        _auditLogEntryReference.setText(String.format("%s (%s)", referencedVaultEntry.getIssuer(), referencedVaultEntry.getName()));
      replace: |-
        // BUG(audit-reference-issuer-twice): the issuer stands in for the account name.
        if (com.beemdevelopment.aegis.QgbFlags.on("audit-reference-issuer-twice")) {
            com.beemdevelopment.aegis.QgbFlags.fired("audit-reference-issuer-twice");
            _auditLogEntryReference.setText(String.format("%s (%s)", referencedVaultEntry.getIssuer(), referencedVaultEntry.getIssuer()));
        } else
        _auditLogEntryReference.setText(String.format("%s (%s)", referencedVaultEntry.getIssuer(), referencedVaultEntry.getName()));

  # DISPLAY (widget-inventory) — transferring ONE entry shows a Next control although
  # there is no second code ("1 / 1 QR code"). The clean build hides it for a single code.
  - id: transfer-single-shows-next
    title: Transferring one entry offers a Next control
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/TransferEntriesActivity.java
      find: |-
        int controlVisibility = _authInfos.size() != 1 ? View.VISIBLE : View.INVISIBLE;
      replace: |-
        int controlVisibility = _authInfos.size() != 1 ? View.VISIBLE : View.INVISIBLE;
        // BUG(transfer-single-shows-next): the single-code case keeps its Next control.
        if (com.beemdevelopment.aegis.QgbFlags.on("transfer-single-shows-next") && _authInfos.size() == 1) {
            com.beemdevelopment.aegis.QgbFlags.fired("transfer-single-shows-next");
            controlVisibility = View.VISIBLE;
        }

  # DISPLAY (content-format) — the single-entry delete confirmation names the FIRST entry
  # of the vault instead of the selected one ("• Acme (Alpha)" while Globex / Bravo is
  # selected). What OK then deletes is still the selected entry.
  - id: delete-dialog-names-first-entry
    title: The delete confirmation names the wrong entry
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/MainActivity.java
      find: |-
        Dialogs.showDeleteEntriesDialog(MainActivity.this, _selectedEntries, (d, which) -> {
      replace: |-
        // BUG(delete-dialog-names-first-entry): the dialog lists the vault's first entry.
        java.util.List<VaultEntry> qgbNamed = _selectedEntries;
        if (com.beemdevelopment.aegis.QgbFlags.on("delete-dialog-names-first-entry") && _selectedEntries.size() == 1) {
            com.beemdevelopment.aegis.QgbFlags.fired("delete-dialog-names-first-entry");
            qgbNamed = java.util.Collections.singletonList(_vaultManager.getVault().getEntries().iterator().next());
        }
        Dialogs.showDeleteEntriesDialog(MainActivity.this, qgbNamed, (d, which) -> {

  # NAVIGATION — the backup reminder's "Set up backups" opens the Appearance settings
  # instead of the Backups settings.
  - id: backup-reminder-opens-appearance
    title: Set up backups opens the wrong settings screen
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/MainActivity.java
      find: |-
        .setPositiveButton(R.string.backup_reminder_bar_dialog_accept, (dialog, whichButton) -> {
        startPreferencesActivity(BackupsPreferencesFragment.class, "pref_backups");
      replace: |-
        .setPositiveButton(R.string.backup_reminder_bar_dialog_accept, (dialog, whichButton) -> {
        // BUG(backup-reminder-opens-appearance): the wrong preferences fragment is opened.
        if (com.beemdevelopment.aegis.QgbFlags.on("backup-reminder-opens-appearance")) {
            com.beemdevelopment.aegis.QgbFlags.fired("backup-reminder-opens-appearance");
            startPreferencesActivity(com.beemdevelopment.aegis.ui.fragments.preferences.AppearancePreferencesFragment.class, null);
        } else
        startPreferencesActivity(BackupsPreferencesFragment.class, "pref_backups");

  # NAVIGATION — Edit in the selection toolbar opens the vault's FIRST entry instead of
  # the selected one.
  - id: edit-opens-first-entry
    title: Edit opens a different entry than the one selected
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/MainActivity.java
      find: |-
        startEditEntryActivity(_selectedEntries.get(0));
      replace: |-
        // BUG(edit-opens-first-entry): the editor is opened on the vault's first entry.
        if (com.beemdevelopment.aegis.QgbFlags.on("edit-opens-first-entry")) {
            com.beemdevelopment.aegis.QgbFlags.fired("edit-opens-first-entry");
            startEditEntryActivity(_vaultManager.getVault().getEntries().iterator().next());
        } else
        startEditEntryActivity(_selectedEntries.get(0));

  # LIFECYCLE — the edit screen's Name field opts out of saved instance state, so a name
  # typed before a rotation is replaced by the stored name when the activity is
  # recreated; saving then keeps the old name. Without a configuration change the field
  # behaves normally.
  - id: entry-name-lost-on-rotation
    title: A name typed in the editor is lost when the screen rotates
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/EditEntryActivity.java
      find: |-
        _textName = findViewById(R.id.text_name);
      replace: |-
        _textName = findViewById(R.id.text_name);
        // BUG(entry-name-lost-on-rotation): the typed name is not kept across recreation.
        if (com.beemdevelopment.aegis.QgbFlags.on("entry-name-lost-on-rotation")) {
            if (savedInstanceState != null) com.beemdevelopment.aegis.QgbFlags.fired("entry-name-lost-on-rotation");
            _textName.setSaveEnabled(false);
        }

  # ORDERING — Transfer ends the selection (mode.finish(), whose onDestroyActionMode
  # clears _selectedEntries) INSIDE the loop that is still iterating that list, instead
  # of after it. Teardown before the work is done; with two or more entries selected
  # the iterator's own check throws java.util.ConcurrentModificationException at the
  # second entry, before the Transfer screen opens. One entry finishes the loop first.
  - id: share-ends-selection-mid-loop
    title: Transferring several entries crashes the app
    patch:
      file: app/src/main/java/com/beemdevelopment/aegis/ui/MainActivity.java
      find: |-
        _auditLogRepository.addEntrySharedEvent(entry.getUUID().toString());
      replace: |-
        _auditLogRepository.addEntrySharedEvent(entry.getUUID().toString());
        // BUG(share-ends-selection-mid-loop): the selection is torn down mid-iteration.
        if (com.beemdevelopment.aegis.QgbFlags.on("share-ends-selection-mid-loop") && _selectedEntries.size() > 1) {
            com.beemdevelopment.aegis.QgbFlags.fired("share-ends-selection-mid-loop");
            mode.finish();
        }

# ── Guided tasks (one skill per episode) ─────────────────────────────────────────
tasks:
  - id: aegis-delete
    tier: L1
    bug_id: entry-delete-broken
    type: bug
    title: Deleting an entry removes it
    expected_verdict: FAIL
    optimal_steps: 10
    step_budget: 50
    instruction: |
      Verify deleting an entry. Add an entry manually (name "Alpha", secret
      JBSWY3DPEHPK3PXP), long-press it, delete it and confirm, then relaunch the app.
      The entry should be gone. If it is still listed, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: delete, screen_keywords: ["entry"]}

  - id: aegis-issuer
    tier: L1
    bug_id: issuer-dropped
    type: bug
    title: An entry shows its issuer
    expected_verdict: FAIL
    optimal_steps: 8
    step_budget: 45
    instruction: |
      Verify the issuer field. Add an entry manually with name "Alpha", issuer "Acme"
      and secret JBSWY3DPEHPK3PXP, then look at the entry in the list (or open it). It
      should show the issuer Acme. If the issuer is missing, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
