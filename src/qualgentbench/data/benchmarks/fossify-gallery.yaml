                        } else {
                            qgbParked.countDown()
                            qgbRelease.await()
                        }
                    }
                })
                qgbParked.await()
                org.fossify.gallery.QgbFlags.fired("favorites-selection-off-main-thread")
                try {
                    body()
                } finally {
                    qgbRelease.countDown()
                }
            } else {
                activity.runOnUiThread { body() }
            }
        }
        qgbApply {

  # ANR — confirming the deletion of SEVERAL selected photos parks the main thread on a
  # latch whose countDown is posted to the main Looper it just parked: a permanent,
  # timing-free deadlock inside the dialog's click handler. Nothing is deleted, and the
  # next touch goes unanswered, so Android raises the ANR itself (~5 s later).
  - id: bulk-delete-blocks-main-thread
    title: Deleting several photos at once freezes the app
    patch:
      file: app/src/main/kotlin/org/fossify/gallery/adapters/MediaAdapter.kt
      find: |-
        config.tempSkipRecycleBin = skipRecycleBin
        }

        deleteFiles(skipRecycleBin)
      replace: |-
        config.tempSkipRecycleBin = skipRecycleBin
        }

        // BUG(bulk-delete-blocks-main-thread): the main thread waits on work posted to itself.
        if (selectedKeys.size > 1 && org.fossify.gallery.QgbFlags.on("bulk-delete-blocks-main-thread")) {
            org.fossify.gallery.QgbFlags.fired("bulk-delete-blocks-main-thread")
            val qgbLatch = java.util.concurrent.CountDownLatch(1)
            android.os.Handler(android.os.Looper.getMainLooper()).post { qgbLatch.countDown() }
            qgbLatch.await()
        }
        deleteFiles(skipRecycleBin)

