      find: |-
        name = dirName,
        mediaCnt = curMedia.size,
      replace: |-
        name = dirName,
        // BUG(folder-count-off-by-one): the stored count is one short.
        mediaCnt = if (org.fossify.gallery.QgbFlags.on("folder-count-off-by-one")) curMedia.size - 1 else curMedia.size,

  # L2 — "Add to favorites" never writes the row; the next refresh shows it unmarked.
