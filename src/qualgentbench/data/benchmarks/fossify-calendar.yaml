  # hierarchy saves and restores it without the activity's help; losing it would take a
  # patch that reaches in and clears the field after the restore, which is a fiction
  # rather than a lifecycle fault. The reminder is the opposite trap: `gotEvent` re-reads
  # `mReminder1Minutes` from config for a NEW event, and it runs AFTER
  # `onRestoreInstanceState` because it is posted to the main thread from a background DB
