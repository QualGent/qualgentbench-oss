      # file. TaskActivity.kt:282 has its own copy, which build_app.py never sees because
      # an anchor names a file.
      find: |-
        putInt(REPEAT_INTERVAL, mRepeatInterval)
      # `fired()` on the line BEFORE the fault, per the attribution-canary rule. Here the
      # fault IS the omission, so the marker is written in the branch that skips the put.
      # It is a synchronous File.createNewFile inside onSaveInstanceState; this build
      # installs no StrictMode, and the same call already rides the UI thread in
      # `view-switch-stuck-on-year`.
      replace: |-
