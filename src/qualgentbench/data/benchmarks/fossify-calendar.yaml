  # CRASH — saving an all-day event kills the app.
  #
  # THE FAULT. `EventActivity.getStartEndTimes` stores an all-day event's end as NOON of
  # its last day (`withTimeAtStartOfDay().withHourOfDay(12)`). The patch "fixes" that to
  # the END of the day, spelled the way people say it — 24:00. Joda-Time has no hour 24:
  # `withHourOfDay(24)` throws `org.joda.time.IllegalFieldValueException: Value 24 for
  # hourOfDay must be in the range [0,23]`, whatever the date, the zone or the time of
  # day. The all-day branch runs only when the event IS all-day, so a timed event saves
  # exactly as before; the route switches All-day on, and Save is what reads it.
  #
  # WHERE IT FIRES. `saveEvent` runs on a background thread (`saveCurrentEvent` →
  # ensureBackgroundThread) and reads the times before it writes anything, so the
  # process dies and nothing is saved. The same helper also runs from the back-press
  # "unsaved changes" check (`isEventChanged`), so leaving an all-day editor with Back
  # dies the same way under this flag; no case drives that path with it on.
  - id: all-day-save-crash
    title: Saving an all-day event kills the app
    patch:
      file: app/src/main/kotlin/org/fossify/calendar/activities/EventActivity.kt
      # One line: `withHourOfDay(12)` occurs once in this file.
      find: |-
        val newEndTS = mEventEndDateTime.withTimeAtStartOfDay().withHourOfDay(12).seconds()
      replace: |-
        // BUG(all-day-save-crash): an all-day event now ends at 24:00 of its last day —
        // an hour Joda-Time refuses (IllegalFieldValueException), so the save dies.
        val qgbEndOfDay = org.fossify.calendar.QgbFlags.on("all-day-save-crash")
        if (qgbEndOfDay) org.fossify.calendar.QgbFlags.fired("all-day-save-crash")
        val newEndTS = mEventEndDateTime.withTimeAtStartOfDay().withHourOfDay(if (qgbEndOfDay) 24 else 12).seconds()

