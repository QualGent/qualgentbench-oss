  # reminder across a rotation, and seeding there would derive as broken on BOTH arms.
  # `gotEvent` never assigns `mRepeatInterval`, so the repetition is touched by neither
  # path: the clean build carries it across the recreate and the seeded build is the only
  # one that does not. Confirmed on device BEFORE the patch was written — Weekly survived
  # a rotation on the unpatched build and the saved event drew on four following Sundays.
  #
