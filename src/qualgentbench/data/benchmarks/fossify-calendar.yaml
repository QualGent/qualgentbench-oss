  # not one of them asks whether an agent thinks to ROTATE or background the app before
  # it trusts a form. No exploration feature, like the two typos, the search crash and
  # the view switch above, so hunt mode never activates it.
  #
  # THE FAULT. `onSaveInstanceState` is the ONLY place the in-progress editor's
  # repetition is written down: the repetition row is a MyTextView, which saves no text
  # of its own, and `mRepeatInterval` is a plain field on an activity Android is about to
  # destroy. Drop that one `putInt` and `onRestoreInstanceState`'s
  # `getInt(REPEAT_INTERVAL)` returns the Bundle's default 0, so the recreated editor
  # believes the user asked for "No repetition", draws that, and `saveEvent`'s
  # `repeatInterval = mRepeatInterval` (EventActivity.kt:1687) stores it. Same statements,
  # same order, one key missing from a Bundle.
