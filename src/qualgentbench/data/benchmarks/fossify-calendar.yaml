        // saved instance state, so the recreated editor restores it as "No repetition".
        if (org.fossify.calendar.QgbFlags.on("repeat-lost-on-rotation")) {
            org.fossify.calendar.QgbFlags.fired("repeat-lost-on-rotation")
        } else {
            putInt(REPEAT_INTERVAL, mRepeatInterval)
        }

