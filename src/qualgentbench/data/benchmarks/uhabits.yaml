# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Loop Habit Tracker (github.com/iSoron/uhabits) — seeded-bug benchmark app.
# MEDIUM tier: 4 bugs + 2 working controls.
#
# Fills Medium slot 8 after the three planned candidates (voice-recorder, draw, camera)
# were each smoked on-device and rejected .
# New domain for the corpus: habit tracking. Medium is otherwise three text apps, a
# clock, loyalty cards, a QR tool and a music player.
#
# Storage: plain SQLite at databases/uhabits.db (rollback journal, NOT WAL) —
#   Habits(id, name, archived, position, …), Repetitions(id, habit, timestamp, value).
# Screened: no SQLCipher, no network permission, no storage permission, no sensors.
#
# WHY THE PATCHES LIVE IN uhabits-android AND NOT IN THE COMMANDS.
# The obvious patch sites are the four single-purpose commands in uhabits-core
# (ArchiveHabitsCommand / DeleteHabitsCommand / EditHabitCommand / CreateRepetitionCommand).
# They are unusable: uhabits-core is a Kotlin Multiplatform module targeting jvm AND js,
# so its commonMain cannot reference java.io.File — the generated QgbFlags shim would not
# compile for the JS target. Every patch below therefore sits at the app-module UI entry
# point that triggers the command. Each is still single-purpose, so one fix cannot repair
# another, and each was confirmed reachable on a real device before being written.

app:
  id: uhabits
  name: Loop Habit Tracker
  package: org.isoron.uhabits            # no debug suffix — debug build keeps the id
  platform: android
  difficulty: medium

apk:
  repo: qualgent/qualgentbench-apps
  filename: medium/uhabits-buggy.apk
  sha256: 2ad26aaad6a11d97be9fc0f6c541bd3effde7749c800a2b10384b9f02c392eb0
  size_bytes: 28812399

build:
  repo: https://github.com/iSoron/uhabits
  dir: uhabits
  ref: "v2.3.1"                          # latest per `git tag --sort=-v:refname`
  gradle_task: ":uhabits-android:assembleDebug"
  apk_glob: "uhabits-android/build/outputs/apk/debug/*.apk"
  # `build_app.py --demo-fired` anchor (QUA-3456): a line every launch runs, after which
  # one throwaway QgbFlags.fired("demo") call is inserted to prove the canary round trip.
  demo_fired:
    file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsActivity.kt
    find: "super.onCreate(savedInstanceState)"

flags:
  file: uhabits-android/src/main/java/org/isoron/uhabits/QgbFlags.kt
  package: org.isoron.uhabits

# Staged before every episode (after pm clear, before launch).
#
# Without this the app opens a 3-page AppIntro carousel on EVERY episode, because
# `pm clear` wipes the pref that records it was seen. The intro is gated purely on
# `pref_first_run` (Preferences.kt:122-125), so pre-writing the default SharedPreferences
# file skips it and the agent lands straight on the habit list. Verified on device:
# topResumedActivity goes from .activities.intro.IntroActivity to .MainActivity.
# This is the same principle as normalize_app_env()'s permission pre-granting — the
# benchmark measures QA skill, not onboarding-carousel navigation.
device_setup:
  push:
    - {src: assets/prefs/uhabits-first-run.xml, dest: /sdcard/qgb-uhabits-prefs.xml}
  shell:
    - "run-as org.isoron.uhabits mkdir -p shared_prefs"
    - "cat /sdcard/qgb-uhabits-prefs.xml | run-as org.isoron.uhabits sh -c 'cat > shared_prefs/org.isoron.uhabits_preferences.xml'"

exploration:
  id: explore-uhabits
  step_budget: 500
  title: "Release sign-off \u2014 Habits"
  # HARNESS-ONLY (truth.setup_of): Loop opens on an intro carousel and starts with no
  # habits, so every area needs one. Runs on the CLEAN build.
  # Not `device_setup` — the agent still does all of this; see birday.
  # NO `SKIP` step: `device_setup` above pushes a prefs file that marks the intro
  # already-seen, so the carousel never appears and tapping SKIP aborts the app.
  # derive_truth runs device_setup for the same reason the episode runner does.
  check_setup:
    steps: [wait, {tap: "Add habit"}, {tap: "Yes or No"},
            {tap: "e.g. Exercise"}, {type: "QASEED"}, {tap: "SAVE"}]
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py).
    - id: create_habit
      state: ok
      probe: [habit]
      check:
        steps: [launch, {tap: "Add habit"}, {tap: "Yes or No"}, {tap: "e.g. Exercise"},
                {type: "QAADD"}, {tap: "SAVE"}]
        expect: {db: uhabits.db, equals: "1",
                 query: "select count(*) from Habits where name='QAADD';"}
    - id: habit_list
      state: ok
      probe: [habit]
      check:
        steps: [launch, relaunch]
        expect: {present: "QASEED"}
    - id: habit_detail
      state: ok
      probe: [habit]
      check:
        # `Overview` exists only on the detail screen, so this cannot hold from the
        # list — unlike asserting the habit's own name, which is on both.
        steps: [launch, {tap: "QASEED"}]
        expect: {present: "Overview"}
    - id: settings
      state: ok
      probe: [settings]
      check:
        steps: [launch, {tap: "More options"}, {tap: "Settings"}]
        expect: {present: "Reverse order of days"}
    - id: archive_habit
      state: broken
      bug_id: archive-not-archived
      probe: [habit, archive]
      check:
        # Same chain as delete_habit, so the same waits — it was stable across two
        # passes, but it is exposed to the identical mid-animation tap.
        steps: [launch, {long_press: "QASEED"}, wait, {tap: "More options"}, wait,
                {tap: "Archive"}]
        expect: {db: uhabits.db, equals: "1",
                 query: "select archived from Habits where name='QASEED';"}
    - id: delete_habit
      state: broken
      bug_id: delete-not-deleted
      probe: [habit, delete]
      check:
        # `wait` after every step that opens something. Measured flake: this check
        # derived `broken` on one pass and `undecidable` on the next (--repeat 2), so
        # one of the three chained openings — action mode, the overflow popup, the
        # confirm dialog — was being tapped mid-animation.
        steps: [launch, {long_press: "QASEED"}, wait, {tap: "More options"}, wait,
                {tap: "Delete"}, wait, {tap: "YES"}]
        expect: {db: uhabits.db, equals: "0",
                 query: "select count(*) from Habits where name='QASEED';"}
    - id: rename_habit
      state: broken
      bug_id: rename-not-saved
      probe: [habit, rename]
      check:
        # `like '%REN%'` — the field arrives pre-filled, so append vs replace does not
        # change the verdict.
        steps: [launch, {long_press: "QASEED"}, {tap: "Edit"}, {tap: "QASEED"},
                {type: "REN"}, {tap: "SAVE"}]
        expect: {db: uhabits.db, equals: "1",
                 query: "select count(*) from Habits where name like '%REN%';"}
    # NO CHECK. The checkmark panel is a custom Canvas view: on the list row AND on the
    # detail screen it produces no accessibility node at all, so there is nothing for a
    # `tap` anchor — text, content-desc or resource-id — to find. Reaching it needs raw
    # coordinates, which specs deliberately do not carry.
    - id: check_off_day
      state: broken
      bug_id: checkmark-wrong-day
      probe: [habit]
  instruction: |
    You are a QA engineer. This build of a habit-tracking app has been handed to you
    for release sign-off. The list below is what the product team says each area should
    do. Verify them on the device and report what you actually observe.

    Habits are created with the + button; the ⋮ menu on a habit holds its actions.

    SPECIFICATION
      - create_habit: a habit you create is listed afterwards.
      - habit_list: the list shows the habits that exist.
      - habit_detail: a habit's details are what was entered for it.
      - settings: settings screens open and the chosen options are what stays selected.
      - archive_habit: a habit you archive stays archived.
      - delete_habit: a habit you delete is no longer listed.
      - rename_habit: a habit's name after renaming is the name you entered.
      - check_off_day: a day you mark done is the day recorded as done.

bugs:
  # L2 — the Archive action is accepted but the habit stays in the active list.
  - id: archive-not-archived
    title: Archiving a habit does nothing
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsSelectionMenu.kt
      find: |-
        R.id.action_archive_habit -> {
                        behavior.onArchiveHabits()
                        return true
                    }
      replace: |-
        R.id.action_archive_habit -> {
                        // BUG(archive-not-archived): the habit is never archived.
                        if (org.isoron.uhabits.QgbFlags.on("archive-not-archived")) return true
                        behavior.onArchiveHabits()
                        return true
                    }

  # L3 — the delete CONFIRMATION dialog appears and dismisses exactly as normal, so the
  # flow looks successful; only the row is never removed. Patched at the screen rather
  # than at the menu item so the dialog still shows — a Delete button that does literally
  # nothing would be obvious on the first tap.
  - id: delete-not-deleted
    title: Deleting a habit does not remove it
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsScreen.kt
      find: |-
        override fun showDeleteConfirmationScreen(callback: OnConfirmedCallback, quantity: Int) {
                ConfirmDeleteDialog(activity, callback, quantity).dismissCurrentAndShow()
            }
      replace: |-
        override fun showDeleteConfirmationScreen(callback: OnConfirmedCallback, quantity: Int) {
                // BUG(delete-not-deleted): the confirmation runs normally but the callback
                // that actually deletes is swallowed.
                if (org.isoron.uhabits.QgbFlags.on("delete-not-deleted")) {
                    ConfirmDeleteDialog(activity, OnConfirmedCallback { }, quantity).dismissCurrentAndShow()
                    return
                }
                ConfirmDeleteDialog(activity, callback, quantity).dismissCurrentAndShow()
            }

  # L3 — the edit screen saves and closes, but the habit keeps its old name.
  # Gated on `command is EditHabitCommand` so CreateHabitCommand is untouched: both
  # controls create habits and would otherwise lose their oracle.
  - id: rename-not-saved
    title: Renaming a habit does not save
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/edit/EditHabitActivity.kt
      find: |-
        component.commandRunner.run(command)
                finish()
      replace: |-
        // BUG(rename-not-saved): edits to an existing habit are dropped. Creating a new
                // habit still runs, so the clean tasks keep working.
                if (org.isoron.uhabits.QgbFlags.on("rename-not-saved") && command is EditHabitCommand) {
                    org.isoron.uhabits.QgbFlags.fired("rename-not-saved")
                } else {
                    component.commandRunner.run(command)
                }
                finish()

  # L3 — checking off a day records the PREVIOUS day instead. Subtle on purpose: something
  # does get marked, so the only way to catch it is to check WHICH column changed.
  #
  # BOTH lambdas of the checkmark panel are patched in one block, deliberately. A tap on a
  # checkmark does NOT go through `onToggle`: it opens a small ✓/✗ popup, which is the
  # `onEdit` path. An earlier version of this bug patched only `onToggle`, built and
  # injected cleanly, and was completely dead — reproduced by hand with the flag on and the
  # entry still landed on the correct day. The whole `checkmarkPanelFactory` block is the
  # anchor because the patcher replaces only the FIRST match and the two panels
  # (checkmark / number) have byte-identical `onEdit` lambdas.
  - id: checkmark-wrong-day
    title: Marking a habit done records the wrong day
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/views/HabitCardView.kt
      find: |-
        checkmarkPanel = checkmarkPanelFactory.create().apply {
                    onToggle = { timestamp, value, notes ->
                        triggerRipple(timestamp)
                        val location = getAbsoluteButtonLocation(timestamp)
                        habit?.let {
                            behavior.onToggle(
                                it,
                                timestamp,
                                value,
                                notes,
                                location.x,
                                location.y
                            )
                        }
                    }
                    onEdit = { timestamp ->
                        triggerRipple(timestamp)
                        val location = getAbsoluteButtonLocation(timestamp)
                        habit?.let { behavior.onEdit(it, timestamp, location.x, location.y) }
                    }
      replace: |-
        checkmarkPanel = checkmarkPanelFactory.create().apply {
                    onToggle = { timestamp, value, notes ->
                        triggerRipple(timestamp)
                        val location = getAbsoluteButtonLocation(timestamp)
                        habit?.let {
                            // BUG(checkmark-wrong-day): the entry lands on the day before
                            // the one that was tapped.
                            val qgbWhen = if (org.isoron.uhabits.QgbFlags.on("checkmark-wrong-day")) {
                                timestamp.minus(1)
                            } else {
                                timestamp
                            }
                            behavior.onToggle(
                                it,
                                qgbWhen,
                                value,
                                notes,
                                location.x,
                                location.y
                            )
                        }
                    }
                    onEdit = { timestamp ->
                        triggerRipple(timestamp)
                        val location = getAbsoluteButtonLocation(timestamp)
                        // BUG(checkmark-wrong-day): same skew on the ✓/✗ popup path, which
                        // is what a plain tap on a checkmark actually uses.
                        val qgbWhen = if (org.isoron.uhabits.QgbFlags.on("checkmark-wrong-day")) {
                            timestamp.minus(1)
                        } else {
                            timestamp
                        }
                        habit?.let { behavior.onEdit(it, qgbWhen, location.x, location.y) }
                    }

  # ── Journey-only defects (QUA-3456, epic QUA-3449) ─────────────────────────────────
  # Twelve journey cases seed these to the app's class quota (crash 3 / display 4 /
  # persistence 1 / navigation 2 / lifecycle 1 / ordering 1 / ANR 0); the persistence
  # slot reuses `rename-not-saved` above. No exploration feature names them, so hunt and
  # guided mode never switch them on; each still needs its `tasks:` entry below. Every
  # patch sits in uhabits-android (the KMP core cannot see QgbFlags) and calls
  # QgbFlags.fired("<id>") on the line BEFORE its fault, and only when the defect's
  # effect actually happens (canary proof: build_app.py --buggy --demo-fired --smoke).

  # CRASH — saving a measurable habit whose target has a decimal part. The target is
  # parsed as a whole number, so "2.5" throws NumberFormatException on the main thread
  # before the habit is created.
  - id: measurable-target-decimal-crash
    title: Saving a measurable habit with a decimal target crashes the app
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/edit/EditHabitActivity.kt
      find: |-
        habit.targetValue = binding.targetInput.text.toString().toDouble()
      replace: |-
        val qgbTarget = binding.targetInput.text.toString()
        if (org.isoron.uhabits.QgbFlags.on("measurable-target-decimal-crash") && qgbTarget.contains('.')) {
            org.isoron.uhabits.QgbFlags.fired("measurable-target-decimal-crash")
            // BUG(measurable-target-decimal-crash): the target is parsed as a whole number.
            habit.targetValue = qgbTarget.toInt().toDouble()
        }
        habit.targetValue = qgbTarget.toDouble()

  # CRASH — Unarchive in the list's selection menu. The lookup's predicate is inverted
  # (the first selected habit that is NOT archived), and a selection of archived habits
  # has none, so first {} throws NoSuchElementException before anything is unarchived.
  - id: unarchive-crash
    title: Unarchiving a habit crashes the app
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsSelectionMenu.kt
      find: |-
        R.id.action_unarchive_habit -> {
            behavior.onUnarchiveHabits()
      replace: |-
        R.id.action_unarchive_habit -> {
            if (org.isoron.uhabits.QgbFlags.on("unarchive-crash") && listAdapter.selected.none { !it.isArchived }) {
                org.isoron.uhabits.QgbFlags.fired("unarchive-crash")
                // BUG(unarchive-crash): the predicate is inverted; no selected habit matches it.
                listAdapter.selected.first { !it.isArchived }
            }
            behavior.onUnarchiveHabits()

  # CRASH — Change color from the list's selection menu. The picked swatch is looked up
  # in a palette one entry short, so the pick throws ArrayIndexOutOfBoundsException
  # before the color command runs. The edit screen's own color button uses another
  # picker path and is untouched.
  - id: color-pick-crash
    title: Changing a habit's color from the list crashes the app
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsScreen.kt
      find: |-
        val picker = colorPickerFactory.create(defaultColor, themeSwitcher.currentTheme!!)
        picker.setListener(callback)
      replace: |-
        val picker = colorPickerFactory.create(defaultColor, themeSwitcher.currentTheme!!)
        picker.setListener { qgbColor ->
            if (org.isoron.uhabits.QgbFlags.on("color-pick-crash")) {
                org.isoron.uhabits.QgbFlags.fired("color-pick-crash")
                // BUG(color-pick-crash): the palette lookup table is one entry short.
                val qgbPalette = IntArray(qgbColor.paletteIndex)
                qgbPalette[qgbColor.paletteIndex] = 0
            }
            callback.onColorPicked(qgbColor)
        }

  # DISPLAY (content-format) — the habit screen's frequency line under-counts an
  # "N times per week" habit by one ("2 times per week" for a stored 3/7). The stored
  # frequency and the edit screen are right; only the habit screen's label is wrong.
  - id: frequency-label-off-by-one
    title: The habit screen shows one time per week fewer than the habit's frequency
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/show/views/SubtitleCardView.kt
      find: |-
        binding.frequencyLabel.text = formatFrequency(
            state.frequency.numerator,
      replace: |-
        // BUG(frequency-label-off-by-one): a weekly count is drawn one lower than stored.
        val qgbNum = if (org.isoron.uhabits.QgbFlags.on("frequency-label-off-by-one") && state.frequency.denominator == 7 && state.frequency.numerator > 1) {
            org.isoron.uhabits.QgbFlags.fired("frequency-label-off-by-one")
            state.frequency.numerator - 1
        } else {
            state.frequency.numerator
        }
        binding.frequencyLabel.text = formatFrequency(
            qgbNum,

  # DISPLAY (content-format) — the habit screen's reminder line draws the reminder one
  # hour late ("9:00 AM" for a stored 8:00). The stored reminder and the edit screen
  # are right.
  - id: reminder-label-hour-late
    title: The habit screen shows the reminder an hour later than it is set
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/show/views/SubtitleCardView.kt
      find: |-
        formatTime(context, reminder.hour, reminder.minute)
      replace: |-
        // BUG(reminder-label-hour-late): the drawn hour is one past the stored one.
        if (org.isoron.uhabits.QgbFlags.on("reminder-label-hour-late") && reminder.hour < 23) {
            org.isoron.uhabits.QgbFlags.fired("reminder-label-hour-late")
            formatTime(context, reminder.hour + 1, reminder.minute)
        } else {
            formatTime(context, reminder.hour, reminder.minute)
        }

  # DISPLAY (widget-inventory) — the selection menu offers Unarchive for a habit that is
  # not archived (an EXTRA control next to Archive).
  - id: unarchive-offered-for-active
    title: The selection menu offers Unarchive for an active habit
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsSelectionMenu.kt
      find: |-
        itemUnarchive.isVisible = behavior.canUnarchive()
      replace: |-
        // BUG(unarchive-offered-for-active): Unarchive is shown whatever the selection holds.
        val qgbCanUnarchive = behavior.canUnarchive()
        if (!qgbCanUnarchive && org.isoron.uhabits.QgbFlags.on("unarchive-offered-for-active")) org.isoron.uhabits.QgbFlags.fired("unarchive-offered-for-active")
        itemUnarchive.isVisible = qgbCanUnarchive || org.isoron.uhabits.QgbFlags.on("unarchive-offered-for-active")

  # DISPLAY (content-format) — a measurable habit's target loses its decimal point on
  # the habit screen ("75 mi" for a stored 7.5 mi). The stored target is right.
  - id: target-decimal-dropped
    title: The habit screen drops the decimal point from a measurable target
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/show/views/SubtitleCardView.kt
      find: |-
        binding.targetText.text = "${state.targetValue.toShortString()} ${state.unit}"
      replace: |-
        // BUG(target-decimal-dropped): the decimal separator is stripped from the target.
        val qgbTarget = state.targetValue.toShortString()
        val qgbShown = if (org.isoron.uhabits.QgbFlags.on("target-decimal-dropped") && qgbTarget.contains('.')) {
            org.isoron.uhabits.QgbFlags.fired("target-decimal-dropped")
            qgbTarget.replace(".", "")
        } else {
            qgbTarget
        }
        binding.targetText.text = "$qgbShown ${state.unit}"

  # NAVIGATION — tapping any habit but the first in the list opens the FIRST habit's
  # screen. The route deletes from the screen it lands on, so the db oracle reads which
  # habit the destination was.
  - id: card-opens-first-habit
    title: Tapping a habit opens the first habit in the list instead
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/views/HabitCardListController.kt
      find: |-
        override fun onItemClick(position: Int) {
            val habit = adapter.getItem(position) ?: return
      replace: |-
        override fun onItemClick(position: Int) {
            // BUG(card-opens-first-habit): the clicked row is ignored for every row but the first.
            val qgbPosition = if (org.isoron.uhabits.QgbFlags.on("card-opens-first-habit") && position > 0) {
                org.isoron.uhabits.QgbFlags.fired("card-opens-first-habit")
                0
            } else {
                position
            }
            val habit = adapter.getItem(qgbPosition) ?: return

  # NAVIGATION — Edit on the habit screen opens a blank "Create habit" screen instead of
  # the habit's edit screen, so saving creates a second habit and the original keeps
  # its name. The db oracle reads both names.
  - id: detail-edit-opens-create
    title: Edit on the habit screen opens the create-habit screen
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/show/ShowHabitActivity.kt
      find: |-
        startActivity(IntentFactory().startEditActivity(this@ShowHabitActivity, habit))
      replace: |-
        // BUG(detail-edit-opens-create): the create screen is started instead of the edit screen.
        if (org.isoron.uhabits.QgbFlags.on("detail-edit-opens-create")) {
            org.isoron.uhabits.QgbFlags.fired("detail-edit-opens-create")
            startActivity(IntentFactory().startEditActivity(this@ShowHabitActivity, habit.type.value))
        } else {
            startActivity(IntentFactory().startEditActivity(this@ShowHabitActivity, habit))
        }

  # LIFECYCLE — the edit screen's saved state drops the frequency picked in the dialog,
  # so rotating the screen before Save resets it to Every day. Nothing is lost while
  # the screen is not recreated; only the route's `rotate` fires it.
  - id: frequency-lost-on-rotation
    title: A frequency picked on the edit screen is lost when the phone is rotated
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/edit/EditHabitActivity.kt
      find: |-
        freqNum = state.getInt("freqNum")
        freqDen = state.getInt("freqDen")
      replace: |-
        // BUG(frequency-lost-on-rotation): the restored frequency is discarded.
        if (org.isoron.uhabits.QgbFlags.on("frequency-lost-on-rotation") && (state.getInt("freqNum") != freqNum || state.getInt("freqDen") != freqDen)) {
            org.isoron.uhabits.QgbFlags.fired("frequency-lost-on-rotation")
        } else {
            freqNum = state.getInt("freqNum")
            freqDen = state.getInt("freqDen")
        }

  # ORDERING — the delete confirmation runs its work (drop the row, start the delete,
  # close the selection) on a background thread instead of the main thread that
  # delivered the click. A bare off-main run is NOT a deterministic crash (CLAUDE.md,
  # the cal-search-event 6/10 lesson: Android's checkThread is reached only through a
  # requestLayout walk that stops at the first ancestor already owing a layout), so the
  # order that makes Android CHECK is forced too, with fossify-gallery's
  # `favorites-selection-off-main-thread` shape: the worker posts a hand-off to the main
  # looper, which re-posts itself until the window owes no layout pass, then parks the
  # main thread on a latch while the confirmation runs on the worker. No sleep, no
  # timeout; the `finally` un-parks the main thread if nothing threw. Applied after
  # `delete-not-deleted`, whose patch starts at the same signature line.
  - id: delete-confirm-off-main-thread
    title: Confirming a habit deletion crashes the app
    patch:
      file: uhabits-android/src/main/java/org/isoron/uhabits/activities/habits/list/ListHabitsScreen.kt
      find: |-
        override fun showDeleteConfirmationScreen(callback: OnConfirmedCallback, quantity: Int) {
      replace: |-
        override fun showDeleteConfirmationScreen(qgbOriginal: OnConfirmedCallback, quantity: Int) {
            // BUG(delete-confirm-off-main-thread): the confirmation is RUN on a worker thread
            // instead of the main thread, with the main thread parked where it owes no layout
            // pass, so Android's thread check is reached every time. Ordering only.
            val callback = if (!org.isoron.uhabits.QgbFlags.on("delete-confirm-off-main-thread")) qgbOriginal else OnConfirmedCallback {
                Thread {
                    val qgbParked = java.util.concurrent.CountDownLatch(1)
                    val qgbRelease = java.util.concurrent.CountDownLatch(1)
                    activity.runOnUiThread(object : Runnable {
                        override fun run() {
                            val qgbRoot = activity.window.decorView
                            if (qgbRoot.isLayoutRequested || qgbRoot.parent?.isLayoutRequested == true) {
                                qgbRoot.post(this)
                            } else {
                                qgbParked.countDown()
                                qgbRelease.await()
                            }
                        }
                    })
                    qgbParked.await()
                    org.isoron.uhabits.QgbFlags.fired("delete-confirm-off-main-thread")
                    try {
                        qgbOriginal.onConfirmed()
                    } finally {
                        qgbRelease.countDown()
                    }
                }.start()
            }

