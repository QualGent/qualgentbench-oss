# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Privacy Friendly Food Tracker (github.com/SecUSo/privacy-friendly-food-tracker)
# MEDIUM tier: 4 bugs + 2 working controls.
#
# A food diary: products (name + energy) and consumed entries (product, amount, date).
# Every bug is a single-site mutation in the app's own service layer (DatabaseFacade),
# never in the shared Room DAO, so one fix cannot repair another.
#
# Storage: Room databases/consumed_entries_database, tables `consumedEntries`
# (name, amount, date, productId) and `product` (name, energy, barcode).
#
# Java app with the kotlin-android plugin applied → the generated Kotlin shim compiles
# and is callable from Java via @JvmStatic.
#
# The INSERT paths are left intact so both controls have an oracle; the bugs corrupt the
# stored amount, drop edits, no-op deletes, and mis-total the day.

# ⚠ EXCLUDED FROM THE CORPUS — `internal: true` keeps it out of load_apps().
# The app encrypts its Room database with SQLCipher, so no host-side oracle can read it
# and its CONTROLS can never pass (its 4 bugs were all found — bug tasks are self-report
# + anchor and never touch the DB, which is why this survived to a full run). Kept as the
# worked example behind the SQLCipher screening rule in docs/prune-plan.md.
app:
  id: pf-food-tracker
  name: Privacy Friendly Food Tracker
  package: org.secuso.privacyfriendlyfoodtracker
  platform: android
  difficulty: medium
  internal: true

build:
  repo: https://github.com/SecUSo/privacy-friendly-food-tracker
  dir: pf-food-tracker
  ref: "v1.2.3"                            # latest per `git tag --sort=-v:refname`
  gradle_task: ":app:assembleDebug"
  apk_glob: "app/build/outputs/apk/debug/*.apk"

flags:
  file: app/src/main/java/org/secuso/privacyfriendlyfoodtracker/QgbFlags.kt
  package: org.secuso.privacyfriendlyfoodtracker

exploration:
  id: explore-pf-food-tracker
  step_budget: 174
  title: Find as many bugs as you can
  features:
    - {id: add_entry,     state: ok}
    - {id: add_product,   state: ok}
    - {id: entry_amount,  state: broken, bug_id: amount-off-by-one}
    - {id: edit_entry,    state: broken, bug_id: edit-not-saved}
    - {id: delete_entry,  state: broken, bug_id: delete-broken}
    - {id: entry_day,     state: broken, bug_id: entry-wrong-day}
  instruction: |
    You are a senior QA tester. Test this food-diary app feature by feature and decide,
    for EACH feature, whether it works correctly or is BROKEN. You have NOT been told what
    is wrong — determine it yourself by actually operating the app. Some problems only show
    after you leave a screen and come back.

    Test every one of these features:
      - add_entry: add a food entry for today; confirm it appears in the day's list.
      - add_product: create a product with a name and calorie value; confirm it is saved.
      - entry_amount: add an entry with an amount of 2; confirm the list shows 2.
      - edit_entry: change an existing entry's amount and confirm the new amount sticks.
      - delete_entry: delete an entry and confirm it is gone after reopening the day.
      - entry_day: add an entry for today and confirm it appears under TODAY's date (not
        another day).

    For each bug, also write a "BUG:" line describing what went wrong (for humans).

    THEN finish your report with EXACTLY ONE line in this machine-readable format,
    a verdict for EVERY feature (use only "ok" or "broken"):

    RESULT: add_entry=<ok|broken>, add_product=<ok|broken>, entry_amount=<ok|broken>, edit_entry=<ok|broken>, delete_entry=<ok|broken>, entry_day=<ok|broken>

    Include your BUG: lines and the RESULT: line in your final message.

bugs:
  # L2 — the entry is stored with one more than the user entered. The controls assert the
  # NAME column, so they are unaffected by this.
  - id: amount-off-by-one
    title: The saved amount is one higher than entered
    patch:
      file: app/src/main/java/org/secuso/privacyfriendlyfoodtracker/ui/adapter/DatabaseFacade.java
      find: |-
        consumedEntriesDao.insert(new ConsumedEntries(0, amount, new java.sql.Date(date.getTime()), name, existingProductId));
      replace: |-
        // BUG(amount-off-by-one): stores one more than the user typed.
        final int qgbAmount = org.secuso.privacyfriendlyfoodtracker.QgbFlags.on("amount-off-by-one") ? amount + 1 : amount;
        consumedEntriesDao.insert(new ConsumedEntries(0, qgbAmount, new java.sql.Date(date.getTime()), name, existingProductId));

  # L3 — the edit screen closes as if saved; the row keeps its old amount.
  - id: edit-not-saved
    title: Editing an entry's amount does not save
    patch:
      file: app/src/main/java/org/secuso/privacyfriendlyfoodtracker/ui/adapter/DatabaseFacade.java
      find: |-
        ConsumedEntries consumedEntry = res.get(0);
        consumedEntry.amount = amount;
        consumedEntriesDao.update(res.get(0));
      replace: |-
        ConsumedEntries consumedEntry = res.get(0);
        // BUG(edit-not-saved): the new amount is never written back.
        if (!org.secuso.privacyfriendlyfoodtracker.QgbFlags.on("edit-not-saved")) {
            consumedEntry.amount = amount;
            consumedEntriesDao.update(res.get(0));
        }

  # L2 — delete removes the row from the list but never from the database.
  - id: delete-broken
    title: Deleting an entry does not remove it
    patch:
      file: app/src/main/java/org/secuso/privacyfriendlyfoodtracker/ui/adapter/DatabaseFacade.java
      find: |-
        consumedEntriesDao.delete(res.get(0));
      replace: |-
        // BUG(delete-broken): the entry row is never deleted.
        if (!org.secuso.privacyfriendlyfoodtracker.QgbFlags.on("delete-broken")) consumedEntriesDao.delete(res.get(0));

  # L3 — the entry is written to the WRONG DAY (one day later), so it vanishes from
  # today's list and silently turns up under tomorrow. State-dependent and only visible
  # by navigating between days — the shape a checklist tester misses.
  #
  # NOTE: this replaced a `daily-total-wrong` patch that tried to inflate the calorie
  # aggregate. That is a Room @Query STRING — a compile-time annotation constant — so it
  # cannot be gated by a runtime flag at all. Gate-ability is a constraint on where a bug
  # can live, not just on what it does.
  - id: entry-wrong-day
    title: A food entry is saved under the wrong day
    patch:
      file: app/src/main/java/org/secuso/privacyfriendlyfoodtracker/ui/adapter/DatabaseFacade.java
      find: |-
        // BUG(amount-off-by-one): stores one more than the user typed.
        final int qgbAmount = org.secuso.privacyfriendlyfoodtracker.QgbFlags.on("amount-off-by-one") ? amount + 1 : amount;
        consumedEntriesDao.insert(new ConsumedEntries(0, qgbAmount, new java.sql.Date(date.getTime()), name, existingProductId));
      replace: |-
        // BUG(amount-off-by-one): stores one more than the user typed.
        final int qgbAmount = org.secuso.privacyfriendlyfoodtracker.QgbFlags.on("amount-off-by-one") ? amount + 1 : amount;
        // BUG(entry-wrong-day): the entry is filed one day later than the user chose.
        final long qgbMillis = org.secuso.privacyfriendlyfoodtracker.QgbFlags.on("entry-wrong-day")
                ? date.getTime() + 86400000L : date.getTime();
        consumedEntriesDao.insert(new ConsumedEntries(0, qgbAmount, new java.sql.Date(qgbMillis), name, existingProductId));

tasks:
  - id: pf-food-amount
    bug_id: amount-off-by-one
    type: bug
    tier: L2
    ref_steps: 18
    title: The entered amount is saved
    expected_verdict: FAIL
    optimal_steps: 12
    step_budget: 44
    instruction: |
      Verify the amount field. Add a food entry with an amount/quantity of 2 and save it.
      Then look at the entry in the day's list. It should show 2. If the amount shown
      differs from what you entered, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: amount, screen_keywords: ["amount", "add"]}

  - id: pf-food-edit
    bug_id: edit-not-saved
    type: bug
    tier: L3
    ref_steps: 22
    title: Editing an entry persists
    expected_verdict: FAIL
    optimal_steps: 14
    step_budget: 51
    instruction: |
      Verify editing. Make sure at least one food entry exists for today (add one if
      needed), edit it and change its amount, save, then reopen the day. The entry should
      show the new amount. If it still shows the old amount, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: edit, screen_keywords: ["edit", "amount"]}

  - id: pf-food-delete
    bug_id: delete-broken
    type: bug
    tier: L2
    ref_steps: 20
    title: Deleting an entry removes it
    expected_verdict: FAIL
    optimal_steps: 12
    step_budget: 44
    instruction: |
      Verify deleting. Make sure at least one food entry exists for today (add one if
      needed), delete it, then reopen the day. It should be gone. If it is still listed,
      that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: delete, screen_keywords: ["delete", "remove"]}

  - id: pf-food-wrong-day
    bug_id: entry-wrong-day
    type: bug
    tier: L3
    ref_steps: 22
    title: An entry is filed under the day you chose
    expected_verdict: FAIL
    optimal_steps: 14
    step_budget: 51
    instruction: |
      Verify which day an entry is filed under. Add a food entry for TODAY, then look at
      today's list. The entry should be there. Also check the next day. If the entry is
      missing from today and appears on a different day, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: day, screen_keywords: ["today", "date"]}

  # ----- 2 clean tasks (expected PASS; db oracle) ------------------------------
  - id: pf-food-clean-add-entry
    type: clean
    title: Add a food entry named QAFOOD01
    expected_verdict: PASS
    optimal_steps: 12
    step_budget: 44
    instruction: |
      Add a new food entry for today named exactly QAFOOD01 (any calorie value and amount)
      and confirm it appears in the day's list.
    oracle:
      db: consumed_entries_database
      query: "select count(*) from consumedEntries where name='QAFOOD01';"
      expect: ">=1"

  - id: pf-food-clean-add-product
    type: clean
    title: Add a product named QAPROD01
    expected_verdict: PASS
    optimal_steps: 12
    step_budget: 44
    instruction: |
      Create a new product named exactly QAPROD01 with any calorie value, and confirm it
      is saved (it should be findable when adding an entry).
    oracle:
      db: consumed_entries_database
      query: "select count(*) from product where name='QAPROD01';"
      expect: ">=1"
