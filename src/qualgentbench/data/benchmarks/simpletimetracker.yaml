          fun onBackPressed() {
                  if (chooserState.value?.chooserState?.current !is ChangeRecordTypeChooserState.Closed) {
        replace: |-
          fun qgbOnViewRecreated() {
                  if (newDefaultDuration == 0L) return
                  val qgbOn = run {
                      val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                      try { com.example.util.simpletimetracker.domain.QgbFlags.on("default-duration-lost-on-rotation") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                  }
                  if (!qgbOn) return
                  run {
                      val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                      try { com.example.util.simpletimetracker.domain.QgbFlags.fired("default-duration-lost-on-rotation") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                  }
                  newDefaultDuration = 0
                  updateAdditionalState()
              }

              fun onBackPressed() {
                  if (chooserState.value?.chooserState?.current !is ChangeRecordTypeChooserState.Closed) {

  # LIFECYCLE — process death. A timer left running is a row in runningRecords, and the
  # clean app shows it again after the process is killed and the app reopened. Seeded,
  # the Timers screen's ViewModel, created once per process (it survives a rotation),
  # drops every running timer as it starts, without writing a record. On a launch with
  # no timer running nothing changes and the canary stays silent; only the route's
  # `relaunch` with a timer running reaches the effect.
  - id: running-timer-lost-on-restart
    title: A running timer disappears when the app is restarted
    patch:
      file: features/feature_running_records/src/main/java/com/example/util/simpletimetracker/feature_running_records/viewModel/RunningRecordsViewModel.kt
      find: |-
        init {
                subscribeToUpdates()
            }
      replace: |-
        init {
                // BUG(running-timer-lost-on-restart): timers running when the process started are dropped.
                val qgbDrop = run {
                    val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                    try { com.example.util.simpletimetracker.domain.QgbFlags.on("running-timer-lost-on-restart") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                }
                if (qgbDrop) {
                    viewModelScope.launch {
                        val qgbRunning = runningRecordInteractor.getAll()
                        if (qgbRunning.isNotEmpty()) {
                            val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                            try { com.example.util.simpletimetracker.domain.QgbFlags.fired("running-timer-lost-on-restart") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                            qgbRunning.forEach { runningRecordInteractor.remove(it.id) }
                            updateRunningRecords()
                        }
                    }
                }
                subscribeToUpdates()
            }

  # ORDERING — the "Name already used" error is applied to the name field from a worker
  # thread instead of the main thread. The order Android's own thread check needs is
  # FORCED, with fossify-gallery's `favorites-selection-off-main-thread` shape (itself
  # fossify-calendar's): the worker hands off to the main looper, the hand-off re-posts
  # itself until the window owes no layout pass, then parks the main thread on a latch
  # while the field update runs inline on the worker. TextInputLayout adds its error view
  # (addView -> requestLayout), the walk reaches ViewRootImpl.checkThread, and the worker
  # dies with CalledFromWrongThreadException every time. No sleep, no timeout; `finally`
  # un-parks the main thread. Clearing the error (an empty message) stays on the main
  # thread, so only a duplicate name reaches the seeded path.
  - id: name-error-off-main-thread
    title: Typing a name that is already used crashes the app
    patch:
      file: features/feature_change_record_type/src/main/java/com/example/util/simpletimetracker/feature_change_record_type/view/ChangeRecordTypeFragment.kt
      find: |-
        private fun updateNameErrorMessage(error: String) = with(binding) {
                inputChangeRecordTypeName.error = error
                inputChangeRecordTypeName.isErrorEnabled = error.isNotEmpty()
            }
      replace: |-
        private fun updateNameErrorMessage(error: String) {
                // BUG(name-error-off-main-thread): the error is applied on a worker thread, with the
                // main thread parked where it owes no layout pass. Ordering only.
                val qgbOffMain = error.isNotEmpty() && run {
                    val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                    try { com.example.util.simpletimetracker.domain.QgbFlags.on("name-error-off-main-thread") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                }
                if (!qgbOffMain) {
                    qgbApplyNameError(error)
                    return
                }
                val qgbActivity = requireActivity()
                Thread {
                    val qgbParked = java.util.concurrent.CountDownLatch(1)
                    val qgbRelease = java.util.concurrent.CountDownLatch(1)
                    qgbActivity.runOnUiThread(object : Runnable {
                        override fun run() {
                            val qgbRoot = qgbActivity.window.decorView
                            if (qgbRoot.isLayoutRequested || qgbRoot.parent?.isLayoutRequested == true) {
                                qgbRoot.post(this)
                            } else {
                                qgbParked.countDown()
                                qgbRelease.await()
                            }
                        }
                    })
                    qgbParked.await()
                    com.example.util.simpletimetracker.domain.QgbFlags.fired("name-error-off-main-thread")
                    try {
                        qgbApplyNameError(error)
                    } finally {
                        qgbRelease.countDown()
                    }
                }.start()
            }

            private fun qgbApplyNameError(error: String) = with(binding) {
                inputChangeRecordTypeName.error = error
                inputChangeRecordTypeName.isErrorEnabled = error.isNotEmpty()
            }

  # ANR — Delete on a tracked record's edit screen parks the main thread on a latch whose
  # countDown is posted to the main Looper it just parked: a permanent, timing-free
  # deadlock inside the click handler (btnChangeRecordDelete -> onDeleteClick, main
  # thread). Nothing is deleted, and the route's next touch goes unanswered, so Android
  # raises the ANR itself.
  - id: record-delete-blocks-main-thread
    title: Deleting a record freezes the app
    patch:
      file: features/feature_change_record/src/main/java/com/example/util/simpletimetracker/feature_change_record/viewModel/ChangeRecordViewModel.kt
      find: |-
        fun onDeleteClick() {
                recordId?.let { removeRecordId.set(it) }
      replace: |-
        fun onDeleteClick() {
                // BUG(record-delete-blocks-main-thread): the main thread waits on work posted to itself.
                if (recordId != null && run {
                        val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                        try { com.example.util.simpletimetracker.domain.QgbFlags.on("record-delete-blocks-main-thread") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                    }
                ) {
                    run {
                        val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                        try { com.example.util.simpletimetracker.domain.QgbFlags.fired("record-delete-blocks-main-thread") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                    }
                    val qgbLatch = java.util.concurrent.CountDownLatch(1)
                    android.os.Handler(android.os.Looper.getMainLooper()).post { qgbLatch.countDown() }
                    qgbLatch.await()
                }
                recordId?.let { removeRecordId.set(it) }

