  # DISPLAY (content-format) — the Statistics list states each item's share against TWICE
  # the total, so a lone activity reads "50%" while "Total tracked" equals its own
  # duration. Stored records are untouched. Shared core mapper (StatisticsViewDataInteractor
  # -> mapItemsList -> mapItem). Record times are kept to the minute, so a route's short
  # session is often 0 ms long and getDurationPercentString then divides 100 by the item
  # count instead; both the total and the count are doubled, so the seeded share is half
  # of the clean one on either branch and the case does not depend on a minute boundary.
  # Every mapped item shows the wrong share, so the canary fires whenever one is mapped.
  - id: statistics-share-halved
    title: The statistics list shows each activity's share as half of what it is
    patch:
      file: core/src/main/java/com/example/util/simpletimetracker/core/mapper/StatisticsViewDataMapper.kt
      find: |-
        val durationPercent = statisticsMapper.getDurationPercentString(
                    sumDuration = sumDuration,
                    duration = statistics.data.duration,
                    statisticsSize = statisticsSize,
      replace: |-
        // BUG(statistics-share-halved): the share is taken against twice the total.
                val qgbHalved = run {
                    val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                    try { com.example.util.simpletimetracker.domain.QgbFlags.on("statistics-share-halved") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                }
                if (qgbHalved) {
                    val qgbP = android.os.StrictMode.allowThreadDiskWrites()
                    try { com.example.util.simpletimetracker.domain.QgbFlags.fired("statistics-share-halved") } finally { android.os.StrictMode.setThreadPolicy(qgbP) }
                }
                val durationPercent = statisticsMapper.getDurationPercentString(
                    sumDuration = if (qgbHalved) sumDuration * 2 else sumDuration,
                    duration = statistics.data.duration,
                    statisticsSize = if (qgbHalved) statisticsSize * 2 else statisticsSize,

