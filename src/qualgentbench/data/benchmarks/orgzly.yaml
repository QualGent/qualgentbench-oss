# QGB-CANARY-7f3a91c4e85b2d06  <- contamination canary. An agent must NEVER see this file; if this
# token appears in an episode transcript the episode is void. Do not remove.
# Orgzly Revived (github.com/orgzly-revived/orgzly-android-revived) — seeded-bug benchmark
# app, HARD tier. An org-mode outliner: notebooks of nested notes with TODO states,
# scheduled/deadline timestamps, repeaters, priorities, tags and an agenda.
#
# This app carries CONDITIONAL defects: each fires only under a combination the brief
# does not spell out (a repeater, a deadline, an edit), never
# as a plain no-op. Two areas are HIDDEN (`hidden: true`): the brief does not name them
# — an agent must notice a wrong value on screen and report it under `other`; the
# scorer maps such a report onto the hidden area by its probe keywords.
#
# Storage: Room databases/orgzly.db — `notes` (title, state, tags, priority,
# scheduled_range_id → org_ranges.string), `books`. The app ships a "Getting Started
# with Orgzly" notebook (33 notes) on first launch, which every check uses.
#
# Bug spread: a repeating task marked DONE loses its recurrence (L4 — org semantics say
# it should shift and stay TODO); DONE is silently ignored on notes that carry a
# deadline (L3); tags survive creation but are dropped by an edit (L2). Hidden: priority letters render one
# step off; the notebook list under-counts notes by one.

app:
  id: orgzly
  name: Orgzly Revived
  package: com.orgzlyrevived                   # fdroid flavor, no debug suffix
  platform: android
  difficulty: hard

apk:
  repo: qualgent/qualgentbench-apps
  filename: hard/orgzly-buggy.apk
  sha256: 4ea502448514cfa5dad514b3ae79eb9ffddbf4880c44229444d80797c384b52c
  size_bytes: 27263299

build:
  repo: https://github.com/orgzly-revived/orgzly-android-revived
  dir: orgzly-revived                          # under QualGent-Repos/
  ref: "v1.23.0"                               # release tag
  gradle_task: ":app:assembleFdroidDebug"
  apk_glob: "app/build/outputs/apk/fdroid/debug/*.apk"

flags:
  file: app/src/main/java/com/orgzly/android/QgbFlags.kt
  package: com.orgzly.android

# The Notebooks list shows a note count only when that detail is enabled; seed the
# preference so the hidden count defect is on screen (defaults fill the rest).
device_setup:
  push:
    - {src: assets/orgzly/prefs.xml, dest: /sdcard/qgb-orgzly-prefs.xml}
  shell:
    - "run-as com.orgzlyrevived mkdir -p shared_prefs"
    - "cat /sdcard/qgb-orgzly-prefs.xml | run-as com.orgzlyrevived sh -c 'cat > shared_prefs/com.orgzlyrevived_preferences.xml'"

exploration:
  id: explore-orgzly
  step_budget: 500
  title: "Release sign-off — Outliner"
  features:
    # `check:` states HOW to exercise the area, never whether it works — the state is
    # DERIVED by running it with the seeded defects on and off (truth.py).
    # Notes are created from a notebook's + (id fab); the editor's fields are ids
    # (title — NOT `name`, that is the property-name field —, state_button, scheduled_button, deadline_button, priority_button,
    # tags_button) and "Done" saves. The timestamp dialog has today/tomorrow buttons,
    # a repeater checkbox (default .+1w) and "Set". Long-pressing a note shows "Done"
    # (mark done) in the toolbar. The sample notebook holds 33 notes, so a new note
    # lands off-screen: scroll to the end (swipe up ×6) or reach it through Search.
    # The navigation drawer cannot be opened by the replay grammar (edge swipes are
    # gesture navigation), so no area depends on it.
    - id: notebook_list
      state: ok
      probe: [notebook]
      check:
        steps: [launch]
        expect: {present: "Getting Started with Orgzly"}
    - id: create_note
      state: ok
      probe: [note, create]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "Done"}, wait]
        expect: {db: orgzly.db, equals: "1",
                 query: "select count(*) from notes where title='QA task';"}
    - id: note_list
      state: ok
      probe: [note, list]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "Done"}, relaunch, {tap: "Search"}, {type: "QA task"}, wait]
        expect: {present: "QA task"}
    - id: set_state
      state: ok
      probe: [state, todo]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "state_button"}, {tap: "TODO"}, {tap: "Done"}, wait]
        expect: {db: orgzly.db, equals: "TODO",
                 query: "select state from notes where title='QA task';"}
    - id: search
      state: ok
      probe: [search]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "Done"}, {tap: "Search"}, {type: "QA task"}]
        expect: {present: "QA task"}
    - id: settings
      state: ok
      probe: [settings]
      check:
        steps: [launch, {tap: "More options"}, {tap: "Settings"}]
        expect: {present: "Settings"}
    - id: repeating_done
      state: broken
      bug_id: repeater-done-loses-recurrence
      probe: [repeat, done]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "scheduled_button"}, {tap: "today_button"},
                {tap: "repeater_used_checkbox"}, {tap: "Set"}, {tap: "Done"},
                {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {long_press: "QA task"}, {tap: "Done"}, wait]
        # A repeating note returns to its PREVIOUS state after "done" (here: none) and
        # moves to the next occurrence; the seeded build stores DONE instead.
        expect: {db: orgzly.db, equals: "",
                 query: "select state from notes where title='QA task';"}
    - id: deadline_done
      state: broken
      bug_id: done-ignored-with-deadline
      probe: [deadline, done]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "deadline_button"}, {tap: "today_button"}, {tap: "Set"},
                {tap: "Done"}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {long_press: "QA task"}, {tap: "Done"}, wait]
        expect: {db: orgzly.db, equals: "DONE",
                 query: "select state from notes where title='QA task';"}
    - id: edit_tags
      state: broken
      bug_id: tags-dropped-on-edit
      probe: [tag, edit]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "Done"}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up},
                {tap: "QA task"}, {tap: "tags_button"}, {type: "work"}, {tap: "Done"}, wait]
        expect: {db: orgzly.db, equals: "1",
                 query: "select count(*) from notes where title='QA task' and tags like '%work%';"}
    # HIDDEN — not named in the brief. Reported under `other` by an agent that notices.
    - id: priority_label
      state: broken
      hidden: true
      bug_id: priority-letter-shifted
      probe: [priority]
      check:
        steps: [launch, {tap: "Getting Started with Orgzly"}, {tap: "fab"}, {tap: "title"},
                {type: "QA task"}, {tap: "priority_button"}, {tap: "A"}, {tap: "Done"},
                {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, {swipe: up}, wait]
        expect: {present: "#A"}
    - id: notebook_count
      state: broken
      hidden: true
      bug_id: notebook-count-off-by-one
      probe: [count, notebook]
      check:
        steps: [launch, wait]
        expect: {present: "33"}
  instruction: |
    You are a QA engineer. This build of an outliner / task app (org-mode notebooks) has
    been handed to you for release sign-off. The list below is what the product team
    says each area should do. Verify them on the device and report what you actually
    observe. Also report anything else on screen that looks incorrect (use an area name
    starting with "other" and describe exactly what you saw and on which screen).

    A notebook is opened from the Notebooks list; its + button creates a note. The
    note editor has state, scheduled time, deadline time, priority and tags. The
    timestamp dialog can add a repeater. Long-pressing a note selects it and shows
    its actions.

    SPECIFICATION
      - notebook_list: the Notebooks screen lists the notebooks that exist.
      - create_note: a note you create is listed in its notebook afterwards.
      - note_list: a notebook lists the notes it contains.
      - set_state: the state you give a note is the state shown afterwards.
      - search: searching for a note's title shows that note.
      - settings: settings screens open and the chosen options are what stays selected.
      - repeating_done: completing a task that has a repeater behaves the org-mode way — the task is rescheduled to its next occurrence and stays open (not DONE).
      - deadline_done: a task with a deadline can be completed like any other task.
      - edit_tags: tags you add when editing a note are kept.

bugs:
  # L4 — the shifted timestamp and the kept TODO state are computed, but with a
  # repeater present the note is written with DONE and its original date.
  - id: repeater-done-loses-recurrence
    title: Completing a repeating task loses its recurrence
    patch:
      file: app/src/main/java/com/orgzly/android/data/DataRepository.kt
      find: |-
        MiscUtils.lineCount(content),
        scl.state,
        getOrgRangeId(scl.scheduled),
      replace: |-
        MiscUtils.lineCount(content),
        // BUG(repeater-done-loses-recurrence): a shifted (repeating) note is stored DONE
        // with its old date instead of TODO with the next one.
        if (com.orgzly.android.QgbFlags.on("repeater-done-loses-recurrence") && scl.isShifted) state else scl.state,
        if (com.orgzly.android.QgbFlags.on("repeater-done-loses-recurrence") && scl.isShifted) getOrgRangeId(OrgRange.parseOrNull(note.scheduled)) else getOrgRangeId(scl.scheduled),

  # L3 — notes with a DEADLINE are skipped when a done state is applied.
  - id: done-ignored-with-deadline
    title: A task with a deadline cannot be marked done
    patch:
      file: app/src/main/java/com/orgzly/android/data/DataRepository.kt
      find: |-
        val scl = StateChangeLogic(doneKeywords)
      replace: |-
        // BUG(done-ignored-with-deadline): a note carrying a deadline is skipped.
        if (com.orgzly.android.QgbFlags.on("done-ignored-with-deadline") && note.deadline != null) return@forEach
        val scl = StateChangeLogic(doneKeywords)

  # L2 — editing a note writes it back with no tags.
  - id: tags-dropped-on-edit
    title: Editing a note drops its tags
    patch:
      file: app/src/main/java/com/orgzly/android/data/DataRepository.kt
      find: |-
        tags = Tags(notePayload.tags)
        )

        val count = db.note().update(newNote)
      replace: |-
        // BUG(tags-dropped-on-edit): the edited note is stored without tags.
        tags = if (com.orgzly.android.QgbFlags.on("tags-dropped-on-edit")) Tags(emptyList()) else Tags(notePayload.tags)
        )

        val count = db.note().update(newNote)

  # HIDDEN UI — the priority cookie renders one letter too high (A shows as #B).
  - id: priority-letter-shifted
    title: The priority shown is one letter off
    patch:
      file: app/src/main/java/com/orgzly/android/ui/util/TitleGenerator.kt
      find: |-
        return "#${note.priority}"
      replace: |-
        // BUG(priority-letter-shifted): the displayed letter is one step above the stored one.
        return if (com.orgzly.android.QgbFlags.on("priority-letter-shifted") && !note.priority.isNullOrEmpty()) "#${note.priority!![0] + 1}" else "#${note.priority}"

  # HIDDEN UI — the Notebooks list shows one note fewer than the notebook holds.
  - id: notebook-count-off-by-one
    title: The notebook list under-counts notes by one
    patch:
      file: app/src/main/java/com/orgzly/android/ui/books/BooksAdapter.kt
      find: |-
        R.plurals.notes_count_nonzero, item.noteCount, item.noteCount)
      replace: |-
        // BUG(notebook-count-off-by-one): the displayed count is one short.
        R.plurals.notes_count_nonzero, item.noteCount, if (com.orgzly.android.QgbFlags.on("notebook-count-off-by-one")) item.noteCount - 1 else item.noteCount)

  # ── journey-only CRASH, NAVIGATION and LIFECYCLE defects (QUA-2729, epic QUA-2723) —
  # no exploration feature, so hunt mode never activates them (write_bug_flags' explore
  # branch activates the bug_ids of `state: broken` FEATURES only), and the hard tier
  # does not move. They exist for data/test-cases/orgzly.yaml, where they replace the two
  # persistence defects that file no longer seeds (docs/defect-classes.md, section 8: the
  # patches of `done-ignored-with-deadline` and `tags-dropped-on-edit` stay above, because
  # each is also a hard-tier hunt defect with a derived `broken` row in
  # truth/hard-stability.json).
  #
  # Templates: medtimer's medicine-list-empty-reminders-crash (crash) and
  # fossify-calendar's view-switch-stuck-on-year (navigation) and repeat-lost-on-rotation
  # (lifecycle). Each fault fires UNCONDITIONALLY on the path a tester takes — no race, no
  # timing, no device margin — and calls `QgbFlags.fired(...)` inside its own flag branch
  # on the line BEFORE the fault, only on the path that actually faults, so a marker on
  # disk means this seeded site is what ran. This build installs no StrictMode
  # (AppUnderTest's policies are `if (false)`, App.java's is commented out), so the
  # synchronous File.createNewFile the marker does on the UI thread is not punished.
  #
  # WHERE THE CRASH SITS. Every screen these three touch — the Notebooks list, a
  # notebook, the note editor — is a FRAGMENT of MainActivity, and LauncherActivity
  # finish()es itself the moment it has started MainActivity. So MainActivity is the
  # task's only activity, the crash finishes the whole task, and the device lands on the
  # LAUNCHER (isolate_app_under_test sends HOME last, QUA-2733). A crash in Settings (a
  # second activity) would resume this app's own list instead; none is seeded there.
  #
  # THE LEGACY-FALLBACK CAVEAT, as for the other apps' journey-only defects: with
  # files/qgb_flags.txt MISSING the shim turns every defect on. None of these three is on
  # a hunt route: no hunt check nests a note six levels deep or rotates, and the one hunt
  # check that opens a note by tapping it (`edit_tags`, "QA task") taps the notebook's
  # LAST row, which `note-tap-opens-next-note` resolves to itself.

  # CRASH — a note nested six levels deep kills the notebook view. An Org outline has no
  # depth limit, and the sample notebook says so out loud ("There is no limit to the
  # number of levels you can have", whose child "Use this to better organize your notes"
  # sits at level 4, the deepest the sample goes). A tester checking that claim adds a
  # note under the deepest one, and one more under that.
  #
  # THE FAULT. Every row of a notebook draws one vertical indent guide per level below
  # the top (NoteItemViewBinder.setupIndent: `level - 1` guides). The row layout
  # (res/layout/item_head.xml) PRE-INFLATES four of them — "Optimal number of indents. We
  # want to avoid inflating as much as possible" — and setupIndent's first branch
  # inflates the rest when a row needs more. That branch first makes the existing guides
  # visible, looping `1..container.childCount`; the patch loops `1..level` instead, which
  # is exactly how the other two branches' loops read, so it is the "make the three loops
  # agree" slip. The first guide past the four that exist has not been inflated yet, so
  # `getChildAt()` returns null and Kotlin's `.visibility =` on the platform-typed null
  # throws java.lang.NullPointerException in onBindViewHolder, on the main thread — the
  # process dies. The branch is reached only by a row that needs MORE than four guides,
  # i.e. a note at level 6 or deeper: the sample's deepest row needs three and a level-5
  # note exactly four, so every other row in the corpus renders as before.
  - id: deep-outline-indent-crash
    title: A note nested six levels deep kills the notebook view
    patch:
      file: app/src/main/java/com/orgzly/android/ui/notes/NoteItemViewBinder.kt
      # Five lines: `for (i in 1..container.childCount) {` alone also opens the `else`
      # branch's loop, and build_app.py refuses an ambiguous anchor; the branch's own
      # first line pins it to the grow branch.
      find: |-
        container.childCount < level -> { // More levels needed
        // Make all existing levels visible
        for (i in 1..container.childCount) {
        container.getChildAt(i - 1).visibility = View.VISIBLE
        }
      replace: |-
        container.childCount < level -> { // More levels needed
            // Make all existing levels visible
            if (com.orgzly.android.QgbFlags.on("deep-outline-indent-crash")) {
                // BUG(deep-outline-indent-crash): the loop runs to the note's depth, as the
                // other two branches' loops do, instead of to the guides that exist. The first
                // guide past the four the row layout pre-inflates is not there yet, so
                // getChildAt() returns null: NullPointerException.
                com.orgzly.android.QgbFlags.fired("deep-outline-indent-crash")
                for (i in 1..level) {
                    container.getChildAt(i - 1).visibility = View.VISIBLE
                }
            } else {
                for (i in 1..container.childCount) {
                    container.getChildAt(i - 1).visibility = View.VISIBLE
                }
            }

  # WRONG NAVIGATION — tapping a note in a notebook opens the note below it. "Wrong
  # control flow or navigation" is an 11% plan target, and the note tree is the one
  # structure every orgzly journey walks: the sample notebook's first tip is literally
  # "Click on the note to open it".
  #
  # THE FAULT. BookFragment.onNoteClick is the single chokepoint for "open the note this
  # row shows" (a tap with nothing selected). The adapter hands it the row's NoteView; the
  # patch re-resolves the row against the fragment's own note list (viewModel.data) by
  # ADAPTER position — the classic header offset slip: BookAdapter is a
  # ListAdapterWithHeaders whose position 0 is the notebook's preface row, so adapter
  # position p is note p-1, and notes[p] is the note BELOW the tapped one. `getOrNull`
  # with the row's own note as the fallback is the defensive Kotlin such a lookup is
  # written with, so the LAST row (whose position is one past the list) opens itself and
  # nothing throws. Nothing crashes and nothing is written: the app is alive in the note
  # editor, showing a note the user did not ask for, which is what makes it `navigation`.
  #
  # WHY IT IS CHECKABLE FROM THE HIERARCHY. The destination's text says which note it is:
  # the editor shows the opened note's title (and content). The case reads `present:` of
  # the tapped note's title on the destination; the note below it has another title.
  - id: note-tap-opens-next-note
    title: Tapping a note in a notebook opens the note below it
    patch:
      file: app/src/main/java/com/orgzly/android/ui/notes/book/BookFragment.kt
      # Five lines: `openNote(noteView.note.id)` alone also matches onNoteLongClick's
      # reverse-click branch (line ~588), and build_app.py refuses an ambiguous anchor; the
      # selection check above it occurs only here.
      find: |-
        if (viewAdapter.getSelection().count > 0) {
        toggleNoteSelection(position, noteView)
        } else {
        openNote(noteView.note.id)
        }
      # `fired()` on the line BEFORE the substituted note is opened, and only when the
      # substitution actually changed the note (the last row resolves to itself).
      replace: |-
        if (viewAdapter.getSelection().count > 0) {
            toggleNoteSelection(position, noteView)
        } else {
            // BUG(note-tap-opens-next-note): the tapped row is looked up in the fragment's own
            // note list by ADAPTER position, which counts the preface row above the notes —
            // so the note BELOW the tapped one is the one that opens.
            val qgbTarget = if (com.orgzly.android.QgbFlags.on("note-tap-opens-next-note")) (viewModel.data.value?.notes?.getOrNull(position) ?: noteView) else noteView
            if (qgbTarget.note.id != noteView.note.id) com.orgzly.android.QgbFlags.fired("note-tap-opens-next-note")
            openNote(qgbTarget.note.id)
        }

  # LIFECYCLE — a new note's title is lost when the screen is rotated. "Lifecycle and
  # state loss" is a 7% plan target. An in-progress note is exactly the state a rotation
  # should not lose.
  #
  # THE FAULT. NoteFragment keeps the in-progress note in a NotePayload on its ViewModel,
  # and the typed TITLE lives only in the title view until updatePayloadFromViews() copies
  # it in (priority and tags too; state and the planning times go straight into the
  # payload from their dialogs). onSaveInstanceState syncs the views into the payload and
  # then writes the payload into the Bundle, and the Bundle is what brings it back:
  # after a rotation, onActivityCreated calls loadData(), which RESETS the payload — a
  # fresh one for a new note — and only then restores the Bundle's copy over it. The
  # patch skips the sync: the Bundle gets the payload as it was when the editor opened,
  # with an empty title, the recreated editor comes back blank, and Done refuses it
  # ("Title cannot be empty") — nothing is stored. Same statements, same order, one call
  # skipped.
  #
  # WHY THE CLEAN ARM IS NOT TRIVIALLY TRUE, AND WHY THE VIEW'S OWN STATE DOES NOT SAVE
  # IT. The title EditText does save its text in the view hierarchy state, and Android
  # restores it — but the restored payload is applied AFTER that, from loadData()'s
  # postValue on a disk-IO thread, which reaches the main looper only once the recreate
  # has finished (onViewStateRestored runs inside it). So the payload wins either way:
  # the upstream build carries the title across because the Bundle holds it, and the
  # seeded build writes over the view's own restored text with the empty payload.
  #
  # WHY IT IS DETERMINISTIC. Not a race and not a widened window: the title is either in
  # the Bundle's payload or it is not. `fired()` is the whole of the branch that skips
  # the sync, a synchronous File.createNewFile inside onSaveInstanceState, as in
  # fossify-calendar's repeat-lost-on-rotation.
  - id: new-note-title-lost-on-rotation
    title: A new note's title is lost when the screen is rotated
    patch:
      file: app/src/main/java/com/orgzly/android/ui/note/NoteFragment.kt
      # `viewModel.savePayloadToBundle(outState)` is unique in this file, and the sync
      # above it is inside the anchor because the replace gates it.
      find: |-
        if (::binding.isInitialized) {
        updatePayloadFromViews()
        }

        viewModel.savePayloadToBundle(outState)
      replace: |-
        if (::binding.isInitialized) {
            if (com.orgzly.android.QgbFlags.on("new-note-title-lost-on-rotation")) {
                // BUG(new-note-title-lost-on-rotation): the payload is written into the saved
                // state WITHOUT first being synced from the views, so the title typed so far
                // is not in it and the recreated editor comes back with the empty title.
                com.orgzly.android.QgbFlags.fired("new-note-title-lost-on-rotation")
            } else {
                updatePayloadFromViews()
            }
        }

        viewModel.savePayloadToBundle(outState)

# ── Guided tasks (one skill per episode) ─────────────────────────────────────────
tasks:
  - id: orgzly-repeating-done
    tier: L4
    bug_id: repeater-done-loses-recurrence
    type: bug
    title: Completing a repeating task reschedules it
    expected_verdict: FAIL
    optimal_steps: 14
    step_budget: 60
    instruction: |
      Verify repeating tasks. In the sample notebook create a TODO note, schedule it for
      today with a repeater (e.g. +1w), save it, then mark it done from the note list.
      Org-mode semantics: the note should remain TODO with its scheduled date moved to
      the next occurrence. If it simply becomes DONE, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: repeat, screen_keywords: ["repeat", "done"]}

  - id: orgzly-deadline-done
    tier: L3
    bug_id: done-ignored-with-deadline
    type: bug
    title: A task with a deadline can be completed
    expected_verdict: FAIL
    optimal_steps: 12
    step_budget: 55
    instruction: |
      Verify completing tasks that have a deadline. Create a TODO note with a deadline
      of today, save it, then mark it done from the note list. It should show as DONE.
      If it stays TODO, that is a bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: deadline, screen_keywords: ["deadline", "done"]}

  - id: orgzly-edit-tags
    tier: L2
    bug_id: tags-dropped-on-edit
    type: bug
    title: Tags added while editing are kept
    expected_verdict: FAIL
    optimal_steps: 12
    step_budget: 55
    instruction: |
      Verify tags. Create a note, save it, open it again, add a tag (e.g. work) and
      save. The note should show the tag in the list. If the tag is missing, that is a
      bug.

      Finish your report with EXACTLY one line: RESULT: feature=<ok|broken>
    flow_steps:
      - {id: tags, screen_keywords: ["tag"]}

  - id: orgzly-priority-label
    tier: L2
    bug_id: priority-letter-shifted
